<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro kvíz: Pravé Husákovy děti dají 10/10. Poznáte věci, co měl doma každý?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 20px 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
  .perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
  .q {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .opt:disabled { cursor: default; }
  #evalBtn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  #evalBtn:hover { background: #4a6b4e; }
  #evalBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a2b2b; margin-top: 14px; min-height: 1.2em; }
  #result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 28px;
    display: none;
  }
  .score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
  .verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
  #retryBtn {
    display: block;
    margin: 28px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  #retryBtn:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    .q { padding: 20px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Retro kvíz: Pravé Husákovy děti dají 10/10. Poznáte věci, co měl doma každý?</h1>
  <p class="perex">Sifon syčel v kuchyni, tuba Indulony voněla u umyvadla a v obýváku hrálo rádio. Deset otázek na věci a značky, které měl za normalizace doma skoro každý. Kolik jich po letech poznáte a dáte plných deset?</p>
  <div id="quiz"></div>
  <button id="evalBtn" disabled>Vyhodnotit</button>
  <div class="hint" id="hint"></div>
  <div id="result">
    <div class="score" id="score"></div>
    <div class="verdict" id="verdict"></div>
    <button id="retryBtn">Zkusit znovu</button>
  </div>
</div>
<script>
const questions = [
  { q: `Z které země pocházelo oblíbené univerzální koření Vegeta, které za normalizace stálo skoro v každé československé kuchyni?`,
    opts: [`Maďarsko`, `Jugoslávie`, `Polsko`, `Bulharsko`], correct: 1 },
  { q: `Jakým typem přístroje byla oblíbená kufříková Tesla Sonet, kterou si rodiny pořizovaly od konce 50. let?`,
    opts: [`kotoučový magnetofon`, `gramofon`, `tranzistorové rádio`, `promítačka na diapozitivy`], correct: 0 },
  { q: `Od kterého dobově příznačného slova je odvozen název krému na ruce Indulona, vyráběného už od roku 1948?`,
    opts: [`elektrifikace`, `modernizace`, `industrializace`, `kolektivizace`], correct: 2 },
  { q: `Čím jsou plněné klasické slovenské oplatky Horalky, které se v Seredi pečou od 60. let?`,
    opts: [`lískooříškovou náplní`, `kakaovou náplní`, `kokosovou náplní`, `arašídovou náplní`], correct: 3 },
  { q: `Jaký název nesla tuzemská plastová stavebnice uvedená na trh v roce 1979, jejímž základem jsou modré tyčky a bílé křížové spojky?`,
    opts: [`Cheva`, `Seva`, `Merkur`, `Monti`], correct: 1 },
  { q: `Co znamená značka TON, pod níž se v Bystřici pod Hostýnem vyráběl proslulý ohýbaný nábytek?`,
    opts: [`Továrna na ohýbaný nábytek`, `Tvarovaný ohýbaný nábytek`, `Truhlárny ohýbaného nábytku`, `Tovární obrobna nábytku`], correct: 0 },
  { q: `Které tuzemské vydavatelství bylo za normalizace zdaleka největší gramofonovou firmou a vydávalo většinu domácí hudební produkce?`,
    opts: [`Panton`, `Opus`, `Supraphon`, `Artia`], correct: 2 },
  { q: `Ve kterém moravském městě se vyráběly sportovní míče značky Gala?`,
    opts: [`Přerov`, `Zlín`, `Kroměříž`, `Prostějov`], correct: 3 },
  { q: `Ve kterém jihočeském městě se od 60. let vyráběly školní fixy a popisovače Centropen?`,
    opts: [`Dačice`, `Jindřichův Hradec`, `Třeboň`, `Písek`], correct: 0 },
  { q: `Obchodní název tesil, z něhož se šily nemačkavé košile a obleky, označoval jaké syntetické vlákno?`,
    opts: [`polyamidové`, `polyesterové`, `viskózové`, `akrylové`], correct: 1 }
];

const answers = new Array(questions.length).fill(null);
let locked = false;
const quizEl = document.getElementById('quiz');
const evalBtn = document.getElementById('evalBtn');
const hintEl = document.getElementById('hint');
const letters = ['a', 'b', 'c', 'd'];

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = (qi + 1) + '. ' + item.q;
    box.appendChild(qt);
    item.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = letters[oi] + ') ' + opt;
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll('.opt')).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateBtn();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateBtn() {
  const allAnswered = answers.every(a => a !== null);
  evalBtn.disabled = !allAnswered;
  if (allAnswered) hintEl.textContent = '';
}

function evaluate() {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.opt');
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (oi === answers[qi]) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  showResult(score);
}

function showResult(score) {
  const total = questions.length;
  document.getElementById('score').textContent = score + ' z ' + total;
  let text = '';
  if (score <= 3) {
    text = `Věci ze socialistické domácnosti vám dnes splývají. Sifon i tuba Indulony vám ještě něco řeknou, u méně omílaných značek jste ale tápali. Dobu jste možná zastihli jen okrajem dětství, na pravé Husákovo dítě to zatím nevydá. Nevadí, stačí zalistovat starými fotkami a leccos se vám samo vybaví.`;
  } else if (score <= 6) {
    text = `Poctivý průměr Husákova dítěte. Slavnější kousky té doby máte v malíku, u zrádnějších detailů, jako je stavebnice s bílými spojkami nebo město, kde se šily fixy, jste ale zaváhali. Přesně tady se schází většina těch, kdo normalizaci na vlastní kůži prožili.`;
  } else if (score <= 9) {
    text = `Výborný výkon. Domácnost za normalizace znáte napříč obory, od kuchyně a koupelny přes obývák až po školní penál a sportovní tašku. K plnému počtu a titulu pravého Husákova dítěte vám chybělo opravdu jen pár drobností, které si dnes vybaví málokdo.`;
  } else {
    text = `Plný počet a titul pravého Husákova dítěte. Věci, co měl doma skoro každý, znáte do posledního detailu, od univerzálního koření Vegeta přes ohýbané židle TON až po nemačkavý tesil. Takový přehled o normalizační domácnosti dnes už má málokdo, klobouk dolů.`;
  }
  document.getElementById('verdict').textContent = text;
  const result = document.getElementById('result');
  result.style.display = 'block';
  evalBtn.style.display = 'none';
  result.scrollIntoView({ behavior: 'smooth' });
}

function retry() {
  locked = false;
  answers.fill(null);
  document.getElementById('result').style.display = 'none';
  evalBtn.style.display = 'block';
  evalBtn.disabled = true;
  hintEl.textContent = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

evalBtn.addEventListener('click', evaluate);
document.getElementById('retryBtn').addEventListener('click', retry);
render();
</script>
</body>
</html>
