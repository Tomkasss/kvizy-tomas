<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Jak dobře rozumíte polštině? 10/10 dá jen ten, kdo žil u hranic</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  margin: 0;
  padding: 40px 20px;
  color: #2c2c2c;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.1rem; line-height: 1.6; color: #4a4a4a; margin: 0 0 32px; }
.otazka {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; line-height: 1.5; }
.varianta {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  cursor: pointer;
}
.varianta:last-child { margin-bottom: 0; }
.varianta:hover { background: #ede8e1; }
.varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
#vyhodnotit {
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  cursor: pointer;
  font-family: inherit;
}
#vyhodnotit:hover { background: #4a6b4e; }
#vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
#hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.2em; }
#vysledek {
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 40px;
  border-top: 4px solid #5b7e5f;
}
#skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
#hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; line-height: 1.65; margin: 0; }
#znovu {
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  cursor: pointer;
  font-family: inherit;
}
#znovu:hover { background: #756658; }
.skryty { display: none; }
@media (max-width: 600px) {
  body { padding: 16px; }
  h1 { font-size: 1.5rem; }
  .otazka { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz: Jak dobře rozumíte polštině? 10/10 dá jen ten, kdo žil u hranic</h1>
<p class="perex">Polština zní Čechovi povědomě, jenže právě v tom je past. Deset slov a nápisů z obchodů, cedulí, kuchyně i rodinného života ukáže, jestli byste se u sousedů domluvili, nebo si nápis vyložili přesně naopak.</p>

<div id="kviz"></div>

<button id="vyhodnotit" disabled>Vyhodnotit</button>
<p id="hlaska"></p>

<div id="vysledek" class="skryty">
  <p id="skore"></p>
  <p id="hodnoceni"></p>
  <button id="znovu">Zkusit znovu</button>
</div>
</div>

<script>
var otazky = [
  {
    q: `Co znamená polský nápis „Wstęp wzbroniony"?`,
    a: [`vstup na vlastní nebezpečí`, `vstup pouze v doprovodu`, `vstup přísně zakázán`, `vstup jen pro zaměstnance`],
    spravna: 2
  },
  {
    q: `Co znamená polsky „Do zobaczenia"?`,
    a: [`na shledanou`, `dobrý den`, `není zač`, `omlouvám se`],
    spravna: 0
  },
  {
    q: `Co znamená polsky „wyprzedaż"?`,
    a: [`předprodej vstupenek`, `doprodej zboží se slevou`, `prodej zboží na splátky`, `prodej zboží na objednávku`],
    spravna: 1
  },
  {
    q: `Co znamená polsky „przedszkole"?`,
    a: [`první stupeň základní školy`, `mateřská škola`, `školní družina`, `jesle pro nejmenší`],
    spravna: 1
  },
  {
    q: `Co znamená polsky „warzywa"?`,
    a: [`zelenina`, `luštěniny`, `vývary a polévky`, `koření`],
    spravna: 0
  },
  {
    q: `Co znamená polsky „krzesło"?`,
    a: [`křeslo s područkami`, `lavice u stolu`, `židle s opěradlem`, `stolička bez opěradla`],
    spravna: 2
  },
  {
    q: `Co znamená polsky „kwiecień"?`,
    a: [`březen`, `duben`, `květen`, `červen`],
    spravna: 1
  },
  {
    q: `Co znamená polsky „wujek"?`,
    a: [`dědeček`, `synovec`, `kmotr`, `strýc`],
    spravna: 3
  },
  {
    q: `Co znamená polsky „pachnieć"?`,
    a: [`vonět`, `páchnout`, `čichat k něčemu`, `vadnout, uvadat`],
    spravna: 0
  },
  {
    q: `Co znamená polsky „sopel"?`,
    a: [`závěj sněhu u plotu`, `námraza na okně`, `rampouch`, `kroupy`],
    spravna: 2
  }
];

var hodnoceni = [
  { min: 0, max: 3, text: `Polštinu podle všeho slyšíte poprvé. Trefili jste nanejvýš tři odpovědi, tedy zhruba tolik, kolik vynese samotné tipování ze čtyř nabídek. Podoba obou jazyků vás přitom nejspíš svedla tam, kde slovo vypadalo česky a znamenalo něco docela jiného. V polském obchodě byste si vystačili s ukazováním.` },
  { min: 4, max: 6, text: `Rozumíte tomu, co je češtině nejblíž, a dál vás to nepustilo. Zvládli jste nápisy a fráze, kde se význam dá poskládat ze známých kořenů, ale jakmile slovo mířilo jinam, než napovídal první dojem, sáhli jste vedle. Chybí vám jen kousek k tomu, kam se běžně dostane každý, kdo polštinu občas slyší z dovolené nebo z rádia. Na tržnici byste se domluvili, na úřadě už ne.` },
  { min: 7, max: 9, text: `Výsledek, který slibuje pravidelnější kontakt s polštinou. Nachytat vás dokázalo jedno až tři slova, nejspíš ta, u nichž česká podoba táhla k opačnému významu, nebo to poslední, které se z češtiny neodvodí vůbec. Rozdíl mezi vámi a plným počtem není o slovní zásobě, ale o tom, kolikrát jste polský nápis nebo hovor slyšeli naživo. S Polákem byste vedli rozhovor a jen občas se zeptali znovu.` },
  { min: 10, max: 10, text: `Plný počet, na který u lidí bez studia polštiny narazíte málokdy. Nezakolísali jste ani tam, kde slovo vypadalo jako české a znamenalo něco docela jiného, ani u výrazu, který si Čech nemá z čeho odvodit. Takhle skóruje obvykle ten, kdo polštinu roky slýchá kolem sebe, ať už proto, že žil u hranic, jezdil za nákupy na druhou stranu, nebo ji má v rodině. Polsky rozumíte jako od hranic.` }
];

var pismena = [`a)`, `b)`, `c)`, `d)`];
var odpovedi = [];
var zamceno = false;

var kvizEl = document.getElementById(`kviz`);
var btnVyhodnotit = document.getElementById(`vyhodnotit`);
var hlaskaEl = document.getElementById(`hlaska`);
var vysledekEl = document.getElementById(`vysledek`);
var skoreEl = document.getElementById(`skore`);
var hodnoceniEl = document.getElementById(`hodnoceni`);
var btnZnovu = document.getElementById(`znovu`);

function vykresli() {
  kvizEl.innerHTML = ``;
  for (var i = 0; i < otazky.length; i++) {
    var box = document.createElement(`div`);
    box.className = `otazka`;

    var zneni = document.createElement(`p`);
    zneni.className = `zneni`;
    zneni.textContent = (i + 1) + `. ` + otazky[i].q;
    box.appendChild(zneni);

    for (var j = 0; j < otazky[i].a.length; j++) {
      var btn = document.createElement(`button`);
      btn.type = `button`;
      btn.className = `varianta`;
      btn.textContent = pismena[j] + ` ` + otazky[i].a[j];
      btn.setAttribute(`data-otazka`, String(i));
      btn.setAttribute(`data-varianta`, String(j));
      btn.addEventListener(`click`, klikVarianta);
      box.appendChild(btn);
    }
    kvizEl.appendChild(box);
  }
}

function klikVarianta(e) {
  if (zamceno) { return; }
  var btn = e.currentTarget;
  var oi = parseInt(btn.getAttribute(`data-otazka`), 10);
  var vi = parseInt(btn.getAttribute(`data-varianta`), 10);

  var vsechny = kvizEl.children[oi].querySelectorAll(`.varianta`);
  for (var k = 0; k < vsechny.length; k++) {
    vsechny[k].classList.remove(`vybrana`);
  }
  btn.classList.add(`vybrana`);
  odpovedi[oi] = vi;
  hlaskaEl.textContent = ``;
  zkontrolujHotovo();
}

function zkontrolujHotovo() {
  var hotovo = true;
  for (var i = 0; i < otazky.length; i++) {
    if (typeof odpovedi[i] !== `number`) { hotovo = false; }
  }
  btnVyhodnotit.disabled = !hotovo;
}

btnVyhodnotit.addEventListener(`click`, function () {
  if (btnVyhodnotit.disabled) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  var skore = 0;
  for (var i = 0; i < otazky.length; i++) {
    var vsechny = kvizEl.children[i].querySelectorAll(`.varianta`);
    var spravna = otazky[i].spravna;
    var zvolena = odpovedi[i];
    vsechny[spravna].classList.add(`spravna`);
    if (zvolena === spravna) {
      skore++;
    } else {
      vsechny[zvolena].classList.add(`spatna`);
    }
    for (var k = 0; k < vsechny.length; k++) {
      vsechny[k].classList.remove(`vybrana`);
      vsechny[k].disabled = true;
    }
  }
  zamceno = true;
  btnVyhodnotit.disabled = true;
  hlaskaEl.textContent = ``;

  skoreEl.textContent = skore + ` z ` + otazky.length;
  for (var h = 0; h < hodnoceni.length; h++) {
    if (skore >= hodnoceni[h].min && skore <= hodnoceni[h].max) {
      hodnoceniEl.textContent = hodnoceni[h].text;
    }
  }
  vysledekEl.classList.remove(`skryty`);
  vysledekEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

btnZnovu.addEventListener(`click`, function () {
  odpovedi = [];
  zamceno = false;
  vysledekEl.classList.add(`skryty`);
  hlaskaEl.textContent = ``;
  btnVyhodnotit.disabled = true;
  vykresli();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

vykresli();
</script>
</body>
</html>
