<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vědomostní test pro seniory 65+: těchto 10 otázek odhalí, co vám zůstalo v hlavě</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f0eb; font-family: Georgia, "Times New Roman", serif; color: #2c2c2c; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 1.9rem; line-height: 1.3; margin: 0 0 16px; color: #2c2c2c; }
  .perex { font-size: 1.05rem; line-height: 1.6; color: #4a4a4a; margin: 0 0 32px; }
  .box { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 28px; margin-bottom: 24px; }
  .qtext { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; line-height: 1.45; }
  .opt { display: block; width: 100%; text-align: left; padding: 14px 18px; margin: 0 0 10px; background: #f7f4f0; border: 1px solid #d9d2c9; border-radius: 8px; font-family: inherit; font-size: 1rem; color: #3a3a3a; cursor: pointer; }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { background: #f7f4f0; }
  .locked .opt.selected:hover { background: #dcd3c7; }
  .opt.correct, .locked .opt.correct:hover { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong, .locked .opt.wrong:hover { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .feedback { margin-top: 14px; font-size: 1rem; }
  .feedback.ok { color: #1e5631; }
  .feedback.bad { color: #721c24; }
  .btn { display: block; margin: 40px auto 0; background: #5b7e5f; color: #fff; padding: 16px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; border: none; font-family: inherit; cursor: pointer; }
  .btn:hover { background: #4a6b4e; }
  .btn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #721c24; margin-top: 12px; font-size: .95rem; min-height: 1.2em; }
  #result { background: #fefcf9; border-top: 4px solid #5b7e5f; text-align: center; display: none; margin-top: 40px; }
  #score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; margin: 0 0 12px; }
  #verdict { font-size: 1rem; color: #4a4a4a; line-height: 1.6; margin: 0; }
  #retry { background: #8c7b6b; }
  #retry:hover { background: #756658; }
  @media (max-width: 600px) {
    .wrap { padding: 20px 16px 40px; }
    h1 { font-size: 1.5rem; }
    .box { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="perex" id="perex"></p>
  <div id="questions"></div>
  <button class="btn" id="evaluate" disabled>Vyhodnotit</button>
  <div class="hint" id="hint">Odpovězte prosím na všechny otázky</div>
  <div class="box" id="result">
    <p id="score"></p>
    <p id="verdict"></p>
    <button class="btn" id="retry">Zkusit znovu</button>
  </div>
</div>
<script>
(function () {
  const title = `Vědomostní test pro seniory 65+: těchto 10 otázek odhalí, co vám zůstalo v hlavě`;
  const perex = `Za víc než šest desítek let vám ze školy, z novin, z televize i z knih leccos uvízlo v paměti. Co z toho vydrželo dodnes a co se nenápadně vytratilo? Ověřte si to na dějinách, vědě, sportu i umění.`;
  const questions = [
    { q: `Do kterého státu vpadla irácká armáda v srpnu 1990?`, o: [`do Íránu`, `do Kuvajtu`, `do Saúdské Arábie`, `do Sýrie`], a: 1 },
    { q: `Co podle Pierra de Coubertina znázorňuje pět kruhů na olympijské vlajce?`, o: [`pět disciplín antického pětiboje`, `pět zakládajících států olympijského hnutí`, `pět světadílů`, `pět olympijských ctností`], a: 2 },
    { q: `Slitinou kterých dvou kovů je mosaz?`, o: [`mědi a zinku`, `mědi a cínu`, `mědi a hliníku`, `mědi a niklu`], a: 0 },
    { q: `Která mise Apollo musela kvůli výbuchu kyslíkové nádrže upustit od přistání na Měsíci?`, o: [`Apollo 12`, `Apollo 13`, `Apollo 14`, `Apollo 15`], a: 1 },
    { q: `Ve kterém jazyce byly původně sepsány knihy Nového zákona?`, o: [`v hebrejštině`, `v latině`, `v aramejštině`, `v řečtině`], a: 3 },
    { q: `Jak se jmenuje planetka, ze které pochází Malý princ?`, o: [`B 612`, `K 318`, `A 216`, `D 504`], a: 0 },
    { q: `Ve kterém městě se roku 1972 hrál zápas o titul mistra světa v šachu mezi Fischerem a Spasským?`, o: [`v Helsinkách`, `ve Vídni`, `v Bělehradě`, `v Reykjavíku`], a: 3 },
    { q: `Kdo zkonstruoval první obchodně úspěšný parník?`, o: [`James Watt`, `George Stephenson`, `Robert Fulton`, `Josef Ressel`], a: 2 },
    { q: `Který oddíl žaludku krávy je jediným pravým žaludkem?`, o: [`bachor`, `slez`, `čepec`, `kniha`], a: 1 },
    { q: `Ve kterém muzeu je dnes vystaveno antické mramorové sousoší Laokoón a jeho synové?`, o: [`ve Vatikánských muzeích`, `v Louvru`, `v Kapitolských muzeích`, `v Národním archeologickém muzeu v Neapoli`], a: 0 }
  ];
  const verdicts = [
    { min: 0, max: 3, text: `Z těchhle deseti oblastí vám v hlavě zůstalo jen pár útržků a zbytek se za ta léta rozplynul. Paměť ale nezmizela, jen tyhle poznatky dlouho nikdo nepotřeboval. Stačí jednou zaslechnout správnou odpověď a velká část se zase vrátí na své místo.` },
    { min: 4, max: 6, text: `Základ drží pevně. Co jste slyšeli ve zprávách nebo se učili v lavici, se vybaví, ale jemnější podrobnosti už se začínají ztrácet. Zapomenuté to není, jen je to uložené hlouběji, než by bylo pohodlné.` },
    { min: 7, max: 9, text: `V hlavě vám toho zůstalo opravdu hodně a nejen to, co se opakovalo pořád dokola. Poradili jste si i s věcmi, které člověk zaslechne jednou a pak na ně roky nenarazí. Takhle vypadá paměť, kterou udržuje zvědavost.` },
    { min: 10, max: 10, text: `Všech deset, včetně otázky, na které ztroskotá i leckterý milovník umění. Co se k vám kdy dostalo, to u vás zůstalo a leží to přesně tam, kde má. Tohle zvládne jen menšina a vy mezi ni patříte.` }
  ];
  const letters = [`a`, `b`, `c`, `d`];

  document.getElementById(`title`).textContent = title;
  document.getElementById(`perex`).textContent = perex;

  const container = document.getElementById(`questions`);
  const evalBtn = document.getElementById(`evaluate`);
  const hint = document.getElementById(`hint`);
  const result = document.getElementById(`result`);
  let answers = [];
  let locked = false;

  function render() {
    container.innerHTML = ``;
    answers = new Array(questions.length).fill(null);
    locked = false;
    container.classList.remove(`locked`);
    questions.forEach(function (item, qi) {
      const box = document.createElement(`div`);
      box.className = `box`;
      const p = document.createElement(`p`);
      p.className = `qtext`;
      p.textContent = (qi + 1) + `. ` + item.q;
      box.appendChild(p);
      item.o.forEach(function (opt, oi) {
        const b = document.createElement(`button`);
        b.type = `button`;
        b.className = `opt`;
        b.textContent = letters[oi] + `) ` + opt;
        b.addEventListener(`click`, function () {
          if (locked) return;
          answers[qi] = oi;
          box.querySelectorAll(`.opt`).forEach(function (x) { x.classList.remove(`selected`); });
          b.classList.add(`selected`);
          update();
        });
        box.appendChild(b);
      });
      const fb = document.createElement(`div`);
      fb.className = `feedback`;
      box.appendChild(fb);
      container.appendChild(box);
    });
    result.style.display = `none`;
    evalBtn.style.display = `block`;
    update();
  }

  function update() {
    const done = answers.every(function (x) { return x !== null; });
    evalBtn.disabled = !done;
    hint.textContent = done ? `` : `Odpovězte prosím na všechny otázky`;
  }

  evalBtn.addEventListener(`click`, function () {
    if (locked) return;
    if (!answers.every(function (x) { return x !== null; })) return;
    locked = true;
    container.classList.add(`locked`);
    let score = 0;
    const boxes = container.querySelectorAll(`.box`);
    questions.forEach(function (item, qi) {
      const opts = boxes[qi].querySelectorAll(`.opt`);
      const fb = boxes[qi].querySelector(`.feedback`);
      opts[item.a].classList.add(`correct`);
      if (answers[qi] === item.a) {
        score++;
        fb.className = `feedback ok`;
        fb.textContent = `Správně.`;
      } else {
        opts[answers[qi]].classList.add(`wrong`);
        fb.className = `feedback bad`;
        fb.textContent = `Špatně. Správná odpověď: ` + letters[item.a] + `) ` + item.o[item.a];
      }
    });
    document.getElementById(`score`).textContent = score + ` z ` + questions.length;
    const v = verdicts.find(function (x) { return score >= x.min && score <= x.max; });
    document.getElementById(`verdict`).textContent = v ? v.text : ``;
    evalBtn.style.display = `none`;
    hint.textContent = ``;
    result.style.display = `block`;
    result.scrollIntoView({ behavior: `smooth`, block: `start` });
  });

  document.getElementById(`retry`).addEventListener(`click`, function () {
    render();
    window.scrollTo({ top: 0, behavior: `smooth` });
  });

  render();
})();
</script>
</body>
</html>
