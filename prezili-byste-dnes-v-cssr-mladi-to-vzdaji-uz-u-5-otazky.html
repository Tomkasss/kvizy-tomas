<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přežili byste dnes v ČSSR? Mladí to vzdají už u 5. otázky</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
.perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  color: #3a3a3a;
  cursor: pointer;
  transition: background .15s, border .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
.txt-input {
  width: 100%;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  color: #3a3a3a;
}
#submit {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #a05a4a; margin: 12px 0 0; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#retry {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retry:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
<h1>Přežili byste dnes v ČSSR? Mladí to vzdají už u 5. otázky</h1>
<p class="perex">Fronty na banány, poukázky do Tuzexu, večerníček přesně v sedm, o víkendu chata. Kdo tu éru prožil, měl svět srovnaný. Deset otázek prověří, jestli byste v socialistickém Československu obstáli i dnes. Kolik jich dáte?</p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<p class="hint" id="hint"></p>
<div id="result">
  <div id="score"></div>
  <p id="verdict"></p>
  <button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const questions = [
  { q: `1. Z jakého materiálu byla vyrobena karoserie východoněmeckého automobilu Trabant?`,
    options: [`z hliníkových plechů`, `z laminátu vyztuženého sklem`, `z duroplastu`, `z pozinkovaného ocelového plechu`], correct: 2 },
  { q: `2. Ve kterém roce zahájil pravidelné vysílání druhý (II.) program Československé televize?`,
    options: [`1966`, `1969`, `1970`, `1976`], correct: 2 },
  { q: `3. Z čeho se vyrábí náplň tradičního mraženého nanuku Míša?`,
    options: [`ze smetanové zmrzliny`, `z tvarohu`, `z jogurtu`, `z vanilkového krému`], correct: 1 },
  { q: `4. Ze spojení jakých dvou jmen vznikl název československých motocyklů Jawa?`,
    options: [`Jareš a Walter`, `Janků a Wágner`, `Jandera a Waldes`, `Janeček a Wanderer`], correct: 3 },
  { q: `5. Podobizna kterého komunistického politika se objevila na československé stokorunové bankovce vydané roku 1989?`,
    options: [`Klement Gottwald`, `Antonín Zápotocký`, `Gustáv Husák`, `Antonín Novotný`], correct: 0 },
  { q: `6. Kdo režíroval oblíbenou filmovou pohádku Tři oříšky pro Popelku z roku 1973?`,
    options: [`Václav Vorlíček`, `Karel Zeman`, `Zdeněk Troška`, `Jiří Menzel`], correct: 0 },
  { q: `7. Ve kterém roce byl přijetím zákona o jednotných zemědělských družstvech odstartován proces násilné kolektivizace československého venkova?`,
    options: [`1948`, `1949`, `1953`, `1955`], correct: 1 },
  { q: `8. Z čeho původně vznikl sirup Kofo, základ nápoje Kofola?`,
    options: [`z cukrovarnické melasy`, `z bylin sbíraných v Karpatech`, `z ovocných šťáv a citronové kyseliny`, `z kofeinu zbylého při pražení kávy`], correct: 3 },
  { q: `9. Který deník byl ústředním tiskovým orgánem Socialistického svazu mládeže (SSM)?`,
    options: [`Rudé právo`, `Mladá fronta`, `Práce`, `Svobodné slovo`], correct: 1 },
  { q: `10. Jak se jmenovala nejmasovější každoroční filmová přehlídka socialistického Československa, kterou pro širokou veřejnost promítala hlavně letní kina po celé zemi?`,
    options: [`Filmový festival pracujících`, `Mezinárodní filmový festival Karlovy Vary`, `Filmové žně`, `Přehlídka československého filmu`], correct: 0 }
];

const evaluation = [
  { min: 0, max: 3, text: `V socialismu byste se ztratili hned u fronty na maso. Do party pamětníků máte pěkný kus cesty, tahle éra je pro vás cizí zemí.` },
  { min: 4, max: 6, text: `Pár věcí vám naskočí, ale čistý kádrový posudek byste nedostali. Socíkem byste tak akorát proplouvali a u okénka občas tápali.` },
  { min: 7, max: 9, text: `Tohle je forma ostříleného pamětníka. V ČSSR byste přežili v pohodě, věděli byste, kde sehnat bony i banány a kdy běží ten správný seriál.` },
  { min: 10, max: 10, text: `Plný počet. Vy jste tu dobu nejen prožili, vy jste jí rozuměli. Mistr socialistického každodenního života, před kterým nemá tajemství ani jedna fronta.` }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const submitBtn = document.getElementById('submit');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retry');

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('p');
    qt.className = 'q-text';
    qt.textContent = item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll('.opt')).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  if (all) hintEl.textContent = '';
}

submitBtn.addEventListener('click', () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.opt');
    opts.forEach((b, oi) => {
      b.disabled = true;
      b.classList.remove('selected');
      if (oi === questions[qi].correct) b.classList.add('correct');
      else if (oi === answers[qi]) b.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  scoreEl.textContent = score + ' z ' + questions.length;
  const ev = evaluation.find(e => score >= e.min && score <= e.max);
  verdictEl.textContent = ev ? ev.text : '';
  submitBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

retryBtn.addEventListener('click', () => {
  locked = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  render();
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  resultEl.style.display = 'none';
  hintEl.textContent = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
