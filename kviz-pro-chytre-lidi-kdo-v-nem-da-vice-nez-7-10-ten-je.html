<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz pro chytré lidi: kdo v něm dá více než 7/10, ten je v nadprůměru</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; }
  .perex { font-size: 1.1rem; margin: 0 0 28px; }
  .q {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    color: #3a3a3a;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .opt:disabled { cursor: default; }
  #submitBtn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #submitBtn:hover { background: #4a6b4e; }
  #submitBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a7f72; margin: 12px 0 0; min-height: 1.2em; }
  #result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 32px;
    display: none;
  }
  #score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  #verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #retryBtn {
    display: block;
    margin: 28px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #retryBtn:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvíz pro chytré lidi: kdo v něm dá více než 7/10, ten je v nadprůměru</h1>
  <p class="perex">Deset otázek napříč obory, na kterých zaváhá i leckdo sečtělý. Běžný laik uhraje čtyři až pět bodů, sedm a víc svede jen opravdu vzdělaná hlava. Kdo posbírá více než sedm z deseti, řadí se do nadprůměru. Troufnete si?</p>
  <div id="quiz"></div>
  <button id="submitBtn" disabled>Vyhodnotit</button>
  <p class="hint" id="hint"></p>
  <div id="result">
    <div id="score"></div>
    <p id="verdict"></p>
    <button id="retryBtn">Zkusit znovu</button>
  </div>
</div>
<script>
const questions = [
  { q: `1. V jaké nadřazené skupině galaxií se nachází Mléčná dráha spolu s galaxií v Andromedě?`,
    opts: [`a) Kupa v Panně`, `b) Místní skupina`, `c) Nadkupa Laniakea`, `d) Velká zeď`], correct: 1 },
  { q: `2. Který bůh byl v řecké mytologii poslem bohů?`,
    opts: [`a) Apollón`, `b) Héfaistos`, `c) Hermés`, `d) Áres`], correct: 2 },
  { q: `3. Které jezero má na světě největší rozlohu?`,
    opts: [`a) Bajkal`, `b) Hořejší jezero`, `c) Viktoriino jezero`, `d) Kaspické moře`], correct: 3 },
  { q: `4. Který skladatel je autorem jednověté orchestrální skladby Bolero?`,
    opts: [`a) Maurice Ravel`, `b) Claude Debussy`, `c) Erik Satie`, `d) Camille Saint-Saëns`], correct: 0 },
  { q: `5. Který ruský spisovatel je autorem románu Anna Karenina?`,
    opts: [`a) Ivan Turgeněv`, `b) Lev Nikolajevič Tolstoj`, `c) Fjodor Dostojevskij`, `d) Nikolaj Gogol`], correct: 1 },
  { q: `6. Která bílkovina tvoří převážnou část lidských vlasů a nehtů?`,
    opts: [`a) kolagen`, `b) myosin`, `c) keratin`, `d) elastin`], correct: 2 },
  { q: `7. Kolik hráčů jednoho týmu je současně na hřišti v ragby (rugby union)?`,
    opts: [`a) 15`, `b) 13`, `c) 11`, `d) 7`], correct: 0 },
  { q: `8. Jak se nazývá zvuková básnická figura založená na opakování stejné hlásky na začátku po sobě jdoucích slov?`,
    opts: [`a) anafora`, `b) asonance`, `c) epizeuxis`, `d) aliterace`], correct: 3 },
  { q: `9. Který panovník byl posledním byzantským císařem, jenž padl při dobytí Konstantinopole roku 1453?`,
    opts: [`a) Konstantin XI. Palaiologos`, `b) Justinián I.`, `c) Basileios II.`, `d) Michael VIII. Palaiologos`], correct: 0 },
  { q: `10. Který malíř je autorem monumentálního plátna Pohřeb hraběte Orgaze?`,
    opts: [`a) Diego Velázquez`, `b) Francisco Goya`, `c) Bartolomé Esteban Murillo`, `d) El Greco`], correct: 3 }
];

const verdicts = [
  { min: 0, max: 3, text: `Zatím se pohybujete pod hranicí průměru. Řada otázek mířila mimo školní jádro a část oborů vám evidentně není blízká. Nic ztraceného, jen tu chybí širší čtenářský a všeobecný záběr.` },
  { min: 4, max: 6, text: `Solidní průměr běžného dospělého Čecha. V oborech, které vám sedí, jste zabodovali, ale u těch záludnějších jste narazili. Do nadprůměru vám scházel jen krůček.` },
  { min: 7, max: 9, text: `Nadprůměr, přesně jak slibuje titulek. Kdo dá více než sedm z deseti, prokazuje rozhled, jaký většina lidí nemá. Zvládli jste i otázky, na kterých ostatní vyhořeli.` },
  { min: 10, max: 10, text: `Výjimečný výsledek, který se povede jen zlomku řešitelů. Plný počet v kvízu tohoto ražení znamená mimořádně široké a přesné znalosti napříč obory. Klobouk dolů.` }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const submitBtn = document.getElementById('submitBtn');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retryBtn');

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('p');
    qt.className = 'q-text';
    qt.textContent = item.q;
    box.appendChild(qt);
    item.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      if (answers[qi] === oi) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateSubmit();
      });
      box.appendChild(btn);
    });
    box.dataset.qi = qi;
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const allAnswered = answers.every(a => a !== null);
  submitBtn.disabled = !allAnswered;
  hintEl.textContent = '';
}

function evaluate() {
  if (!answers.every(a => a !== null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const btns = box.querySelectorAll('.opt');
    btns.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (answers[qi] === oi) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  scoreEl.textContent = score + ' z ' + questions.length;
  const v = verdicts.find(x => score >= x.min && score <= x.max);
  verdictEl.textContent = v ? v.text : '';
  submitBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function reset() {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = 'none';
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  hintEl.textContent = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', evaluate);
retryBtn.addEventListener('click', reset);
render();
</script>
</body>
</html>
