<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dějepisný kvíz: 10 dávno zaniklých nástrojů. Kdo pozná 8, ten ještě zažil dílnu</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.container { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.8rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 16px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin: 0 0 28px; }
.question-box {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.question-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 12px;
}
.option:last-child { margin-bottom: 0; }
.option:hover:not(.locked) { background: #ede8e1; }
.option.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.option.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.option.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.option.locked { cursor: default; }
#submitBtn {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submitBtn:hover:not(:disabled) { background: #4a6b4e; }
#submitBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
.warn { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.2em; }
.result-box {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
}
.score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
.verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#retryBtn {
  display: block;
  margin: 28px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retryBtn:hover { background: #756658; }
</style>
</head>
<body>
<div class="container">
<h1>Dějepisný kvíz: 10 dávno zaniklých nástrojů. Kdo pozná 8, ten ještě zažil dílnu</h1>
<p class="perex">Vonělo to hoblinami, na ponku ležely klínky a na půdě čekal len na zpracování. Deset otázek na staré ruční nářadí z dílen, ševcoven i statků. Poznáte, k čemu ten který kus dřeva a železa doopravdy sloužil?</p>
<div id="quiz"></div>
<button id="submitBtn" disabled>Vyhodnotit</button>
<p class="warn" id="warn"></p>
<div id="result"></div>
</div>
<script>
const questions = [
  { q: `K čemu na statku sloužil cep?`, options: [`k sečení stojícího obilí na poli`, `k vymlácení zrna z klasů údery přes rozprostřené snopy`, `k prohrabávání a obracení sušící se slámy na mlatě`, `k hrabání sena a slámy do řádků`], correct: 1 },
  { q: `K čemu sloužila valcha?`, options: [`k ždímání vody z vypraného prádla protočením`, `k sušení prádla napnutím na dřevěný rám`, `k drhnutí a rozdrhávání špinavého prádla na vlnité desce`, `k hlazení suchého prádla protahováním mezi válci`], correct: 2 },
  { q: `K čemu sloužilo ševcovské kopyto?`, options: [`jako dřevěná forma, na kterou švec napínal a tvaroval kožený svršek boty`, `jako kovová šablona pro vykrajování podešví z kůže`, `jako stolička, na níž švec při práci seděl`, `jako dřevěný kolík, kterým se přibíjela podrážka`], correct: 0 },
  { q: `K čemu se používal nebozez?`, options: [`ke štípání polen na drobné třísky`, `k hoblování a uhlazování prken`, `k zarážení dřevěných kolíků do trámů`, `k vrtání kruhových děr do dřeva`], correct: 3 },
  { q: `K čemu sloužilo ševcovské šídlo?`, options: [`k vyřezávání a přiřezávání kusů kůže`, `k propichování otvorů do kůže, kterými se protahovala dratev`, `k uhlazování a leštění hran kůže`, `k nanášení vosku a barvy na useň`], correct: 1 },
  { q: `K čemu sloužil měch v kovárně?`, options: [`ke kalení rozžhaveného železa prudkým ochlazením ve vodě`, `k uchopení a přidržení rozžhaveného kusu železa`, `k vhánění vzduchu do výhně, aby oheň dosáhl vyšší teploty`, `k odstraňování okují a nečistot z rozžhaveného kovu`], correct: 2 },
  { q: `K čemu sloužila rašple?`, options: [`k hrubému obrušování a tvarování dřeva ocelovými hroty`, `k rozřezávání prkna napříč na kratší díly`, `k závěrečnému vyleštění hotového výrobku do vysokého lesku`, `k vypalování ozdobných obrazců do dřevěného povrchu`], correct: 0 },
  { q: `K čemu sloužil poříz?`, options: [`k rozřezávání kmenů na prkna`, `k sekání a štípání polen`, `k dlabání otvorů a drážek do dřeva`, `k odřezávání třísek a ostrouhávání dřeva tahem obouručního nože k tělu`], correct: 3 },
  { q: `Jakou práci na statku obstarával fukar?`, options: [`vymlácení zrna z klasů`, `čištění vymláceného zrna od plev, prachu a nečistot`, `mletí zrna na mouku`, `sušení vlhkého obilí před uskladněním`], correct: 1 },
  { q: `K čemu sloužila vochle při zpracování lnu?`, options: [`k lámání a drcení oddřevnělých stonků lnu`, `k máčení stonků lnu ve vodě`, `k česání lněných vláken, jímž se oddělovala hrubá koudel od jemných vláken`, `ke spřádání lněných vláken do nitě`], correct: 2 }
];

const letters = [`a)`, `b)`, `c)`, `d)`];
const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submitBtn`);
const warnEl = document.getElementById(`warn`);
const resultEl = document.getElementById(`result`);

function render() {
  quizEl.innerHTML = ``;
  questions.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `question-box`;
    const qt = document.createElement(`p`);
    qt.className = `question-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `option`;
      btn.textContent = letters[oi] + ` ` + opt;
      if (answers[qi] === oi) btn.classList.add(`selected`);
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const allAnswered = answers.every(a => a !== null);
  submitBtn.disabled = !allAnswered;
  if (allAnswered) warnEl.textContent = ``;
}

submitBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) {
    warnEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.question-box`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.option`);
    opts.forEach((btn, oi) => {
      btn.classList.add(`locked`);
      btn.classList.remove(`selected`);
      if (oi === questions[qi].correct) btn.classList.add(`correct`);
      else if (oi === answers[qi]) btn.classList.add(`wrong`);
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  submitBtn.disabled = true;
  showResult(score);
});

function verdictText(score) {
  if (score <= 3) return `Svět staré dílny ti zůstal cizí. Tyhle kusy nářadí vymizely dřív, než by ses jich mohl chytit, a dnes působí jako němé exponáty za sklem. Nevadí, aspoň teď víš, čím se dřina našich dědů odbývala ruku po ruce.`;
  if (score <= 6) return `Slušný průměr. Pár nástrojů jsi poznal a tušíš, jak to v dílně i na statku chodilo, ale k pravému pamětníkovi ti ještě kus chybí. Půlku jsi trefil, u zbytku jsi chvíli tápal mezi podobnými řemesly.`;
  if (score <= 9) return `Výborně. Kdo nasbíral aspoň osm bodů, ten dílnu opravdu ještě zažil. Poznáš nářadí napříč řemesly, od ponku přes kovářskou výheň až po statek a ševcovnu, a víš, k čemu každý kus sloužil.`;
  return `Klobouk dolů, mistře. Plný počet zvládne jen hrstka. Vůně hoblin, řinčení výhně i drhnutí prádla ti nejsou cizí ani trochu. Staré nářadí znáš tak, jako bys je sám bral léta do ruky, a to už dnes dokáže málokdo.`;
}

function showResult(score) {
  const box = document.createElement(`div`);
  box.className = `result-box`;
  const s = document.createElement(`p`);
  s.className = `score`;
  s.textContent = score + ` z ` + questions.length;
  const v = document.createElement(`p`);
  v.className = `verdict`;
  v.textContent = verdictText(score);
  box.appendChild(s);
  box.appendChild(v);
  const retry = document.createElement(`button`);
  retry.id = `retryBtn`;
  retry.textContent = `Zkusit znovu`;
  retry.addEventListener(`click`, () => {
    locked = false;
    for (let i = 0; i < answers.length; i++) answers[i] = null;
    resultEl.innerHTML = ``;
    warnEl.textContent = ``;
    render();
    updateSubmit();
    window.scrollTo({ top: 0, behavior: `smooth` });
  });
  box.appendChild(retry);
  resultEl.innerHTML = ``;
  resultEl.appendChild(box);
  box.scrollIntoView({ behavior: `smooth` });
}

render();
updateSubmit();
</script>
</body>
</html>
