<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz pro chytré lidi nad 60 let: kdo získá plný počet, patří mezi vědomostní elitu</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  margin: 0;
  padding: 40px 20px;
  color: #2c2c2c;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin: 0 0 32px; }
.otazka {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.varianta {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  cursor: pointer;
}
.varianta:hover { background: #ede8e1; }
.varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.varianta:disabled { cursor: default; }
#vyhodnotit {
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  cursor: pointer;
  font-family: inherit;
}
#vyhodnotit:hover { background: #4a6b4e; }
#vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.4em; }
#vysledek {
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border-top: 4px solid #5b7e5f;
  padding: 28px;
  margin-top: 40px;
}
#skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 14px; }
#hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#znovu {
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  cursor: pointer;
  font-family: inherit;
}
#znovu:hover { background: #756658; }
@media (max-width: 600px) {
  body { padding: 16px; }
  .otazka { padding: 20px; }
  h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz pro chytré lidi nad 60 let: kdo získá plný počet, patří mezi vědomostní elitu</h1>
<p class="perex">Deset otázek pro každého, komu je přes šedesát a věří si na všeobecný přehled. Mateřština, příroda, staré řemeslo, dějiny, malířství, kuchyně, pobřeží Evropy, sport i divadlo. Kolik jich zvládnete bez zaváhání?</p>
<div id="kviz"></div>
<button id="vyhodnotit" disabled>Vyhodnotit</button>
<p class="hlaska" id="hlaska"></p>
<div id="vysledek" style="display:none;">
  <p id="skore"></p>
  <p id="hodnoceni"></p>
  <button id="znovu">Zkusit znovu</button>
</div>
</div>
<script>
var otazky = [
  { z: `Kolik dvojhlásek má spisovná čeština?`, v: [`jednu`, `dvě`, `tři`, `čtyři`], s: 2 },
  { z: `Která ryba je největší dravou rybou českých vod?`, v: [`štika`, `sumec`, `candát`, `mník`], s: 1 },
  { z: `Ve kterém městě měl svou dílnu houslař Antonio Stradivari?`, v: [`Verona`, `Brescia`, `Cremona`, `Mantova`], s: 2 },
  { z: `Ve kterém roce Japonsko zaútočilo na Pearl Harbor?`, v: [`1940`, `1941`, `1942`, `1943`], s: 1 },
  { z: `Který malíř skládal lidské podobizny z ovoce, zeleniny a květin?`, v: [`Bartholomeus Spranger`, `Giuseppe Arcimboldo`, `Hans von Aachen`, `Karel Škréta`], s: 1 },
  { z: `Která z těchto surovin do původního římského receptu na těstoviny carbonara nepatří?`, v: [`smetana`, `vejce`, `tvrdý ovčí sýr`, `sušené vepřové maso`], s: 0 },
  { z: `Které z těchto přímořských měst leží v Belgii?`, v: [`Le Havre`, `Cuxhaven`, `Ostende`, `Vlissingen`], s: 2 },
  { z: `Kdo velel stavovskému vojsku na začátku českého povstání v roce 1618?`, v: [`Albrecht z Valdštejna`, `Karel starší ze Žerotína`, `Vilém Slavata z Chlumu`, `Jindřich Matyáš Thurn`], s: 3 },
  { z: `Který krasobruslařský skok nese jméno švédského závodníka?`, v: [`salchow`, `axel`, `lutz`, `rittberger`], s: 0 },
  { z: `Kterou z těchto amerických her napsal Tennessee Williams?`, v: [`Smrt obchodního cestujícího`, `Kdo se bojí Virginie Woolfové`, `Cesta dlouhým dnem do noci`, `Tramvaj do stanice Touha`], s: 3 }
];

var hodnoceni = [
  { max: 3, text: `K plnému počtu, o kterém mluví titulek, je odsud daleko. Nejsnáze se bodovalo v úvodu, u dvojhlásek, u největšího dravce našich vod, u roku útoku v Pacifiku a u malíře, který podobizny skládal z plodů. Pokud padly i tyto položky, rozhodovalo spíš rychlé tipnutí než rozvaha. Projděte si správné odpovědi, většina z nich se v paměti uchytí napoprvé.` },
  { max: 6, text: `Tady se pohybuje běžný výsledek. Úvodní čtveřice většinou sedí a ztráty přicházejí až ve středním pásmu: u suroviny, která v původním receptu nemá co dělat, u města na pobřeží, u velitele stavovského vojska, u skoku pojmenovaného po svém vynálezci a u autora americké hry. Ani jedna z nich přitom nestojí na náhodě, všechny se dají promyslet do konce.` },
  { max: 9, text: `Solidní výkon, který obvykle znamená, že jste středním pásmem prošli bez větších ztrát a nenechali se svést variantou, která leží těsně vedle správné. Nejvíc bodů v této skupině mizí u dílny slavného houslaře, tedy u nejtěžší otázky celého kvízu, a hned za ní u názvosloví krasobruslařských skoků. K plnému počtu vám chyběla jedna až tři odpovědi.` },
  { max: 10, text: `Plný počet, a přesně o něm mluví název kvízu. Nezaváhali jste u italské houslařské dílny, u jména krasobruslařského skoku ani u autora americké hry, tedy tam, kde se rozhodovalo mezi dvěma velmi podobnými možnostmi. Takový výsledek se v tak širokém záběru trefí jen málokomu a řadí vás mezi vědomostní elitu, kterou titulek slibuje.` }
];

var odpovedi = new Array(otazky.length).fill(null);
var hotovo = false;
var kvizEl = document.getElementById(`kviz`);
var tlacitko = document.getElementById(`vyhodnotit`);
var hlaska = document.getElementById(`hlaska`);
var vysledek = document.getElementById(`vysledek`);

function vykresli() {
  kvizEl.innerHTML = ``;
  otazky.forEach(function (o, i) {
    var box = document.createElement(`div`);
    box.className = `otazka`;
    var zneni = document.createElement(`p`);
    zneni.className = `zneni`;
    zneni.textContent = (i + 1) + `. ` + o.z;
    box.appendChild(zneni);
    o.v.forEach(function (text, j) {
      var b = document.createElement(`button`);
      b.className = `varianta`;
      b.textContent = text;
      b.addEventListener(`click`, function () {
        if (hotovo) return;
        odpovedi[i] = j;
        var vsechny = box.querySelectorAll(`.varianta`);
        for (var k = 0; k < vsechny.length; k++) {
          vsechny[k].classList.remove(`vybrana`);
        }
        b.classList.add(`vybrana`);
        hlaska.textContent = ``;
        zkontrolujTlacitko();
      });
      box.appendChild(b);
    });
    kvizEl.appendChild(box);
  });
}

function zkontrolujTlacitko() {
  var vse = odpovedi.every(function (o) { return o !== null; });
  tlacitko.disabled = !vse;
}

tlacitko.addEventListener(`click`, function () {
  if (tlacitko.disabled) {
    hlaska.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  hotovo = true;
  var body = 0;
  var boxy = kvizEl.querySelectorAll(`.otazka`);
  for (var i = 0; i < boxy.length; i++) {
    var vsechny = boxy[i].querySelectorAll(`.varianta`);
    for (var j = 0; j < vsechny.length; j++) {
      vsechny[j].disabled = true;
      vsechny[j].classList.remove(`vybrana`);
      if (j === otazky[i].s) {
        vsechny[j].classList.add(`spravna`);
      } else if (j === odpovedi[i]) {
        vsechny[j].classList.add(`spatna`);
      }
    }
    if (odpovedi[i] === otazky[i].s) body++;
  }
  tlacitko.disabled = true;
  document.getElementById(`skore`).textContent = body + ` z ` + otazky.length;
  var text = ``;
  for (var h = 0; h < hodnoceni.length; h++) {
    if (body <= hodnoceni[h].max) { text = hodnoceni[h].text; break; }
  }
  document.getElementById(`hodnoceni`).textContent = text;
  vysledek.style.display = `block`;
  vysledek.scrollIntoView({ behavior: `smooth` });
});

document.getElementById(`znovu`).addEventListener(`click`, function () {
  odpovedi = new Array(otazky.length).fill(null);
  hotovo = false;
  vysledek.style.display = `none`;
  hlaska.textContent = ``;
  tlacitko.disabled = true;
  vykresli();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

vykresli();
</script>
</body>
</html>
