<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dějepisný kvíz pro seniory: kdo dá 10/10, ví pořád víc než dnešní maturanti</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.8rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
.perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 16px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: #3a3a3a;
  cursor: pointer;
  transition: background .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
#submit {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #a05050; margin-top: 12px; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
#retry {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retry:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
<h1></h1>
<p class="perex"></p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>
<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const TITLE = `Dějepisný kvíz pro seniory: kdo dá 10/10, ví pořád víc než dnešní maturanti`;
const PEREX = `Deset otázek z českých i světových dějin, od antiky až po devatenácté století. Data, panovníci i méně omílané události. Průměrný pamětník zvládne pět šest, kdo dá všech deset, ví o historii víc než dnešní maturant. Tak s chutí do toho.`;
const QUESTIONS = [
  { q: `Ve které bitvě odrazili Athéňané roku 490 př. n. l. první perský vpád do pevninského Řecka?`,
    options: [`u Marathónu`, `u Thermopyl`, `u Salamíny`, `u Plataj`], correct: 0 },
  { q: `Který středověký cestovatel se proslavil dlouhou cestou do Číny a mnohaletým pobytem na dvoře mongolského vládce Kublajchána?`,
    options: [`Ibn Battúta`, `Odorik z Pordenone`, `Marco Polo`, `Jan z Pian del Carpine`], correct: 2 },
  { q: `Který vládce stál v 7. století v čele prvního doloženého slovanského kmenového svazu, jenž se ubránil Frankům?`,
    options: [`Mojmír I.`, `Sámo`, `Rostislav`, `Pribina`], correct: 1 },
  { q: `Který přemyslovský panovník získal roku 1085 jako vůbec první český panovník královský titul?`,
    options: [`Břetislav I.`, `Vladislav II.`, `Přemysl Otakar I.`, `Vratislav II.`], correct: 3 },
  { q: `Ve kterém roce bylo pražské biskupství povýšeno na arcibiskupství?`,
    options: [`1344`, `1348`, `1356`, `1378`], correct: 0 },
  { q: `Ve kterém roce byla v Jihlavě slavnostně vyhlášena basilejská kompaktáta?`,
    options: [`1420`, `1434`, `1436`, `1458`], correct: 2 },
  { q: `Ve kterém roce vydal císař Rudolf II. Majestát zaručující v Čechách náboženskou svobodu?`,
    options: [`1608`, `1609`, `1611`, `1618`], correct: 1 },
  { q: `Ve kterém roce vydala Marie Terezie Všeobecný školní řád, jímž položila základ školské soustavy v monarchii?`,
    options: [`1740`, `1749`, `1765`, `1774`], correct: 3 },
  { q: `Ve kterém roce došlo k rakousko-uherskému vyrovnání, jímž se monarchie rozdělila na dvě části?`,
    options: [`1848`, `1866`, `1867`, `1871`], correct: 2 },
  { q: `Ve kterém roce začala v Japonsku éra Meidži, která ukončila vládu šógunů?`,
    options: [`1854`, `1868`, `1889`, `1905`], correct: 1 }
];
const RANGES = [
  { min: 0, max: 3, text: `Velké dějinné mezníky vám splývají a přesné roky se vytrácejí. Není se za co stydět, řada těchto otázek by dnes položila i leckterého maturanta. Zkuste kvíz projít ještě jednou, letopočty se lépe drží v hlavě, když si je poskládáte za sebe.` },
  { min: 4, max: 6, text: `Solidní výsledek přesně tam, kde se pohybuje většina pamětníků se školním dějepisem. Známější mezníky české i světové historie máte v hlavě spolehlivě, u těch starších a méně omílaných jste občas o kousek vedle. Zdravý průměr, na který můžete být hrdí.` },
  { min: 7, max: 9, text: `Máte historický rozhled, jaký se hned tak nevidí. Nezůstáváte u obecného povědomí a trefujete i přesné roky včetně těch středověkých, na kterých pohoří spousta lidí. K plnému počtu vám chybělo opravdu jen málo.` },
  { min: 10, max: 10, text: `Naprostá špička. Od antického Řecka přes přemyslovské a lucemburské Čechy až po devatenácté století jste nezaváhali ani jednou a zvládli i data, která zná málokdo. Takový přehled dnešní maturant nemá, klobouk dolů, dějepis vám zůstal v malíku.` }
];

const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

document.querySelector(`h1`).textContent = TITLE;
document.querySelector(`.perex`).textContent = PEREX;

const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submit`);
const hintEl = document.getElementById(`hint`);
const resultEl = document.getElementById(`result`);

function render() {
  quizEl.innerHTML = ``;
  QUESTIONS.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `q`;
    const qt = document.createElement(`div`);
    qt.className = `q-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `opt`;
      btn.textContent = opt;
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll(`.opt`)).forEach(b => b.classList.remove(`selected`));
        btn.classList.add(`selected`);
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  if (all) hintEl.textContent = ``;
}

submitBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.q`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.opt`);
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      if (oi === QUESTIONS[qi].correct) btn.classList.add(`correct`);
      if (oi === answers[qi] && answers[qi] !== QUESTIONS[qi].correct) btn.classList.add(`wrong`);
    });
    if (answers[qi] === QUESTIONS[qi].correct) score++;
  });
  document.getElementById(`score`).textContent = score + ` z ` + QUESTIONS.length;
  const r = RANGES.find(x => score >= x.min && score <= x.max);
  document.getElementById(`verdict`).textContent = r ? r.text : ``;
  submitBtn.style.display = `none`;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth` });
});

document.getElementById(`retry`).addEventListener(`click`, () => {
  locked = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  render();
  submitBtn.style.display = `block`;
  submitBtn.disabled = true;
  resultEl.style.display = `none`;
  hintEl.textContent = ``;
  window.scrollTo({ top: 0, behavior: `smooth` });
});

render();
</script>
</body>
</html>
