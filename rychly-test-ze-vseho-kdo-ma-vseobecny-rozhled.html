<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rychlý test ze všeho: kdo má všeobecný rozhled, dá v něm během 5 minut 10/10</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; }
  .perex { font-size: 1.1rem; margin: 0 0 28px; }
  .q {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    color: #3a3a3a;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .opt:disabled { cursor: default; }
  #submitBtn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #submitBtn:hover { background: #4a6b4e; }
  #submitBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a7f72; margin: 12px 0 0; min-height: 1.2em; }
  #result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 32px;
    display: none;
  }
  #score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  #verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #retryBtn {
    display: block;
    margin: 28px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #retryBtn:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rychlý test ze všeho: kdo má všeobecný rozhled, dá v něm během 5 minut 10/10</h1>
  <p class="perex">Deset otázek napříč obory, pět minut času a jeden jasný výsledek. Tenhle rychlý test prověří, jak široký doopravdy máte všeobecný rozhled. Plných 10 z 10 nasbírá jen menšina. Zvládnete to bez nápovědy a bez zaváhání?</p>
  <div id="quiz"></div>
  <button id="submitBtn" disabled>Vyhodnotit</button>
  <p class="hint" id="hint"></p>
  <div id="result">
    <div id="score"></div>
    <p id="verdict"></p>
    <button id="retryBtn">Zkusit znovu</button>
  </div>
</div>
<script>
const questions = [
  { q: `1. Se kterým státem uzavřely vítězné mocnosti roku 1919 Versailleskou mírovou smlouvu, která formálně ukončila první světovou válku?`,
    opts: [`a) Rakousko`, `b) Osmanská říše`, `c) Bulharsko`, `d) Německo`], correct: 3 },
  { q: `2. Které pohoří je nejdelší souvislé pohoří na souši, táhnoucí se nad hladinou moře podél západního okraje jednoho kontinentu?`,
    opts: [`a) Himálaj`, `b) Alpy`, `c) Skalnaté hory`, `d) Andy`], correct: 3 },
  { q: `3. Který český malíř patří k průkopníkům abstraktního umění a spoluzakladatelům orfismu?`,
    opts: [`a) Alfons Mucha`, `b) František Kupka`, `c) Mikoláš Aleš`, `d) Josef Lada`], correct: 1 },
  { q: `4. Jaká je chemická značka zlata?`,
    opts: [`a) Ag`, `b) Zn`, `c) Au`, `d) Cu`], correct: 2 },
  { q: `5. Který párový orgán filtruje krev a odvádí odpadní látky z těla močí?`,
    opts: [`a) ledviny`, `b) játra`, `c) slezina`, `d) slinivka břišní`], correct: 0 },
  { q: `6. Jak se nazývá nejvyšší ženský pěvecký hlas?`,
    opts: [`a) alt`, `b) soprán`, `c) mezzosoprán`, `d) kontraalt`], correct: 1 },
  { q: `7. Kdo je autorem antiutopického románu 451 stupňů Fahrenheita?`,
    opts: [`a) Ray Bradbury`, `b) Aldous Huxley`, `c) George Orwell`, `d) Isaac Asimov`], correct: 0 },
  { q: `8. Ze které země pochází sport curling?`,
    opts: [`a) Kanada`, `b) Norsko`, `c) Skotsko`, `d) Švédsko`], correct: 2 },
  { q: `9. Kdo režíroval sci-fi film Vetřelec z roku 1979?`,
    opts: [`a) Ridley Scott`, `b) James Cameron`, `c) John Carpenter`, `d) George Lucas`], correct: 0 },
  { q: `10. Kolik měsíců obíhá kolem planety Mars?`,
    opts: [`a) žádný`, `b) jeden`, `c) dva`, `d) čtyři`], correct: 2 }
];

const verdicts = [
  { min: 0, max: 3, text: `Rozhled zatím spíš úzký. Otázky sahaly do dějin, přírodních věd, umění i sportu a většina vás zaskočila. Není to důkaz nevědomosti, jen signál, že řada oborů čeká na objevení. Zkuste se příště nespoléhat na první dojem.` },
  { min: 4, max: 6, text: `Slušný průměr. V oborech, které jsou vám blízké, jste zabodovali, jinde vás varianty svedly ze stopy. Na běžný všeobecný rozhled to stačí, k plnému počtu ale ještě kus cesty zbývá.` },
  { min: 7, max: 9, text: `Nadprůměrný výsledek. Orientujete se napříč obory a i u těžších otázek jste dokázali vybrat správně. K desítce vám chybělo jen pár detailů, na kterých ztroskotá většina lidí.` },
  { min: 10, max: 10, text: `Potvrzený všeobecný rozhled. Dějiny, věda, umění, hudba, zeměpis i sport vám nedělají problém a nenachytaly vás ani těsné varianty. Přesně o téhle menšině mluví titulek. Klobouk dolů.` }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const submitBtn = document.getElementById('submitBtn');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retryBtn');

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('p');
    qt.className = 'q-text';
    qt.textContent = item.q;
    box.appendChild(qt);
    item.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      if (answers[qi] === oi) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateSubmit();
      });
      box.appendChild(btn);
    });
    box.dataset.qi = qi;
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const allAnswered = answers.every(a => a !== null);
  submitBtn.disabled = !allAnswered;
  hintEl.textContent = '';
}

function evaluate() {
  if (!answers.every(a => a !== null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const btns = box.querySelectorAll('.opt');
    btns.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (answers[qi] === oi) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  scoreEl.textContent = score + ' z ' + questions.length;
  const v = verdicts.find(x => score >= x.min && score <= x.max);
  verdictEl.textContent = v ? v.text : '';
  submitBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function reset() {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = 'none';
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  hintEl.textContent = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

submitBtn.addEventListener('click', evaluate);
retryBtn.addEventListener('click', reset);
render();
</script>
</body>
</html>
