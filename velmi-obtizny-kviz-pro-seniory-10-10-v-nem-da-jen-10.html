<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velmi obtížný kvíz pro seniory: 10/10 v něm dá jen 10 % starších. Zkusíte to?</title>
<style>
* { box-sizing: border-box; }
body { font-family: Georgia, "Times New Roman", serif; background: #f5f0eb; color: #2c2c2c; margin: 0; padding: 24px 16px; }
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.8rem; line-height: 1.3; margin: 0 0 20px; }
.perex { font-size: 1.1rem; line-height: 1.6; margin: 0 0 28px; color: #444; }
.q { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 28px; margin-bottom: 24px; }
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; }
.opt { display: block; width: 100%; text-align: left; padding: 14px 18px; background: #f7f4f0; border: 1px solid #d9d2c9; border-radius: 8px; font-size: 1rem; color: #3a3a3a; margin-bottom: 10px; cursor: pointer; font-family: inherit; }
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt.locked { cursor: default; }
#submit { background: #5b7e5f; color: #fff; padding: 16px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; border: none; display: block; margin: 40px auto 0; cursor: pointer; font-family: inherit; }
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #8c7b6b; margin: 12px auto 0; min-height: 1.2em; }
#result { background: #fefcf9; border-top: 4px solid #5b7e5f; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 28px; margin-top: 24px; display: none; }
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; line-height: 1.6; }
#retry { background: #8c7b6b; color: #fff; padding: 16px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; border: none; display: block; margin: 24px auto 0; cursor: pointer; font-family: inherit; }
#retry:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
<h1>Velmi obtížný kvíz pro seniory: 10/10 v něm dá jen 10 % starších. Zkusíte to?</h1>
<p class="perex">Deset otázek z historie, vědy, zeměpisu, literatury, umění, hudby i přírody. Žádné nápovědy, žádné druhé pokusy. Plných deset bodů tu dá jen málokdo z vašich vrstevníků. Patříte mezi ně? Zkuste to.</p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<p class="hint" id="hint"></p>
<div id="result">
<div id="score"></div>
<div id="verdict"></div>
<button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const questions = [
  { q: `Ve kterém dnešním africkém státě leží starobylé pouštní město Timbuktu?`, opts: [`Mali`, `Niger`, `Čad`, `Mauritánie`], correct: 0 },
  { q: `Z názvu které mince vzniklo slovo dolar?`, opts: [`Dukát`, `Groš`, `Tolar`, `Zlatý`], correct: 2 },
  { q: `Soužitím kterých dvou organismů vzniká lišejník?`, opts: [`Houby a mechu`, `Houby a řasy`, `Řasy a mechu`, `Houby a kapradiny`], correct: 1 },
  { q: `Kdo vyplenil roku 410 Řím?`, opts: [`Hunové`, `Ostrogóti`, `Vandalové`, `Vizigóti`], correct: 3 },
  { q: `Kdo je autorem románu Nostromo?`, opts: [`Rudyard Kipling`, `Herbert George Wells`, `Robert Louis Stevenson`, `Joseph Conrad`], correct: 3 },
  { q: `Která planeta Sluneční soustavy má největší hustotu?`, opts: [`Merkur`, `Země`, `Jupiter`, `Mars`], correct: 1 },
  { q: `Kdo namaloval obraz Imprese, východ slunce?`, opts: [`Auguste Renoir`, `Edgar Degas`, `Camille Pissarro`, `Claude Monet`], correct: 3 },
  { q: `Kdo je autorem obrazu Lovci ve sněhu?`, opts: [`Hieronymus Bosch`, `Peter Paul Rubens`, `Pieter Bruegel starší`, `Jan van Eyck`], correct: 2 },
  { q: `Kdo složil Fantastickou symfonii?`, opts: [`Hector Berlioz`, `Franz Liszt`, `Robert Schumann`, `Felix Mendelssohn`], correct: 0 },
  { q: `Který fyzik jako první změřil elektrický náboj elektronu?`, opts: [`Ernest Rutherford`, `Niels Bohr`, `Robert Millikan`, `Joseph John Thomson`], correct: 2 }
];
const verdicts = [
  { min: 0, max: 3, text: `Tenhle kvíz mířil vysoko a schválně sázel na fakta, která se z paměti vytrácejí jako první. Pár otázek vás nachytalo, ale žádná ostuda. Dejte si oddech a klidně to zkuste ještě jednou.` },
  { min: 4, max: 6, text: `Slušný výsledek, na jaký dosáhne většina bystrých seniorů. Prošel jste zrádnými pastmi a udržel se nad průměrem svých vrstevníků. Na plný počet chybělo jen o kousek víc přehledu napříč obory.` },
  { min: 7, max: 9, text: `Výborně. Takhle vysoko se dostane opravdu málokdo. Máte široký rozhled a pevnou paměť, jen ta nejzáludnější otázka si nechala poslední slovo. K naprosté dokonalosti vám scházel jediný krok.` },
  { min: 10, max: 10, text: `Klobouk dolů. Plných deset z deseti tu podle všeho dá sotva každý desátý senior a vy jste mezi nimi. Takový přehled napříč historií, vědou, uměním i přírodou je vzácný v každém věku.` }
];
const answers = new Array(questions.length).fill(null);
let locked = false;
const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submit`);
const hintEl = document.getElementById(`hint`);
const resultEl = document.getElementById(`result`);

function render() {
  quizEl.innerHTML = ``;
  questions.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `q`;
    const qt = document.createElement(`p`);
    qt.className = `q-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.opts.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `opt`;
      btn.textContent = opt;
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll(`.opt`)).forEach(b => b.classList.remove(`selected`));
        btn.classList.add(`selected`);
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}
function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  hintEl.textContent = ``;
}
function evaluate() {
  if (!answers.every(a => a !== null)) {
    hintEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.q`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.opt`);
    opts.forEach((btn, oi) => {
      btn.classList.add(`locked`);
      btn.classList.remove(`selected`);
      if (oi === questions[qi].correct) btn.classList.add(`correct`);
      if (oi === answers[qi] && answers[qi] !== questions[qi].correct) btn.classList.add(`wrong`);
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  document.getElementById(`score`).textContent = score + ` z ` + questions.length;
  const v = verdicts.find(x => score >= x.min && score <= x.max);
  document.getElementById(`verdict`).textContent = v ? v.text : ``;
  submitBtn.style.display = `none`;
  hintEl.textContent = ``;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth` });
}
function reset() {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = `none`;
  submitBtn.style.display = `block`;
  submitBtn.disabled = true;
  hintEl.textContent = ``;
  render();
  window.scrollTo({ top: 0, behavior: `smooth` });
}
submitBtn.addEventListener(`click`, evaluate);
document.getElementById(`retry`).addEventListener(`click`, reset);
render();
</script>
</body>
</html>
