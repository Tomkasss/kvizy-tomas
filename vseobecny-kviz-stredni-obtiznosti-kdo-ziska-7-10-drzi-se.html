<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Všeobecný kvíz střední obtížnosti: kdo získá 7/10, drží se nad českým průměrem</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  margin: 0;
  padding: 40px 20px;
  color: #2c2c2c;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.05rem; color: #4a4a4a; margin: 0 0 36px; }
.otazka {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.varianta {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  cursor: pointer;
}
.varianta:last-child { margin-bottom: 0; }
.varianta:hover { background: #ede8e1; }
.varianta.vybrana {
  background: #dcd3c7;
  border: 1px solid #a89e92;
  font-weight: bold;
}
.varianta.spravna {
  background: #d4edda;
  border: 1px solid #7cb987;
  color: #1e5631;
}
.varianta.spatna {
  background: #f8d7da;
  border: 1px solid #d4848a;
  color: #721c24;
}
#vyhodnotit {
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#vyhodnotit:hover { background: #4a6b4e; }
#vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
#hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.4em; }
#vysledek {
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border-top: 4px solid #5b7e5f;
  padding: 28px;
  margin-top: 40px;
  display: none;
}
#skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
#hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#znovu {
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#znovu:hover { background: #756658; }
@media (max-width: 600px) {
  body { padding: 16px; }
  h1 { font-size: 1.5rem; }
  .otazka { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Všeobecný kvíz střední obtížnosti: kdo získá 7/10, drží se nad českým průměrem</h1>
<p class="perex">Deset otázek z deseti oborů, od filmu a populární hudby přes mytologii a zoologii až po fyziku, sport a mezinárodní politiku. Žádný chyták, ale ani samozřejmost. Kdo trefí sedm, drží se nad českým průměrem.</p>
<div id="kviz"></div>
<button id="vyhodnotit" disabled>Vyhodnotit</button>
<p id="hlaska"></p>
<div id="vysledek">
  <p id="skore"></p>
  <p id="hodnoceni"></p>
  <button id="znovu">Zkusit znovu</button>
</div>
</div>
<script>
const otazky = [
  { q: `1. Který herec ztvárnil taxikáře Travise Bicklea ve filmu Taxikář z roku 1976?`,
    v: [`a) Al Pacino`, `b) Robert De Niro`, `c) Dustin Hoffman`, `d) Harvey Keitel`], s: 1 },
  { q: `2. Z hlíz které rostliny se získává škrob zvaný tapioka?`,
    v: [`a) batát`, `b) topinambur`, `c) taro`, `d) maniok`], s: 3 },
  { q: `3. Ze které severské země pochází skupina a-ha, autoři písně Take On Me?`,
    v: [`a) Norsko`, `b) Dánsko`, `c) Švédsko`, `d) Island`], s: 0 },
  { q: `4. Ve kterém městě stojí chrám Vasila Blaženého, který dal v 16. století postavit car Ivan IV. Hrozný?`,
    v: [`a) Petrohrad`, `b) Novgorod`, `c) Moskva`, `d) Kazaň`], s: 2 },
  { q: `5. Který římský bůh byl zobrazován se dvěma tvářemi a spojován s branami a začátky?`,
    v: [`a) Janus`, `b) Saturn`, `c) Merkur`, `d) Bakchus`], s: 0 },
  { q: `6. Do které skupiny savců patří koala?`,
    v: [`a) hlodavci`, `b) primáti`, `c) medvědovití`, `d) vačnatci`], s: 3 },
  { q: `7. Do kterého oceánu ústí řeka Kongo?`,
    v: [`a) Indický`, `b) Atlantský`, `c) Tichý`, `d) Severní ledový`], s: 1 },
  { q: `8. Která vlastnost kapaliny umožňuje drobnému hmyzu udržet se na vodě, aniž by se potopil?`,
    v: [`a) povrchové napětí`, `b) viskozita`, `c) vzlínavost`, `d) hustota`], s: 0 },
  { q: `9. V jaké výšce nad hrací plochou je podle pravidel FIBA v soutěžích dospělých zavěšena obruč basketbalového koše?`,
    v: [`a) 2,60 m`, `b) 2,85 m`, `c) 3,05 m`, `d) 3,45 m`], s: 2 },
  { q: `10. Kdo byl prvním generálním tajemníkem Organizace spojených národů?`,
    v: [`a) Dag Hammarskjöld`, `b) Trygve Lie`, `c) U Thant`, `d) Kurt Waldheim`], s: 1 }
];

const hodnoceni = [
  { min: 0, max: 3, text: `Na český průměr to tentokrát nestačilo. Deset oborů za sebou je nemilosrdná zkouška, protože stačí, aby vás minuly tři čtyři z nich, a skóre spadne rychle. Rozjezdové otázky o chrámu na Rudém náměstí, o římském bohu se dvěma tvářemi, o zařazení koaly a o ústí africké řeky jsou přitom ty, na kterých se dá stavět. Zkuste kvíz s odstupem znovu, pásmo od čtyř bodů výš je blíž, než to teď vypadá.` },
  { min: 4, max: 6, text: `Solidní výsledek, který se pohybuje kolem českého průměru, ale hranici sedmi bodů jste ještě nepřekročili. Základní obory jste zvládli a ztráty přišly nejspíš tam, kde bylo potřeba vybrat mezi dvěma velmi podobnými možnostmi. Chybí vám opravdu málo, o rozdílu tady rozhodly dvě otázky.` },
  { min: 7, max: 9, text: `Přesně to, co slibuje titulek. Sedm a víc bodů znamená, že se držíte nad českým průměrem, a to napříč obory, které spolu nemají nic společného. Neuhnuli jste ani u otázek, kde se dvě varianty lišily jen jemným detailem. Takový rozhled si udrží jen ten, kdo si všímá i věcí mimo svoje běžné zájmy.` },
  { min: 10, max: 10, text: `Plný počet, který v tomhle kvízu získá jen menšina. Vedle rozjezdových otázek jste trefili i představitele Travise Bicklea, rostlinu za tapiokovým škrobem, domovinu skupiny a-ha, vlastnost kapaliny držící hmyz na vodě, přesnou výšku basketbalové obruče a jméno prvního muže v čele OSN. To už není průměr ani nadprůměr, to je rozhled, jaký se mezi řešiteli objeví jen výjimečně.` }
];

let odpovedi = new Array(otazky.length).fill(null);
let hotovo = false;

const kvizEl = document.getElementById('kviz');
const vyhodnotitEl = document.getElementById('vyhodnotit');
const hlaskaEl = document.getElementById('hlaska');
const vysledekEl = document.getElementById('vysledek');
const skoreEl = document.getElementById('skore');
const hodnoceniEl = document.getElementById('hodnoceni');
const znovuEl = document.getElementById('znovu');

function vykresli() {
  kvizEl.innerHTML = '';
  otazky.forEach(function (o, i) {
    const box = document.createElement('div');
    box.className = 'otazka';
    const zneni = document.createElement('p');
    zneni.className = 'zneni';
    zneni.textContent = o.q;
    box.appendChild(zneni);
    o.v.forEach(function (text, j) {
      const btn = document.createElement('button');
      btn.className = 'varianta';
      btn.type = 'button';
      btn.textContent = text;
      btn.dataset.otazka = i;
      btn.dataset.varianta = j;
      btn.addEventListener('click', function () {
        if (hotovo) return;
        odpovedi[i] = j;
        const sourozenci = box.querySelectorAll('.varianta');
        sourozenci.forEach(function (s) { s.classList.remove('vybrana'); });
        btn.classList.add('vybrana');
        aktualizuj();
      });
      box.appendChild(btn);
    });
    kvizEl.appendChild(box);
  });
}

function aktualizuj() {
  const vse = odpovedi.every(function (o) { return o !== null; });
  vyhodnotitEl.disabled = !vse;
  if (vse) hlaskaEl.textContent = '';
}

vyhodnotitEl.addEventListener('click', function () {
  if (hotovo) return;
  if (!odpovedi.every(function (o) { return o !== null; })) {
    hlaskaEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  hotovo = true;
  hlaskaEl.textContent = '';
  let body = 0;
  const boxy = kvizEl.querySelectorAll('.otazka');
  otazky.forEach(function (o, i) {
    const tlacitka = boxy[i].querySelectorAll('.varianta');
    tlacitka.forEach(function (btn, j) {
      btn.classList.remove('vybrana');
      if (j === o.s) btn.classList.add('spravna');
      else if (j === odpovedi[i]) btn.classList.add('spatna');
    });
    if (odpovedi[i] === o.s) body++;
  });
  vyhodnotitEl.disabled = true;
  skoreEl.textContent = body + ' z ' + otazky.length;
  const pasmo = hodnoceni.find(function (h) { return body >= h.min && body <= h.max; });
  hodnoceniEl.textContent = pasmo ? pasmo.text : '';
  vysledekEl.style.display = 'block';
  vysledekEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

znovuEl.addEventListener('click', function () {
  odpovedi = new Array(otazky.length).fill(null);
  hotovo = false;
  vysledekEl.style.display = 'none';
  hlaskaEl.textContent = '';
  vyhodnotitEl.disabled = true;
  vykresli();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

vykresli();
</script>
</body>
</html>
