<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvíz pro seniory s nadprůměrnými znalostmi: 8/10 je minimum pro zařazení mezi nejlepší</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    margin: 0;
    padding: 40px 20px;
    color: #2c2c2c;
    line-height: 1.6;
  }
  .obal { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
  .perex { font-size: 1.05rem; color: #4a4a4a; margin: 0 0 32px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .varianta:disabled { cursor: default; }
  #vyhodnotit {
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    cursor: pointer;
    font-family: inherit;
  }
  #vyhodnotit:hover { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  #hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.2em; }
  #vysledek {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 24px;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 14px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #znovu {
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    cursor: pointer;
    font-family: inherit;
  }
  #znovu:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 1.5rem; }
    .otazka { padding: 20px; }
  }
</style>
</head>
<body>
<div class="obal">
  <h1>Kvíz pro seniory s nadprůměrnými znalostmi: 8/10 je minimum pro zařazení mezi nejlepší</h1>
  <p class="perex">Koloběh roku, motor pod kapotou, gymnastické nářadí, trestní soudnictví, hmyz na zahradě, drůbež na dvorku, církevní správa, orchestr, námořní míry i stěhování národů.</p>
  <div id="kviz"></div>
  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <p id="hlaska"></p>
</div>
<script>
const otazky = [
  {
    zneni: `1. Ve kterém ročním období spadne v Česku nejvíc srážek?`,
    varianty: [`na jaře`, `v létě`, `na podzim`, `v zimě`],
    spravna: 1
  },
  {
    zneni: `2. Kolikrát se u čtyřdobého motoru otočí klikový hřídel během jednoho pracovního cyklu válce?`,
    varianty: [`jednou`, `dvakrát`, `třikrát`, `čtyřikrát`],
    spravna: 1
  },
  {
    zneni: `3. Jakou šířku má horní plocha závodní gymnastické kladiny?`,
    varianty: [`5 centimetrů`, `8 centimetrů`, `10 centimetrů`, `15 centimetrů`],
    spravna: 2
  },
  {
    zneni: `4. Který soud v České republice rozhoduje v prvním stupni o obžalobě z vraždy?`,
    varianty: [`krajský soud`, `Nejvyšší soud`, `okresní soud`, `vrchní soud`],
    spravna: 0
  },
  {
    zneni: `5. Který z těchto blanokřídlých vylétá za potravou už při teplotách kolem pěti stupňů Celsia?`,
    varianty: [`sršeň obecná`, `čmelák zemní`, `včela medonosná`, `vosa obecná`],
    spravna: 1
  },
  {
    zneni: `6. Kolik dní přibližně trvá, než se ze slepičího vejce vylíhne kuře?`,
    varianty: [`čtrnáct dní`, `jednadvacet dní`, `osmadvacet dní`, `pětatřicet dní`],
    spravna: 1
  },
  {
    zneni: `7. Který duchovní spravuje v katolické církvi diecézi?`,
    varianty: [`biskup`, `děkan`, `kardinál`, `opat`],
    spravna: 0
  },
  {
    zneni: `8. Jak se označuje houslista, který v symfonickém orchestru vede skupinu prvních houslí?`,
    varianty: [`kapelník`, `korepetitor`, `koncertní mistr`, `sbormistr`],
    spravna: 2
  },
  {
    zneni: `9. Kolik metrů měří jedna námořní míle?`,
    varianty: [`1500 metrů`, `1609 metrů`, `1852 metrů`, `2000 metrů`],
    spravna: 2
  },
  {
    zneni: `10. Který germánský král si po ovládnutí Itálie zvolil za sídlo Ravennu?`,
    varianty: [`Alarich`, `Geiserich`, `Chlodvík`, `Theodorich Veliký`],
    spravna: 3
  }
];

const hodnoceni = [
  {
    max: 3,
    text: `Sedm a víc otázek zůstalo bez správné odpovědi, takže nejde o jedno zaváhání, ale o širší odstup napříč obory. Otázky se rozešly do deseti různých oblastí a právě to je na tomhle kvízu nejtvrdší. K hranici osmi bodů, která podle titulku otevírá dveře mezi nejlepší, je odtud daleko, zato každý další pokus se bude počítat.`
  },
  {
    max: 6,
    text: `Kolem téhle poloviny se zastaví hodně řešitelů, průměr ale leží o kousek výš. Snazší začátek, tedy srážkové maximum roku, otáčky klikového hřídele, líhnutí kuřete i správce diecéze, vám vyšel, jenže náročnější střední pásmo, tedy šířka kladiny, soud rozhodující o obžalobě z vraždy, hmyz létající v chladu, houslista v čele orchestru a přesná délka námořní míle, uhnulo o jednu variantu vedle. K hranici osmi bodů z titulku vám chybí dva až čtyři body a to je odstup, který se dohání překvapivě rychle.`
  },
  {
    max: 9,
    text: `Silný výsledek, a pokud jste skončili na osmi nebo výš, splnili jste přesně to, co titulek žádá jako minimum pro zařazení mezi nejlepší. Deset oborů za sebou bez opory v jediné oblasti zvládne málokdo a vy jste v tom obstáli. Se sedmi body jste hranici osmi bodů minuli o jediný bod, což je nejtěsnější možný rozdíl a rozhodla o něm nejspíš jedna jediná varianta.`
  },
  {
    max: 10,
    text: `Plný počet, na který dosáhne jen menšina, a hranici osmi bodů z titulku jste překonali s rezervou. Neshodilo vás srážkové maximum roku, otáčky klikového hřídele, líhnutí kuřete ani správce diecéze. Zvládli jste i celé střední pásmo od šířky gymnastické kladiny přes soud rozhodující o obžalobě z vraždy a hmyz létající v chladu až po houslistu v čele orchestru a přesnou délku námořní míle, a nakonec i nejtěžší otázku kvízu o germánském králi, který si za sídlo zvolil Ravennu.`
  }
];

const odpovedi = new Array(otazky.length).fill(null);
let hotovo = false;

const kvizEl = document.getElementById(`kviz`);
const vyhodnotitEl = document.getElementById(`vyhodnotit`);
const hlaskaEl = document.getElementById(`hlaska`);

function vykresli() {
  kvizEl.innerHTML = ``;
  otazky.forEach(function (o, i) {
    const box = document.createElement(`div`);
    box.className = `otazka`;
    const zneni = document.createElement(`p`);
    zneni.className = `zneni`;
    zneni.textContent = o.zneni;
    box.appendChild(zneni);
    o.varianty.forEach(function (v, j) {
      const tl = document.createElement(`button`);
      tl.className = `varianta`;
      tl.type = `button`;
      tl.textContent = v;
      tl.addEventListener(`click`, function () {
        if (hotovo) return;
        odpovedi[i] = j;
        vykresli();
      });
      if (odpovedi[i] === j) tl.classList.add(`vybrana`);
      box.appendChild(tl);
    });
    kvizEl.appendChild(box);
  });
  vyhodnotitEl.disabled = odpovedi.some(function (o) { return o === null; });
}

vyhodnotitEl.addEventListener(`click`, function () {
  if (odpovedi.some(function (o) { return o === null; })) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  hotovo = true;
  hlaskaEl.textContent = ``;
  let skore = 0;
  const boxy = kvizEl.querySelectorAll(`.otazka`);
  otazky.forEach(function (o, i) {
    const tlacitka = boxy[i].querySelectorAll(`.varianta`);
    if (odpovedi[i] === o.spravna) skore++;
    tlacitka.forEach(function (tl, j) {
      tl.classList.remove(`vybrana`);
      tl.disabled = true;
      if (j === o.spravna) tl.classList.add(`spravna`);
      else if (j === odpovedi[i]) tl.classList.add(`spatna`);
    });
  });
  vyhodnotitEl.disabled = true;
  let text = ``;
  for (let k = 0; k < hodnoceni.length; k++) {
    if (skore <= hodnoceni[k].max) { text = hodnoceni[k].text; break; }
  }
  const vysledek = document.createElement(`div`);
  vysledek.id = `vysledek`;
  const skoreEl = document.createElement(`p`);
  skoreEl.id = `skore`;
  skoreEl.textContent = skore + ` z ` + otazky.length;
  const hodnoceniEl = document.createElement(`p`);
  hodnoceniEl.id = `hodnoceni`;
  hodnoceniEl.textContent = text;
  vysledek.appendChild(skoreEl);
  vysledek.appendChild(hodnoceniEl);
  const znovu = document.createElement(`button`);
  znovu.id = `znovu`;
  znovu.type = `button`;
  znovu.textContent = `Zkusit znovu`;
  znovu.addEventListener(`click`, function () {
    hotovo = false;
    for (let i = 0; i < odpovedi.length; i++) odpovedi[i] = null;
    const stary = document.getElementById(`vysledek`);
    if (stary) stary.remove();
    const staryBtn = document.getElementById(`znovu`);
    if (staryBtn) staryBtn.remove();
    vyhodnotitEl.style.display = `block`;
    hlaskaEl.textContent = ``;
    vykresli();
    window.scrollTo({ top: 0, behavior: `smooth` });
  });
  vyhodnotitEl.style.display = `none`;
  vyhodnotitEl.parentNode.appendChild(vysledek);
  vyhodnotitEl.parentNode.appendChild(znovu);
  vysledek.scrollIntoView({ behavior: `smooth`, block: `start` });
});

vykresli();
</script>
</body>
</html>
