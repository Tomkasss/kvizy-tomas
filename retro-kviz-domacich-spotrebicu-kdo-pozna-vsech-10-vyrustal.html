<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro kvíz domácích spotřebičů: kdo pozná všech 10, vyrůstal v typické domácnosti v ČSSR</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.7rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 18px; }
  .perex { font-size: 1.1rem; color: #444; margin: 0 0 28px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .znuni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin-bottom: 12px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .varianta.zamek { cursor: default; }
  #vyhodnotit {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  #vyhodnotit:hover { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.2em; }
  #vysledek {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 28px;
    display: none;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #znovu {
    display: block;
    margin: 24px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  #znovu:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Retro kvíz domácích spotřebičů: kdo pozná všech 10, vyrůstal v typické domácnosti v ČSSR</h1>
  <p class="perex">Prádelna duněla praním, v kuchyni bublal nedělní oběd a ve spíži chladila plechová lednička. Deset otázek na spotřebiče a značky, které měla za socialismu doma skoro každá rodina. Kolik jich po letech poznáte?</p>
  <div id="kviz"></div>
  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <div class="hlaska" id="hlaska"></div>
  <div id="vysledek">
    <div id="skore"></div>
    <p id="hodnoceni"></p>
    <button id="znovu">Zkusit znovu</button>
  </div>
</div>
<script>
  const otazky = [
    { znuni: `1. Který tuzemský výrobce byl po celou éru ČSSR prakticky synonymem pro kuchyňské sporáky?`,
      varianty: [`a) Romo`, `b) Mora`, `c) Calex`, `d) Elektro-Praga`], spravna: 1 },
    { znuni: `2. Litinové ruční mlýnky na maso, které prošly téměř každou československou kuchyní, se prodávaly pod jakou značkou?`,
      varianty: [`a) Porkert`, `b) Sandrik`, `c) Berndorf`, `d) Frigera`], spravna: 0 },
    { znuni: `3. Vířivé pračky, které se za praní samy posouvaly po podlaze, proslavily hlavně kterou tuzemskou značku?`,
      varianty: [`a) Tatramat`, `b) Elektro-Praga`, `c) Calex`, `d) Romo`], spravna: 3 },
    { znuni: `4. Domácí šicí stroje typ 233 s klikatým stehem vyráběla od roku 1954 která tuzemská značka?`,
      varianty: [`a) Minerva`, `b) Veritas`, `c) Lada`, `d) Singer`], spravna: 2 },
    { znuni: `5. Hlinecký závod, z něhož později vyrostl proslulý výrobce domácích spotřebičů, začal roku 1943 výrobou kterého spotřebiče?`,
      varianty: [`a) vysavačů`, `b) elektrických žehliček`, `c) mixérů`, `d) ledniček`], spravna: 1 },
    { znuni: `6. Jaký nezvyklý tvar dostal jeden z nejznámějších tuzemských fénů z dílny designérů Lachmana a Hájka?`,
      varianty: [`a) tvar mušle`, `b) tvar rakety`, `c) tvar podkovy`, `d) tvar laserové (vesmírné) pistole`], spravna: 3 },
    { znuni: `7. Průtokové plynové ohřívače vody, které se staly běžnou výbavou koupelen v panelácích i činžácích, vyráběl pod svou značkou který tuzemský podnik?`,
      varianty: [`a) Karma`, `b) Tatramat`, `c) Mora`, `d) Frigera`], spravna: 0 },
    { znuni: `8. Malé 40litrové absorpční chladničky, oblíbené v těsných panelákových kuchyních, vyráběl který podnik?`,
      varianty: [`a) Calex`, `b) Tatramat`, `c) Elektrosvit`, `d) Mora`], spravna: 2 },
    { znuni: `9. Značka Perla se v československých domácnostech pojila s výrobou kterého domácího spotřebiče?`,
      varianty: [`a) elektrického šlehače`, `b) stolní odstředivky na prádlo`, `c) šicího stroje`, `d) kávovaru`], spravna: 1 },
    { znuni: `10. Největší československý výrobce gramofonů sídlil pod hlavičkou Tesly ve kterém moravském městě?`,
      varianty: [`a) Přerov`, `b) Prostějov`, `c) Olomouc`, `d) Litovel`], spravna: 3 }
  ];

  const odpovedi = new Array(otazky.length).fill(null);
  let vyhodnoceno = false;
  const kvizEl = document.getElementById(`kviz`);
  const btn = document.getElementById(`vyhodnotit`);
  const hlaska = document.getElementById(`hlaska`);

  otazky.forEach((o, i) => {
    const box = document.createElement(`div`);
    box.className = `otazka`;
    const z = document.createElement(`div`);
    z.className = `znuni`;
    z.textContent = o.znuni;
    box.appendChild(z);
    o.varianty.forEach((v, j) => {
      const b = document.createElement(`button`);
      b.className = `varianta`;
      b.textContent = v;
      b.addEventListener(`click`, () => {
        if (vyhodnoceno) return;
        odpovedi[i] = j;
        Array.from(box.querySelectorAll(`.varianta`)).forEach(el => el.classList.remove(`vybrana`));
        b.classList.add(`vybrana`);
        if (odpovedi.every(x => x !== null)) { btn.disabled = false; hlaska.textContent = ``; }
      });
      box.appendChild(b);
    });
    kvizEl.appendChild(box);
  });

  btn.addEventListener(`click`, () => {
    if (odpovedi.some(x => x === null)) { hlaska.textContent = `Odpovězte prosím na všechny otázky`; return; }
    vyhodnoceno = true;
    let skore = 0;
    const boxy = kvizEl.querySelectorAll(`.otazka`);
    boxy.forEach((box, i) => {
      const tlacitka = box.querySelectorAll(`.varianta`);
      tlacitka.forEach((b, j) => {
        b.classList.add(`zamek`);
        b.classList.remove(`vybrana`);
        if (j === otazky[i].spravna) b.classList.add(`spravna`);
        else if (j === odpovedi[i]) b.classList.add(`spatna`);
      });
      if (odpovedi[i] === otazky[i].spravna) skore++;
    });
    btn.disabled = true;
    hlaska.textContent = ``;
    document.getElementById(`skore`).textContent = skore + ` z 10`;
    document.getElementById(`hodnoceni`).textContent = hodnoceniText(skore);
    document.getElementById(`vysledek`).style.display = `block`;
    document.getElementById(`vysledek`).scrollIntoView({ behavior: `smooth` });
  });

  function hodnoceniText(s) {
    if (s <= 3) return `Spotřebiče socialistické domácnosti vám dnes splývají. Dobu jste možná zastihli jen okrajem dětství, nebo se vám značky ze spíže, prádelny i kuchyně z paměti vytratily. Do typické domácnosti v ČSSR jste zatím spíš jen nakoukli. Nevadí, stačí zalistovat starými fotkami a leccos se vám samo vybaví.`;
    if (s <= 6) return `Poctivý průměr pamětníka. Půlku spotřebičů máte pořád živě před očima, u zbytku jste chvíli lovili v paměti. Nejslavnější značky jste trefili, u méně omílaných výrobců a modelů jste ale zaváhali. Přesně tady se pohybuje většina těch, kdo v takové domácnosti vyrůstali.`;
    if (s <= 9) return `Výborný výkon. Domácnost za socialismu znáte napříč obory, od sporáku a pračky přes ledničku až po šicí stroj a gramofon. Poznáte i to, co jsme schovali za pouhý popis. K plnému počtu vám chybělo opravdu málo.`;
    return `Plný počet a jasný důkaz, že jste vyrůstali v typické domácnosti v ČSSR. Značky, modely i výrobní podniky té doby znáte tak, jako byste je včera drželi v ruce. Takový přehled o spotřebičích socialistické éry má dnes už málokdo, klobouk dolů.`;
  }

  document.getElementById(`znovu`).addEventListener(`click`, () => {
    vyhodnoceno = false;
    for (let i = 0; i < odpovedi.length; i++) odpovedi[i] = null;
    kvizEl.querySelectorAll(`.varianta`).forEach(b => { b.className = `varianta`; });
    document.getElementById(`vysledek`).style.display = `none`;
    btn.disabled = true;
    hlaska.textContent = ``;
    window.scrollTo({ top: 0, behavior: `smooth` });
  });
</script>
</body>
</html>
