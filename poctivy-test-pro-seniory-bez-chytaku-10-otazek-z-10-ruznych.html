<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poctivý test pro seniory bez chytáků: 10 otázek z 10 různých oborů</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  margin: 0;
  padding: 40px 20px;
  color: #2c2c2c;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin: 0 0 32px; }
.otazka {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.varianta {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 10px;
}
.varianta:last-child { margin-bottom: 0; }
.varianta:hover { background: #ede8e1; }
.varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.hotovo .varianta { cursor: default; }
#vyhodnotit {
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#vyhodnotit:hover { background: #4a6b4e; }
#vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
#hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.4em; }
#vysledek {
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border-top: 4px solid #5b7e5f;
  padding: 28px;
  margin-top: 40px;
  display: none;
}
#skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
#hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#znovu {
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#znovu:hover { background: #756658; }
@media (max-width: 767px) {
  body { padding: 16px; }
  h1 { font-size: 1.5rem; }
  .otazka, #vysledek { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Poctivý test pro seniory bez chytáků: 10 otázek z 10 různých oborů</h1>
<p class="perex">Deset otázek, deset různých oborů a žádné chytáky ani počítání. Od mytologie a dějin přes sport, jídlo a jazyky až po fotografii, techniku a nerosty. Milí senioři, ptáme se přímo a poctivě. Kolik z deseti trefíte?</p>

<div id="kviz"></div>

<button id="vyhodnotit" disabled>Vyhodnotit</button>
<p id="hlaska"></p>

<div id="vysledek">
  <p id="skore"></p>
  <p id="hodnoceni"></p>
  <button id="znovu">Zkusit znovu</button>
</div>
</div>

<script>
var otazky = [
  {
    zneni: `Který řecký bůh byl bohem ohně a kovářského řemesla?`,
    varianty: [`Áres`, `Hermés`, `Héfaistos`, `Poseidón`],
    spravna: 2
  },
  {
    zneni: `Který atletický víceboj je na letních olympijských hrách vypsaný pro ženy?`,
    varianty: [`pětiboj`, `sedmiboj`, `osmiboj`, `desetiboj`],
    spravna: 1
  },
  {
    zneni: `Z čeho se vyrábí italský sýr ricotta?`,
    varianty: [`z plnotučného mléka sraženého sýřidlem`, `ze syrovátky`, `ze zakysané smetany`, `z tvarohu`],
    spravna: 1
  },
  {
    zneni: `Od které země koupily Spojené státy americké Aljašku?`,
    varianty: [`od Ruska`, `od Velké Británie`, `od Kanady`, `od Dánska`],
    spravna: 0
  },
  {
    zneni: `Který oblak přináší nejčastěji bouřku s prudkým deštěm?`,
    varianty: [`cirrus`, `stratus`, `altokumulus`, `kumulonimbus`],
    spravna: 3
  },
  {
    zneni: `Co se ve fotoaparátu reguluje nastavením clony?`,
    varianty: [`množství světla, které projde objektivem`, `citlivost snímače`, `ohnisková vzdálenost objektivu`, `doba, po kterou dopadá světlo na snímač`],
    spravna: 0
  },
  {
    zneni: `Kdo je autorem básnické sbírky Balady a romance?`,
    varianty: [`Vítězslav Hálek`, `Karel Jaromír Erben`, `Jaroslav Vrchlický`, `Jan Neruda`],
    spravna: 3
  },
  {
    zneni: `Do které skupiny jazyků patří rumunština?`,
    varianty: [`do slovanských`, `do germánských`, `do románských`, `do ugrofinských`],
    spravna: 2
  },
  {
    zneni: `Z jakého kovu je vlákno klasické žárovky?`,
    varianty: [`z wolframu`, `z mědi`, `z niklu`, `z platiny`],
    spravna: 0
  },
  {
    zneni: `Odrůdami kterého nerostu jsou drahé kameny rubín a safír?`,
    varianty: [`berylu`, `korundu`, `křemene`, `topazu`],
    spravna: 1
  }
];

var hodnoceni = [
  { min: 0, max: 3, text: `Deset oborů za sebou je nápor i pro člověka se širokým rozhledem. Stačí, aby vás minuly tři čtyři oblasti, a skóre se zastaví tady. Žádná otázka přitom nebyla postavená tak, aby vás nachytala, ptaly se přímo a odpověď byla pokaždé mezi čtyřmi možnostmi. Projděte si otázky ještě jednou a všimněte si, které obory vás stáhly nejvíc. S odstupem si je pak zkuste projít znovu a začněte právě u nich.` },
  { min: 4, max: 6, text: `Slušný základ, na kterém se dá stavět. Zhruba polovina otázek sedla a druhá uhnula o jednu variantu vedle. Láme se to obvykle u oborů, ke kterým má člověk v běžném životě nejdál a nenarazí na ně léta. To se dá doplnit čtením, rozhled na to už máte.` },
  { min: 7, max: 9, text: `Výsledek, se kterým se dá chlubit. Zvládli jste přeskakovat mezi obory, které spolu nemají vůbec nic společného, a nerozhodilo vás ani to, že dvě varianty stály těsně u sebe. Zastavila vás jedna nebo dvě otázky, a je celkem jedno, ze kterého oboru byly.` },
  { min: 10, max: 10, text: `Plný počet, a přesně to titulek slibuje: deset otázek z deseti různých oborů, žádný chyták a žádné počítání. Neshodila vás mytologie, sport, gastronomie, historie, počasí, fotografie, literatura, jazyky, technika ani nerosty. Takový rozptyl se tipováním netrefí, ten se musí opravdu mít. Klobouk dolů.` }
];

var odpovedi = [];
var vyhodnoceno = false;
var kvizEl = document.getElementById(`kviz`);
var tlacitkoVyhodnotit = document.getElementById(`vyhodnotit`);
var hlaskaEl = document.getElementById(`hlaska`);
var vysledekEl = document.getElementById(`vysledek`);
var skoreEl = document.getElementById(`skore`);
var hodnoceniEl = document.getElementById(`hodnoceni`);
var tlacitkoZnovu = document.getElementById(`znovu`);

function vykresli() {
  kvizEl.innerHTML = ``;
  for (var i = 0; i < otazky.length; i++) {
    var box = document.createElement(`div`);
    box.className = `otazka`;
    var nadpis = document.createElement(`p`);
    nadpis.className = `zneni`;
    nadpis.textContent = (i + 1) + `. ` + otazky[i].zneni;
    box.appendChild(nadpis);
    for (var j = 0; j < otazky[i].varianty.length; j++) {
      var btn = document.createElement(`button`);
      btn.className = `varianta`;
      btn.type = `button`;
      btn.textContent = otazky[i].varianty[j];
      btn.setAttribute(`data-otazka`, i);
      btn.setAttribute(`data-varianta`, j);
      btn.addEventListener(`click`, klikVarianta);
      box.appendChild(btn);
    }
    kvizEl.appendChild(box);
  }
}

function klikVarianta(e) {
  if (vyhodnoceno) return;
  var btn = e.currentTarget;
  var oi = parseInt(btn.getAttribute(`data-otazka`), 10);
  var vi = parseInt(btn.getAttribute(`data-varianta`), 10);
  var box = btn.parentNode;
  var vsechny = box.getElementsByClassName(`varianta`);
  for (var k = 0; k < vsechny.length; k++) {
    vsechny[k].classList.remove(`vybrana`);
  }
  btn.classList.add(`vybrana`);
  odpovedi[oi] = vi;
  zkontrolujHotovost();
}

function zkontrolujHotovost() {
  var hotovo = true;
  for (var i = 0; i < otazky.length; i++) {
    if (typeof odpovedi[i] !== `number`) { hotovo = false; break; }
  }
  tlacitkoVyhodnotit.disabled = !hotovo;
  if (hotovo) hlaskaEl.textContent = ``;
}

tlacitkoVyhodnotit.addEventListener(`click`, function () {
  var hotovo = true;
  for (var i = 0; i < otazky.length; i++) {
    if (typeof odpovedi[i] !== `number`) { hotovo = false; break; }
  }
  if (!hotovo) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  vyhodnoceno = true;
  hlaskaEl.textContent = ``;
  tlacitkoVyhodnotit.disabled = true;
  var boxy = kvizEl.getElementsByClassName(`otazka`);
  var skore = 0;
  for (var i = 0; i < otazky.length; i++) {
    boxy[i].classList.add(`hotovo`);
    var vsechny = boxy[i].getElementsByClassName(`varianta`);
    for (var j = 0; j < vsechny.length; j++) {
      vsechny[j].classList.remove(`vybrana`);
      if (j === otazky[i].spravna) {
        vsechny[j].classList.add(`spravna`);
      } else if (j === odpovedi[i]) {
        vsechny[j].classList.add(`spatna`);
      }
    }
    if (odpovedi[i] === otazky[i].spravna) skore++;
  }
  skoreEl.textContent = skore + ` z ` + otazky.length;
  for (var h = 0; h < hodnoceni.length; h++) {
    if (skore >= hodnoceni[h].min && skore <= hodnoceni[h].max) {
      hodnoceniEl.textContent = hodnoceni[h].text;
      break;
    }
  }
  vysledekEl.style.display = `block`;
  vysledekEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

tlacitkoZnovu.addEventListener(`click`, function () {
  odpovedi = [];
  vyhodnoceno = false;
  vysledekEl.style.display = `none`;
  hlaskaEl.textContent = ``;
  tlacitkoVyhodnotit.disabled = true;
  vykresli();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

vykresli();
</script>
</body>
</html>
