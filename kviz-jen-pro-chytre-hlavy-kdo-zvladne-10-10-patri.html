<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz jen pro chytré hlavy. Kdo zvládne 10/10, patří k nejchytřejším</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 20px 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
  .perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
  .q {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .opt:disabled { cursor: default; }
  .txtinput {
    width: 100%;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
  }
  #evalBtn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  #evalBtn:hover { background: #4a6b4e; }
  #evalBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a2b2b; margin-top: 14px; min-height: 1.2em; }
  #result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 28px;
    display: none;
  }
  .score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
  .verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
  #retryBtn {
    display: block;
    margin: 28px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  #retryBtn:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    .q { padding: 20px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvíz jen pro chytré hlavy. Kdo zvládne 10/10, patří k nejchytřejším</h1>
  <p class="perex">Deset otázek napříč dějinami, vědou, uměním, hudbou i zeměpisem. Bitva u Poltavy, nejjižnější cíp Afriky, autor Obrázků z výstavy nebo román Oblomov. Plný počet deset z deseti tu dá jen zlomek lidí.</p>
  <div id="quiz"></div>
  <button id="evalBtn" disabled>Vyhodnotit</button>
  <div class="hint" id="hint"></div>
  <div id="result">
    <div class="score" id="score"></div>
    <div class="verdict" id="verdict"></div>
    <button id="retryBtn">Zkusit znovu</button>
  </div>
</div>
<script>
const questions = [
  { q: `Ve kterém roce rozdrtil car Petr Veliký švédskou armádu v bitvě u Poltavy?`,
    opts: [`1700`, `1709`, `1718`, `1721`], correct: 1 },
  { q: `Který astronom jako první doložil, že se světlo šíří konečnou rychlostí?`,
    opts: [`Galileo Galilei`, `Christiaan Huygens`, `James Bradley`, `Ole Rømer`], correct: 3 },
  { q: `Který mys je nejjižnějším bodem afrického kontinentu?`,
    opts: [`Střelkový mys`, `mys Dobré naděje`, `mys Guardafui`, `mys Blanco`], correct: 0 },
  { q: `Který skladatel je autorem klavírního cyklu Obrázky z výstavy?`,
    opts: [`Alexandr Borodin`, `Nikolaj Rimskij-Korsakov`, `Modest Musorgskij`, `Petr Iljič Čajkovskij`], correct: 2 },
  { q: `Která panovnice byla roku 1587 popravena na příkaz anglické královny Alžběty I.?`,
    opts: [`Marie Stuartovna`, `Jana Greyová`, `Anna Boleynová`, `Kateřina Howardová`], correct: 0 },
  { q: `Ve kterém roce byl v Bellových laboratořích sestrojen první tranzistor?`,
    opts: [`1938`, `1947`, `1954`, `1961`], correct: 1 },
  { q: `Který malíř vytvořil iluzivní stropní fresku Apoteóza svatého Ignáce v římském kostele Sant'Ignazio?`,
    opts: [`Pietro da Cortona`, `Giovanni Battista Gaulli`, `Andrea Pozzo`, `Luca Giordano`], correct: 2 },
  { q: `Ve které bitvě roku 331 př. n. l. zlomil Alexandr Veliký rozhodujícím vítězstvím definitivně moc perského krále Dareia III. a zpečetil pád jeho říše?`,
    opts: [`u Gráníku`, `u Gaugamél`, `u Issu`, `u Hydaspu`], correct: 1 },
  { q: `Který německý chemik roku 1828 jako první uměle připravil organickou látku, močovinu, z anorganických výchozích surovin a naboural tím teorii vitalismu?`,
    opts: [`Justus von Liebig`, `Hermann Kolbe`, `Friedrich Wöhler`, `Robert Bunsen`], correct: 2 },
  { q: `Který ruský spisovatel je autorem románu Oblomov?`,
    opts: [`Ivan Turgeněv`, `Nikolaj Gogol`, `Nikolaj Leskov`, `Ivan Gončarov`], correct: 3 }
];

const answers = new Array(questions.length).fill(null);
let locked = false;
const quizEl = document.getElementById('quiz');
const evalBtn = document.getElementById('evalBtn');
const hintEl = document.getElementById('hint');
const letters = ['a', 'b', 'c', 'd'];

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = (qi + 1) + '. ' + item.q;
    box.appendChild(qt);
    item.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = letters[oi] + ') ' + opt;
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll('.opt')).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateBtn();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateBtn() {
  const allAnswered = answers.every(a => a !== null);
  evalBtn.disabled = !allAnswered;
  if (allAnswered) hintEl.textContent = '';
}

function evaluate() {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.opt');
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (oi === answers[qi]) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  showResult(score);
}

function showResult(score) {
  const total = questions.length;
  document.getElementById('score').textContent = score + ' z ' + total;
  let text = '';
  if (score <= 3) {
    text = `Laťka byla nastavená bezohledně vysoko a většina otázek si vás podala. U kvízu tohohle kalibru to nikoho nezaskočí, mezi nejchytřejší se ale dnes podle skóre zařadit nedaří. Spousta objevů napříč obory teprve čeká.`;
  } else if (score <= 6) {
    text = `Tady končí největší část řešitelů. Máte solidní široký přehled a pár těžkých otázek jste zvládli, jenže přesně u těch nejtvrdších detailů z dějin, vědy a umění vás kvíz zastavil. K deklarované špičce to zatím o kus nestačí.`;
  } else if (score <= 9) {
    text = `Vynikající výkon. Orientujete se napříč obory mnohem líp než většina lidí a nachytat vás jde jen na těch úplně nejzáludnějších otázkách. K plnému počtu, který odděluje nejchytřejší, chybělo opravdu málo.`;
  } else {
    text = `Naprostá špička. Plný počet u kvízu, kde skoro každá otázka svádí ke špatné odpovědi, dá jen nepatrný zlomek lidí. Tohle není náhoda ani štěstí při tipování, ale skóre, které vás podle titulku řadí mezi nejchytřejší hlavy. Smekáme.`;
  }
  document.getElementById('verdict').textContent = text;
  const result = document.getElementById('result');
  result.style.display = 'block';
  evalBtn.style.display = 'none';
  result.scrollIntoView({ behavior: 'smooth' });
}

function retry() {
  locked = false;
  answers.fill(null);
  document.getElementById('result').style.display = 'none';
  evalBtn.style.display = 'block';
  evalBtn.disabled = true;
  hintEl.textContent = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

evalBtn.addEventListener('click', evaluate);
document.getElementById('retryBtn').addEventListener('click', retry);
render();
</script>
</body>
</html>
