<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Jak dobře znáte seriál Arabela? Rumburak by všech 10 bodů nezískal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0eb;font-family:Georgia,"Times New Roman",serif;color:#2c2c2c}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 16px;color:#2c2c2c}
.perex{font-size:1.05rem;line-height:1.6;color:#4a4a4a;margin:0 0 32px}
.q{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-bottom:24px}
.qt{font-weight:bold;font-size:1.15rem;color:#2c2c2c;margin:0 0 16px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;background:#f7f4f0;border:1px solid #d9d2c9;border-radius:8px;font-size:1rem;color:#3a3a3a;font-family:inherit;margin-bottom:10px;cursor:pointer}
.opt:hover{background:#ede8e1}
.opt.sel{background:#dcd3c7;border:1px solid #a89e92;font-weight:bold}
.opt.ok{background:#d4edda;border-color:#7cb987;color:#1e5631}
.opt.bad{background:#f8d7da;border-color:#d4848a;color:#721c24}
.locked .opt{cursor:default}
.locked .opt:hover{}
.fb{margin-top:8px;font-size:.95rem;line-height:1.5}
.fb.okt{color:#1e5631}.fb.badt{color:#721c24}
.btn{background:#5b7e5f;color:#fff;padding:16px 40px;border-radius:8px;font-size:1.1rem;font-weight:bold;border:none;display:block;margin:40px auto 0;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a6b4e}
.btn:disabled{background:#b5b5b5;cursor:not-allowed}
.hint{text-align:center;color:#721c24;margin-top:12px;font-size:.95rem}
.result{background:#fefcf9;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-top:40px;border-top:4px solid #5b7e5f;display:none}
.score{font-size:2.5rem;font-weight:bold;color:#5b7e5f;text-align:center;margin:0 0 12px}
.rtext{font-size:1rem;color:#4a4a4a;text-align:center;line-height:1.6;margin:0}
.again{background:#8c7b6b}
.again:hover{background:#756658}
@media (max-width:600px){.wrap{padding:20px 16px 40px}.q{padding:16px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz: Jak dobře znáte seriál Arabela? Rumburak by všech 10 bodů nezískal</h1>
<p class="perex">Premiéra o Vánocích 1980 a pak repríza za reprízou. Kdo u Arabely vyrůstal, ví, že zlý čaroděj dokázal všechno pokazit. Teď se ukáže, jestli si ze seriálu pamatujete víc než on sám.</p>
<div id="quiz"></div>
<button id="eval" class="btn" disabled>Vyhodnotit</button>
<p id="hint" class="hint">Odpovězte prosím na všechny otázky</p>
<div id="result" class="result"><p id="score" class="score"></p><p id="rtext" class="rtext"></p><button id="again" class="btn again">Zkusit znovu</button></div>
</div>
<script>
const Q=[
{q:`Který kouzelný předmět plní v seriálu Arabela přání svého majitele?`,o:[`kouzelný plášť`,`kouzelný prsten`,`kouzelné zrcátko`,`kouzelný klobouk`],c:1},
{q:`Jak se jmenuje syn Majerových, do kterého se Arabela zamiluje?`,o:[`Petr`,`Pavel`,`Tomáš`,`Martin`],c:0},
{q:`Jaké povolání má v seriálu Arabela pan Majer?`,o:[`spisovatel pohádkových knížek`,`loutkoherec v pohádkovém divadle`,`vypravěč pohádek v televizi`,`režisér filmových pohádek`],c:2},
{q:`V jaké zvíře se v seriálu Arabela promění pan Majer?`,o:[`v kocoura`,`v papouška`,`v žábu`,`v jezevčíka`],c:3},
{q:`Kdo je v seriálu Arabela Blekota?`,o:[`čert`,`vodník`,`skřítek`,`loupežník`],c:0},
{q:`Kterou postavu hrál v seriálu Arabela Vlastimil Brodský?`,o:[`dvorního kouzelníka Viga`,`krále Hyacinta`,`vodníka`,`ředitele školy Dudu`],c:1},
{q:`Která herečka hrála v seriálu Arabela princeznu Xénii?`,o:[`Zlata Adamovská`,`Veronika Žilková`,`Dagmar Patrasová`,`Ivana Andrlová`],c:2},
{q:`Kdo v závěru seriálu Arabela překazí popravu na Rumburakově hradě?`,o:[`Krakonoš`,`Robin Hood`,`Jánošík`,`Fantomas`],c:3},
{q:`Kdo napsal scénář seriálu Arabela spolu s režisérem Václavem Vorlíčkem?`,o:[`Miloš Macourek`,`Jiří Brdečka`,`Zdeněk Svěrák`,`Jaroslav Dietl`],c:0},
{q:`Která západoněmecká televize se podílela na výrobě seriálu Arabela?`,o:[`ZDF`,`SWF`,`WDR`,`BR`],c:2}
];
const EV=[
{min:0,max:3,t:`Tady by se Rumburak smál nahlas. Říše pohádek vám za ta léta zmizela z hlavy, ale stačí jedna repríza o Vánocích a vrátí se.`},
{min:4,max:6,t:`Hlavní příběh si pamatujete, jenže vedlejší postavy a zákulisí vám proklouzly mezi prsty. Rumburakovi jste ale v patách.`},
{min:7,max:9,t:`Výborně. Seriál jste sledovali pozorně a pamatujete si víc než většina diváků. Rumburaka už máte za sebou, plný počet vám utekl jen o kousek.`},
{min:10,max:10,t:`Překonali jste Rumburaka. Žádné kouzlo, žádný prsten, jen čistá paměť. V říši pohádek by vás král Hyacint pasoval na dvorního znalce.`}
];
const quiz=document.getElementById(`quiz`),evalBtn=document.getElementById(`eval`),hint=document.getElementById(`hint`),res=document.getElementById(`result`);
let sel=[],locked=false;
function render(){
  quiz.innerHTML=``;sel=Q.map(()=>null);locked=false;quiz.classList.remove(`locked`);
  Q.forEach((q,i)=>{
    const box=document.createElement(`div`);box.className=`q`;
    const t=document.createElement(`p`);t.className=`qt`;t.textContent=(i+1)+`. `+q.q;box.appendChild(t);
    q.o.forEach((o,j)=>{
      const b=document.createElement(`button`);b.type=`button`;b.className=`opt`;b.textContent=`abcd`[j]+`) `+o;
      b.addEventListener(`click`,()=>{if(locked)return;sel[i]=j;box.querySelectorAll(`.opt`).forEach((x,k)=>x.classList.toggle(`sel`,k===j));update();});
      box.appendChild(b);
    });
    const fb=document.createElement(`p`);fb.className=`fb`;box.appendChild(fb);
    quiz.appendChild(box);
  });
  res.style.display=`none`;update();
}
function update(){const all=sel.every(x=>x!==null);evalBtn.disabled=!all||locked;hint.style.display=(all||locked)?`none`:`block`;}
evalBtn.addEventListener(`click`,()=>{
  if(sel.some(x=>x===null))return;
  locked=true;quiz.classList.add(`locked`);let s=0;
  quiz.querySelectorAll(`.q`).forEach((box,i)=>{
    const opts=box.querySelectorAll(`.opt`),c=Q[i].c,fb=box.querySelector(`.fb`);
    opts.forEach(o=>o.classList.remove(`sel`));
    opts[c].classList.add(`ok`);
    if(sel[i]===c){s++;fb.className=`fb okt`;fb.textContent=`Správně.`;}
    else{opts[sel[i]].classList.add(`bad`);fb.className=`fb badt`;fb.textContent=`Špatně. Správná odpověď: `+`abcd`[c]+`) `+Q[i].o[c];}
  });
  document.getElementById(`score`).textContent=s+` z `+Q.length;
  const e=EV.find(x=>s>=x.min&&s<=x.max);document.getElementById(`rtext`).textContent=e?e.t:``;
  res.style.display=`block`;update();res.scrollIntoView({behavior:`smooth`,block:`start`});
});
document.getElementById(`again`).addEventListener(`click`,()=>{render();window.scrollTo({top:0,behavior:`smooth`});});
render();
</script>
</body>
</html>
