<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvíz zapomenutých vědomostí pro seniory: mladí často tápou, ale vy můžete dát 10/10</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 40px 20px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin: 0 0 36px; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  cursor: pointer;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.locked .opt { cursor: default; }
.locked .opt:hover { background: #f7f4f0; }
.locked .opt.selected:hover { background: #dcd3c7; }
.locked .opt.correct:hover { background: #d4edda; }
.locked .opt.wrong:hover { background: #f8d7da; }
#submit, #retry {
  display: block;
  margin: 40px auto 0;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  color: #fff;
  cursor: pointer;
}
#submit { background: #5b7e5f; }
#submit:hover:not(:disabled) { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
#retry { background: #8c7b6b; }
#retry:hover { background: #756658; }
#warn { text-align: center; color: #721c24; margin-top: 14px; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 40px;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
@media (max-width: 600px) {
  body { padding: 16px; }
  h1 { font-size: 1.5rem; }
  .q { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz zapomenutých vědomostí pro seniory: mladí často tápou, ale vy můžete dát 10/10</h1>
<p class="perex">Deset otázek z toho, co se kdysi bralo ve škole nebo se o tom běžně mluvilo doma i v hospodě. Dnešní mladí většinu těchhle věcí míjejí. Vám možná zůstaly v hlavě dodnes.</p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<p id="warn" hidden>Odpovězte prosím na všechny otázky</p>
<div id="result" hidden>
  <p id="score"></p>
  <p id="verdict"></p>
</div>
<button id="retry" hidden>Zkusit znovu</button>
</div>
<script>
var QUESTIONS = [
  {
    q: `Který muž se ujal úřadu prezidenta Spojených států poté, co Richard Nixon odstoupil kvůli aféře Watergate?`,
    o: [`Gerald Ford`, `Spiro Agnew`, `Henry Kissinger`, `Jimmy Carter`],
    a: 0
  },
  {
    q: `Který z těchto mužů zastával v prozatímní československé vládě z října 1918 úřad ministra vojenství?`,
    o: [`Antonín Švehla`, `Milan Rastislav Štefánik`, `Vavro Šrobár`, `Jiří Stříbrný`],
    a: 1
  },
  {
    q: `Jaké trasy se v českém turistickém značení označují žlutou barvou?`,
    o: [`dálkové a hřebenové trasy`, `trasy místního významu`, `krátké spojovací cesty`, `naučné stezky`],
    a: 2
  },
  {
    q: `Ke kterému měsíci se v českých pranostikách vztahují takzvaní ledoví muži?`,
    o: [`březen`, `duben`, `květen`, `červen`],
    a: 2
  },
  {
    q: `Jak se dnes jmenuje ruské město, které se za druhé světové války jmenovalo Stalingrad?`,
    o: [`Samara`, `Nižnij Novgorod`, `Volgograd`, `Kaliningrad`],
    a: 2
  },
  {
    q: `Kdo je autorem románu Stříbrný vítr?`,
    o: [`Viktor Dyk`, `Karel Toman`, `Stanislav Kostka Neumann`, `Fráňa Šrámek`],
    a: 3
  },
  {
    q: `Který malíř je pokládán za zakladatele českého barokního malířství?`,
    o: [`Karel Škréta`, `Petr Brandl`, `Václav Hollar`, `Jan Kupecký`],
    a: 0
  },
  {
    q: `Kdo stojí za režií filmu Král Šumavy z roku 1959?`,
    o: [`Jiří Weiss`, `Karel Kachyňa`, `Ján Kadár`, `Zbyněk Brynych`],
    a: 1
  },
  {
    q: `Jak se jmenuje dechová kapela, kterou proslavil kapelník a skladatel Ladislav Kubeš?`,
    o: [`Moravanka`, `Mistříňanka`, `Veselka`, `Krajanka`],
    a: 2
  },
  {
    q: `Který český chemik stojí za vývojem plastické trhaviny Semtex?`,
    o: [`Emil Votoček`, `Stanislav Brebera`, `Bohuslav Brauner`, `Rudolf Lukeš`],
    a: 1
  }
];

var VERDICTS = [
  { max: 3, t: `Zatím se vám vybavilo jen málo z toho, co kdysi patřilo k běžné výbavě. Přesně tady se dnes potkává většina mladších řešitelů, kteří tyhle věci ve škole už neslyšeli a nikde jinde na ně nenarazili. U vás je ale rozdíl v tom, že ty znalosti nejsou ztracené, jen zapadlé. Projděte si správné odpovědi a při druhém čtení uvidíte, kolik z nich znáte odjinud.` },
  { max: 6, t: `Poctivá půlka a přesně to pásmo, ve kterém dnešní třicátníci a čtyřicátníci obvykle končí. Základ držíte, jenže tam, kde otázka mířila hlouběji než na první dojem, jste zaváhali. Do horní poloviny chybí jedna až tři odpovědi, a to je vzdálenost, kterou zvládne jedno odpoledne s encyklopedií.` },
  { max: 9, t: `Tady se láme titulek. Sedm bodů znamená, že jste mladší ročníky nechali za sebou; osm a devět je výsledek, na který se dnes bez soustavného zájmu dostane opravdu málokdo. Devět z deseti je hranice, u které už jde o vědomosti, jaké se z běžného povědomí prakticky vytratily.` },
  { max: 10, t: `Plný počet, a to je v tomhle kvízu menšina. Neztratili jste bod ani v jediné z deseti otázek, včetně těch, na kterých ztrácejí i lidé s dobrým rozhledem. Deset z deseti tady znamená, že vám v hlavě zůstala celá vrstva vědomostí, kterou mladší generace nemá kde získat. Titulek je naplněný beze zbytku.` }
];

var LETTERS = [`a) `, `b) `, `c) `, `d) `];
var answers = new Array(QUESTIONS.length).fill(null);
var locked = false;

var quizEl = document.getElementById(`quiz`);
var submitEl = document.getElementById(`submit`);
var warnEl = document.getElementById(`warn`);
var resultEl = document.getElementById(`result`);
var scoreEl = document.getElementById(`score`);
var verdictEl = document.getElementById(`verdict`);
var retryEl = document.getElementById(`retry`);

QUESTIONS.forEach(function (item, qi) {
  var box = document.createElement(`div`);
  box.className = `q`;
  var head = document.createElement(`p`);
  head.className = `q-text`;
  head.textContent = (qi + 1) + `. ` + item.q;
  box.appendChild(head);
  item.o.forEach(function (opt, oi) {
    var btn = document.createElement(`button`);
    btn.type = `button`;
    btn.className = `opt`;
    btn.textContent = LETTERS[oi] + opt;
    btn.addEventListener(`click`, function () {
      if (locked) { return; }
      answers[qi] = oi;
      Array.prototype.forEach.call(box.querySelectorAll(`.opt`), function (b) {
        b.classList.remove(`selected`);
      });
      btn.classList.add(`selected`);
      updateSubmit();
    });
    box.appendChild(btn);
  });
  quizEl.appendChild(box);
});

function updateSubmit() {
  var all = answers.every(function (v) { return v !== null; });
  submitEl.disabled = !all;
  if (all) { warnEl.hidden = true; }
}

submitEl.addEventListener(`click`, function () {
  if (submitEl.disabled) {
    warnEl.hidden = false;
    return;
  }
  locked = true;
  var score = 0;
  var boxes = quizEl.querySelectorAll(`.q`);
  QUESTIONS.forEach(function (item, qi) {
    var box = boxes[qi];
    box.classList.add(`locked`);
    var opts = box.querySelectorAll(`.opt`);
    opts[item.a].classList.add(`correct`);
    if (answers[qi] === item.a) {
      score++;
    } else {
      opts[answers[qi]].classList.add(`wrong`);
    }
  });
  scoreEl.textContent = score + ` z ` + QUESTIONS.length;
  for (var i = 0; i < VERDICTS.length; i++) {
    if (score <= VERDICTS[i].max) { verdictEl.textContent = VERDICTS[i].t; break; }
  }
  submitEl.hidden = true;
  warnEl.hidden = true;
  resultEl.hidden = false;
  retryEl.hidden = false;
  resultEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

retryEl.addEventListener(`click`, function () {
  locked = false;
  answers = new Array(QUESTIONS.length).fill(null);
  Array.prototype.forEach.call(quizEl.querySelectorAll(`.q`), function (box) {
    box.classList.remove(`locked`);
    Array.prototype.forEach.call(box.querySelectorAll(`.opt`), function (b) {
      b.classList.remove(`selected`, `correct`, `wrong`);
    });
  });
  resultEl.hidden = true;
  retryEl.hidden = true;
  submitEl.hidden = false;
  submitEl.disabled = true;
  window.scrollTo({ top: 0, behavior: `smooth` });
});
</script>
</body>
</html>
