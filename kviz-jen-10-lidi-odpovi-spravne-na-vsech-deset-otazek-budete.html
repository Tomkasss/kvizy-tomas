<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Jen 10 % lidí odpoví správně na všech deset otázek. Budete mezi nimi?</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f5f0eb;font-family:Georgia,"Times New Roman",serif;color:#2c2c2c}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.8rem;line-height:1.3;margin:0 0 16px}
.perex{font-size:1.05rem;line-height:1.6;color:#4a4a4a;margin:0 0 28px}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-bottom:24px}
.qt{font-weight:bold;font-size:1.15rem;color:#2c2c2c;margin:0 0 16px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;background:#f7f4f0;border:1px solid #d9d2c9;border-radius:8px;font-size:1rem;color:#3a3a3a;font-family:inherit;margin-bottom:10px;cursor:pointer}
.opt:hover{background:#ede8e1}
.opt.sel{background:#dcd3c7;border:1px solid #a89e92;font-weight:bold}
.opt.ok{background:#d4edda;border:1px solid #7cb987;color:#1e5631}
.opt.bad{background:#f8d7da;border:1px solid #d4848a;color:#721c24}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:.95rem}
.fb.ok{color:#1e5631}.fb.bad{color:#721c24}
.btn{background:#5b7e5f;color:#fff;padding:16px 40px;border-radius:8px;font-size:1.1rem;font-weight:bold;border:none;display:block;margin:40px auto 0;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a6b4e}
.btn:disabled{background:#b5b5b5;cursor:not-allowed}
.hint{text-align:center;color:#721c24;margin-top:12px;font-size:.95rem}
#result{display:none;background:#fefcf9;border-top:4px solid #5b7e5f;margin-top:32px}
.score{font-size:2.5rem;font-weight:bold;color:#5b7e5f;text-align:center;margin:0 0 12px}
.etext{font-size:1rem;color:#4a4a4a;text-align:center;line-height:1.6;margin:0}
#retry{background:#8c7b6b}
#retry:hover{background:#756658}
@media (max-width:600px){body{padding:16px}.box{padding:20px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz: Jen 10 % lidí odpoví správně na všech deset otázek. Budete mezi nimi?</h1>
<p class="perex">Konkláve, Evropská komise, středověký obchodní spolek, skotská palírna, animovaný zlobr, nejhustší kožich v přírodě a kreslíř slavného Galla. Kde vám paměť podrží a kde ujede?</p>
<div id="quiz"></div>
<button class="btn" id="eval" disabled>Vyhodnotit</button>
<p class="hint" id="hint">Odpovězte prosím na všechny otázky</p>
<div class="box" id="result"><p class="score" id="score"></p><p class="etext" id="etext"></p><button class="btn" id="retry">Zkusit znovu</button></div>
</div>
<script>
const Q=[
{q:`Ve které zemi se konaly zimní olympijské hry 2026?`,o:[`ve Švýcarsku`,`ve Francii`,`v Rakousku`,`v Itálii`],a:3},
{q:`Jaké jméno přijal papež zvolený v roce 2025?`,o:[`Lev XIV.`,`Pius XIII.`,`Jan XXIV.`,`Benedikt XVII.`],a:0},
{q:`Které studio natočilo animovaný film Shrek?`,o:[`Pixar`,`DreamWorks`,`Walt Disney Animation Studios`,`Blue Sky Studios`],a:1},
{q:`Kdo stojí v čele Evropské komise?`,o:[`Roberta Metsolaová`,`Christine Lagardeová`,`Ursula von der Leyenová`,`Kaja Kallasová`],a:2},
{q:`Které město bylo vůdčím centrem Hanzy?`,o:[`Hamburk`,`Lübeck`,`Brémy`,`Gdaňsk`],a:1},
{q:`O které souostroví vedly v roce 1982 válku Argentina a Velká Británie?`,o:[`o Falklandy`,`o Bermudy`,`o Galapágy`,`o Ohňovou zemi`],a:0},
{q:`Spalováním čeho při sušení sladu získává skotská whisky kouřovou chuť?`,o:[`bukového dřeva`,`dubových štěpků`,`hnědého uhlí`,`rašeliny`],a:3},
{q:`Který savec má nejhustší srst?`,o:[`činčila`,`lední medvěd`,`vydra mořská`,`pižmoň`],a:2},
{q:`Která sopka v roce 2010 ochromila letecký provoz nad Evropou?`,o:[`Eyjafjallajökull`,`Hekla`,`Katla`,`Grímsvötn`],a:0},
{q:`Který kreslíř vytvořil spolu se scenáristou René Goscinnym postavu Asterixe?`,o:[`Morris`,`Jean-Jacques Sempé`,`Albert Uderzo`,`Hergé`],a:2}
];
const E=[
{min:0,max:3,t:`Mezi desetinu s plným počtem jste se tentokrát nedostali, a ani zdaleka. Spletly vás i otázky ze zpráv a ze školního zeměpisu. Projděte si správné odpovědi a zkuste kvíz za pár dní znovu.`},
{min:4,max:6,t:`Do elitní desetiny vám chybí několik zásahů. Základ máte, ale u těsných dvojic jako činčila a vydra mořská nebo Hamburk a Lübeck jste sáhli vedle. Takový výsledek má velká část lidí.`},
{min:7,max:9,t:`Těsně za hranicí. Máte nadprůměrný rozhled, mezi těch deset procent vás ale nepustily jedna až tři odpovědi. Nejspíš to byla skotská palírna, islandská sopka nebo kreslíř Asterixe.`},
{min:10,max:10,t:`Jste mezi nimi. Všech deset odpovědí bez jediné chyby, od papežského jména po Uderza. Do téhle skupiny se podle titulku dostane zhruba jen každý desátý, a vy jste to dokázali.`}
];
const quiz=document.getElementById(`quiz`),ev=document.getElementById(`eval`),hint=document.getElementById(`hint`),res=document.getElementById(`result`);
let sel=[],locked=false;
function render(){
quiz.innerHTML=``;sel=Q.map(()=>null);locked=false;
Q.forEach((q,i)=>{
const b=document.createElement(`div`);b.className=`box`;
const t=document.createElement(`p`);t.className=`qt`;t.textContent=(i+1)+`. `+q.q;b.appendChild(t);
q.o.forEach((o,j)=>{
const btn=document.createElement(`button`);btn.className=`opt`;btn.type=`button`;btn.textContent=`abcd`[j]+`) `+o;
btn.addEventListener(`click`,()=>{if(locked)return;sel[i]=j;b.querySelectorAll(`.opt`).forEach((x,k)=>x.classList.toggle(`sel`,k===j));upd();});
b.appendChild(btn);});
const fb=document.createElement(`div`);fb.className=`fb`;b.appendChild(fb);
quiz.appendChild(b);});
res.style.display=`none`;ev.style.display=`block`;upd();}
function upd(){const all=sel.every(x=>x!==null);ev.disabled=!all;hint.style.display=all?`none`:`block`;}
ev.addEventListener(`click`,()=>{
if(ev.disabled)return;locked=true;let s=0;
quiz.querySelectorAll(`.box`).forEach((b,i)=>{
const opts=b.querySelectorAll(`.opt`),q=Q[i],fb=b.querySelector(`.fb`);
opts.forEach((x,k)=>{x.disabled=true;x.classList.remove(`sel`);if(k===q.a)x.classList.add(`ok`);else if(k===sel[i])x.classList.add(`bad`);});
if(sel[i]===q.a){s++;fb.className=`fb ok`;fb.textContent=`Správně`;}
else{fb.className=`fb bad`;fb.textContent=`Špatně. Správná odpověď: `+`abcd`[q.a]+`) `+q.o[q.a];}});
document.getElementById(`score`).textContent=s+` z `+Q.length;
document.getElementById(`etext`).textContent=E.find(e=>s>=e.min&&s<=e.max).t;
ev.style.display=`none`;hint.style.display=`none`;res.style.display=`block`;res.scrollIntoView({behavior:`smooth`});});
document.getElementById(`retry`).addEventListener(`click`,()=>{render();window.scrollTo({top:0,behavior:`smooth`});});
render();
</script>
</body>
</html>
