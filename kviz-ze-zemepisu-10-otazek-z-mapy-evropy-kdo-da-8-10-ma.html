<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz ze zeměpisu: 10 otázek z mapy Evropy. Kdo dá 8/10, má paměť jako ve 40</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  max-width: 720px;
  margin: 0 auto;
  background: #f5f0eb;
  color: #2c2c2c;
  padding: 24px 16px 60px;
  line-height: 1.55;
}
h1 { font-size: 1.7rem; line-height: 1.25; color: #2c2c2c; margin: 8px 0 18px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin-bottom: 28px; }
.question-box {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 12px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s;
}
.option:last-child { margin-bottom: 0; }
.option:hover { background: #ede8e1; }
.option.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.option.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.option.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.option:disabled { cursor: default; }
#evaluate, #retry {
  display: block;
  margin: 40px auto 0;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  color: #fff;
  cursor: pointer;
}
#evaluate { background: #5b7e5f; }
#evaluate:hover { background: #4a6b4e; }
#evaluate:disabled { background: #b5b5b5; cursor: not-allowed; }
#retry { background: #8c7b6b; }
#retry:hover { background: #756658; }
.hint { text-align: center; color: #8a7f72; margin-top: 12px; font-style: italic; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
</style>
</head>
<body>
<h1>Kvíz ze zeměpisu: 10 otázek z mapy Evropy. Kdo dá 8/10, má paměť jako ve 40</h1>
<div class="perex">Deset otázek z evropské mapy: hlavní město, ostrov, poloostrov, záliv, řeka, pohoří, průplav i jezero. Varianty jsou si blízko a rychlá volba často zradí. Osm správných odpovědí znamená paměť jako ve čtyřiceti.</div>

<div id="quiz"></div>

<button id="evaluate" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>

<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>

<script>
const questions = [
  { q: `Které město je hlavním městem Bosny a Hercegoviny?`,
    options: [`Banja Luka`, `Mostar`, `Sarajevo`, `Tuzla`], correct: 2 },
  { q: `Ke kterému státu patří ostrov Elba?`,
    options: [`Itálie`, `Francie`, `Řecko`, `Chorvatsko`], correct: 0 },
  { q: `Ve kterém státě leží poloostrov Peloponés?`,
    options: [`Turecko`, `Itálie`, `Albánie`, `Řecko`], correct: 3 },
  { q: `Který stát sousedí s Českou republikou i s Itálií?`,
    options: [`Německo`, `Rakousko`, `Slovensko`, `Slovinsko`], correct: 1 },
  { q: `Mezi kterými dvěma státy leží Botnický záliv?`,
    options: [`Mezi Švédskem a Finskem`, `Mezi Finskem a Ruskem`, `Mezi Ruskem a Estonskem`, `Mezi Estonskem a Švédskem`], correct: 0 },
  { q: `Která řeka je nejdelší ve Francii?`,
    options: [`Seina`, `Garonna`, `Loira`, `Rhôna`], correct: 2 },
  { q: `Ve kterém státě leží největší část pohoří Karpaty?`,
    options: [`Slovensko`, `Polsko`, `Ukrajina`, `Rumunsko`], correct: 3 },
  { q: `Ve kterém státě leží region Valonsko?`,
    options: [`Francie`, `Belgie`, `Nizozemsko`, `Švýcarsko`], correct: 1 },
  { q: `Která dvě moře spojuje Kielský průplav?`,
    options: [`Severní moře a Norské moře`, `Severní moře a Baltské moře`, `Baltské moře a Bílé moře`, `Norské moře a Bílé moře`], correct: 1 },
  { q: `Ve kterých dvou státech se rozkládá Neziderské jezero?`,
    options: [`V Rakousku a Maďarsku`, `V Maďarsku a na Slovensku`, `V Rakousku a Slovinsku`, `Na Slovensku a ve Slovinsku`], correct: 0 }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const evaluateBtn = document.getElementById('evaluate');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retry');
const letters = ['a', 'b', 'c', 'd'];

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'question-box';
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = (qi + 1) + '. ' + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = letters[oi] + ') ' + opt;
      if (answers[qi] === oi) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateEvaluate();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateEvaluate() {
  const allAnswered = answers.every(a => a !== null);
  evaluateBtn.disabled = !allAnswered;
}

evaluateBtn.addEventListener('click', () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.question-box');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.option');
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (answers[qi] === oi) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  showResult(score);
});

function showResult(score) {
  scoreEl.textContent = score + ' z 10';
  let text = '';
  if (score <= 3) text = `Mapová paměť odpovídá zhruba úrovni sedmdesáti let. Obrysy Evropy ve vás zůstaly, ale konkrétní jména se rozpadla a mezi dvěma sousedními státy jste sázeli spíš na náhodu. Ke čtyřicítce z titulku je odsud daleko, dohnat se to ale dá jediným odpolednem nad atlasem.`;
  else if (score <= 6) text = `Paměť na úrovni zhruba pětapadesáti až pětašedesáti let. Známější kouty mapy máte pevně, jenže u zálivu, průplavu nebo pohoří sdíleného několika státy se jistota vytratila. Ke slíbené čtyřicítce chybí dva až čtyři body.`;
  else if (score <= 9) text = `Tohle je pásmo, o kterém mluví titulek, a dostane se do něj zhruba každý druhý. Sedm bodů odpovídá paměti kolem padesátky, osm je přesně ta čtyřicítka, kterou název slibuje, a devět bodů posouvá výsledek až k pětatřiceti letům. Rozeznali jste od sebe státy, které si lidé běžně pletou, a zaváhali nanejvýš u tří těsných sousedů na mapě.`;
  else text = `Paměť na úrovni pětadvaceti až třiceti let, tedy hluboko pod hranicí z titulku. Od bosenské metropole přes středomořský ostrov, severský záliv a francouzský veletok až po stepní jezero na dvojí hranici jste nezaváhali ani jednou. Plných deset z deseti dá z mapy Evropy opravdu jen zlomek lidí.`;
  verdictEl.textContent = text;
  resultEl.style.display = 'block';
  evaluateBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.scrollIntoView({ behavior: 'smooth' });
}

retryBtn.addEventListener('click', () => {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = 'none';
  evaluateBtn.style.display = 'block';
  render();
  updateEvaluate();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
updateEvaluate();
</script>
</body>
</html>
