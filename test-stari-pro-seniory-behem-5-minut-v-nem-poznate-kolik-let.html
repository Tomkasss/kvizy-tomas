<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test stáří pro seniory: během 5 minut v něm poznáte, kolik let je vašemu mozku</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  max-width: 720px;
  margin: 0 auto;
  background: #f5f0eb;
  color: #2c2c2c;
  padding: 24px 16px 60px;
  line-height: 1.55;
}
h1 { font-size: 1.7rem; line-height: 1.25; color: #2c2c2c; margin: 8px 0 18px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin-bottom: 28px; }
.question-box {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 12px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s;
}
.option:last-child { margin-bottom: 0; }
.option:hover { background: #ede8e1; }
.option.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.option.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.option.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.option:disabled { cursor: default; }
#evaluate, #retry {
  display: block;
  margin: 40px auto 0;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  color: #fff;
  cursor: pointer;
}
#evaluate { background: #5b7e5f; }
#evaluate:hover { background: #4a6b4e; }
#evaluate:disabled { background: #b5b5b5; cursor: not-allowed; }
#retry { background: #8c7b6b; }
#retry:hover { background: #756658; }
.hint { text-align: center; color: #8a7f72; margin-top: 12px; font-style: italic; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
</style>
</head>
<body>
<h1>Test stáří pro seniory: během 5 minut v něm poznáte, kolik let je vašemu mozku</h1>
<div class="perex">Deset otázek na logiku, slovní cit i všeobecný rozhled, žádné biflování letopočtů. Za pět minut a podle počtu bodů vám prozradím, na kolik let máte svěží mozek. Čím víc trefíte, tím nižší věk mozku vám vyjde.</div>

<div id="quiz"></div>

<button id="evaluate" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>

<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>

<script>
const questions = [
  { q: `Všichni ptáci snášejí vejce. Vrabec je pták. Co z toho jistě vyplývá?`,
    options: [`Vrabec snáší vejce`, `Vrabec nesnáší vejce`, `Všichni, kdo snášejí vejce, jsou ptáci`, `Nelze nic určit`], correct: 0 },
  { q: `Které město do této řady nepatří?`,
    options: [`Paříž`, `Barcelona`, `Vídeň`, `Madrid`], correct: 1 },
  { q: `Která jazykovědná disciplína zkoumá původ a vývoj slov?`,
    options: [`morfologie`, `fonetika`, `etymologie`, `sémantika`], correct: 2 },
  { q: `ŽIDLE je ke DŘEVU jako SKLENICE je k čemu?`,
    options: [`sklu`, `vodě`, `polici`, `ruce`], correct: 0 },
  { q: `Který světadíl tvoří ze všech nejvíce samostatných států?`,
    options: [`Asie`, `Evropa`, `Jižní Amerika`, `Afrika`], correct: 3 },
  { q: `Co znamená přídavné jméno malicherný?`,
    options: [`velkorysý a štědrý`, `lakomý a šetřící každou korunu`, `kdo přehnaně lpí na nepodstatných maličkostech`, `náladový a vrtkavý`], correct: 2 },
  { q: `Který z těchto kovů je ze všech nejlehčí, tedy má nejnižší hustotu?`,
    options: [`lithium`, `hliník`, `hořčík`, `sodík`], correct: 0 },
  { q: `Co znamená obrat „mít máslo na hlavě"?`,
    options: [`je nedůvěřivý a stále ve střehu`, `sám se něčím provinil a má proč mlčet`, `je pomalý a těžko se rozhoduje`, `rád vaří a dopřává si dobré jídlo`], correct: 1 },
  { q: `Který starověký řecký matematik je autorem díla Základy, jež po staletí sloužilo jako učebnice geometrie?`,
    options: [`Pythagoras`, `Archimédés`, `Thalés`, `Eukleidés`], correct: 3 },
  { q: `Někteří sportovci jsou plavci. Všichni plavci umí zadržet dech. Co z toho jistě vyplývá?`,
    options: [`Všichni sportovci umí zadržet dech`, `Někteří sportovci umí zadržet dech`, `Všichni, kdo umí zadržet dech, jsou plavci`, `Nelze nic určit`], correct: 1 }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const evaluateBtn = document.getElementById('evaluate');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retry');
const letters = ['a', 'b', 'c', 'd'];

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'question-box';
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = (qi + 1) + '. ' + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = letters[oi] + ') ' + opt;
      if (answers[qi] === oi) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateEvaluate();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateEvaluate() {
  const allAnswered = answers.every(a => a !== null);
  evaluateBtn.disabled = !allAnswered;
}

evaluateBtn.addEventListener('click', () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.question-box');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.option');
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (answers[qi] === oi) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  showResult(score);
});

function showResult(score) {
  scoreEl.textContent = score + ' z 10';
  let text = '';
  if (score <= 3) text = 'Věk vašeho mozku vychází kolem 70 let a výš. Několik rychlých úsudků i slovních chytáků vás dnes zaskočilo a hlava volila pohodlnější cestu než tu správnou. Nic ztraceného, bystrost se dá probrat čtením, luštěním a hrou se slovy, a příště bude číslo znatelně níž.';
  else if (score <= 6) text = 'Věk vašeho mozku vychází zhruba na 55 až 65 let. Polovinu úloh jste rozlouskli s jistotou, u zbytku vás stáhla první nabízející se možnost. Solidní střed přesně tam, kde se drží většina svěžích seniorů, a základ, na kterém se dá dál stavět.';
  else if (score <= 9) text = 'Věk vašeho mozku vychází kolem 40 až 50 let. Logika, významy slov i všeobecný rozhled vám naskakují svižně a většina pastí vás nezastavila. Takovou svěžest vám leckdo mladší jen tiše závidí.';
  else text = 'Věk vašeho mozku vychází na skvělých 30 let. Ani jedna past vás nezastavila a uvažujete i vážíte slova jako člověk v nejlepších letech. Takhle bystře a jistě myslí jen menšina, a vy do ní patříte. Klobouk dolů.';
  verdictEl.textContent = text;
  resultEl.style.display = 'block';
  evaluateBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.scrollIntoView({ behavior: 'smooth' });
}

retryBtn.addEventListener('click', () => {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = 'none';
  evaluateBtn.style.display = 'block';
  render();
  updateEvaluate();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
updateEvaluate();
</script>
</body>
</html>
