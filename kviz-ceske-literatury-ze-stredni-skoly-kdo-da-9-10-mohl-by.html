<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz české literatury ze střední školy: kdo dá 9/10, mohl by znovu k maturitě</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    margin: 0;
    padding: 40px 20px;
    color: #2c2c2c;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
  .perex { font-size: 1.05rem; color: #4a4a4a; margin: 0 0 32px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .varianta:disabled { cursor: default; }
  #vyhodnotit {
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #vyhodnotit:hover { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  #hlaska { text-align: center; color: #8c3b3b; margin-top: 14px; min-height: 1.2em; }
  #vysledek {
    background: #fefcf9;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    border-top: 4px solid #5b7e5f;
    padding: 28px;
    margin-top: 40px;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #znovu {
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #znovu:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 1.5rem; }
    .otazka { padding: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvíz české literatury ze střední školy: kdo dá 9/10, mohl by znovu k maturitě</h1>
  <p class="perex">Deset otázek z toho, co se v hodinách češtiny probírá na střední škole, od nejstarších památek až po dvacáté století. Míří i mimo nejomílanější tituly, takže devět bodů z deseti tu odpovídá znalostem maturitního ročníku.</p>

  <div id="kviz"></div>

  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <p id="hlaska"></p>

  <div id="vysledek" style="display:none">
    <p id="skore"></p>
    <p id="hodnoceni"></p>
    <button id="znovu">Zkusit znovu</button>
  </div>
</div>

<script>
var otazky = [
  {
    zneni: `1. Do kterého literárního druhu patří román, novela a povídka?`,
    varianty: [`a) lyrika`, `b) epika`, `c) drama`, `d) lyrickoepika`],
    spravna: 1
  },
  {
    zneni: `2. Kdo je autorem sbírky Povídky malostranské?`,
    varianty: [`a) Jakub Arbes`, `b) Vítězslav Hálek`, `c) Karolina Světlá`, `d) Jan Neruda`],
    spravna: 3
  },
  {
    zneni: `3. Jak se jmenuje nejstarší dochovaná česky psaná duchovní píseň?`,
    varianty: [`a) Hospodine, pomiluj ny`, `b) Svatý Václave`, `c) Jesu Kriste, ščedrý kněže`, `d) Buoh všemohúcí`],
    spravna: 0
  },
  {
    zneni: `4. Kdo je autorem sbírek Ohlas písní ruských a Ohlas písní českých?`,
    varianty: [`a) Václav Hanka`, `b) Pavel Josef Šafařík`, `c) František Ladislav Čelakovský`, `d) Jan Kollár`],
    spravna: 2
  },
  {
    zneni: `5. Jak se jmenovalo umělecké sdružení, jehož hlavním teoretikem byl Karel Teige?`,
    varianty: [`a) Skupina 42`, `b) Devětsil`, `c) Osma`, `d) Tvrdošíjní`],
    spravna: 1
  },
  {
    zneni: `6. Který veršový systém je založen na pravidelném střídání přízvučných a nepřízvučných slabik uspořádaných do stop?`,
    varianty: [`a) sylabický`, `b) časoměrný`, `c) sylabotónický`, `d) tónický`],
    spravna: 2
  },
  {
    zneni: `7. Jak se označuje skupina českých básníků, jejíž vůdčí osobností byl Jaroslav Vrchlický a která proti důrazu na domácí národní látku prosazovala orientaci na světovou literaturu?`,
    varianty: [`a) májovci`, `b) ruchovci`, `c) dekadenti`, `d) lumírovci`],
    spravna: 3
  },
  {
    zneni: `8. Kdo je autorem barokní básnické skladby Co Bůh? Člověk?`,
    varianty: [`a) Felix Kadlinský`, `b) Adam Václav Michna z Otradovic`, `c) Bedřich Bridel`, `d) Václav Jan Rosa`],
    spravna: 2
  },
  {
    zneni: `9. Jaké bylo vlastní jméno básníka Otokara Březiny?`,
    varianty: [`a) Emil Frída`, `b) Václav Jebavý`, `c) Vladimír Vašek`, `d) Jiří Ohrenstein`],
    spravna: 1
  },
  {
    zneni: `10. Jak se jmenovala samizdatová edice, kterou v roce 1972 založil Ludvík Vaculík?`,
    varianty: [`a) Petlice`, `b) Expedice`, `c) Kvart`, `d) Popelnice`],
    spravna: 0
  }
];

var hodnoceni = [
  { min: 0, max: 3, text: `Ze středoškolské literatury vám zůstala jen nejhrubší kostra a i v ní se jména pletou napříč staletími. K maturitě z češtiny byste se v tomhle stavu hlásit nemohli, komise by vás poslala na opravný termín ještě před rozborem díla. Většinu bodů jste získali tam, kde stačilo tušení.` },
  { min: 4, max: 6, text: `Přesně tady končí většina lidí, kteří maturitu dávno odložili do šuplíku. Základ z hodin češtiny držíte, jenže ozval se hlavně u autorů, kteří se omílají všude. Jakmile přišla řada na méně slavná díla, směry a souvislosti, přesná znalost chyběla. Na maturitní laťku z titulku vám schází tři až pět bodů.` },
  { min: 7, max: 9, text: `Výborný výsledek, tohle už není náhoda. Sedm a osm bodů znamená, že se v české literatuře orientujete daleko za hranicí povinné četby. Devět bodů je přesně ta hranice, kterou titulek klade: s takovým skóre byste si mohli sednout k maturitě z češtiny znovu a projít bez přípravy. Neshodily vás ani otázky, kde vedle sebe stáli autoři téže generace.` },
  { min: 10, max: 10, text: `Plný počet, a ten tady dá málokdo. Poznali jste barokní skladbu, vlastní jméno symbolisty i název samizdatové edice, tedy věci, které se z hlavy vytrácejí jako první. K maturitě z češtiny byste mohli klidně usednout na druhou stranu stolu, mezi zkoušející. Klobouk dolů.` }
];

var odpovedi = new Array(otazky.length).fill(null);
var vyhodnoceno = false;

var kvizEl = document.getElementById(`kviz`);
var tlacitkoEl = document.getElementById(`vyhodnotit`);
var hlaskaEl = document.getElementById(`hlaska`);
var vysledekEl = document.getElementById(`vysledek`);
var skoreEl = document.getElementById(`skore`);
var hodnoceniEl = document.getElementById(`hodnoceni`);
var znovuEl = document.getElementById(`znovu`);

function vykresli() {
  kvizEl.innerHTML = ``;
  otazky.forEach(function (o, i) {
    var box = document.createElement(`div`);
    box.className = `otazka`;

    var zneni = document.createElement(`p`);
    zneni.className = `zneni`;
    zneni.textContent = o.zneni;
    box.appendChild(zneni);

    o.varianty.forEach(function (v, j) {
      var btn = document.createElement(`button`);
      btn.className = `varianta`;
      btn.type = `button`;
      btn.textContent = v;
      btn.addEventListener(`click`, function () {
        if (vyhodnoceno) { return; }
        odpovedi[i] = j;
        var sourozenci = box.querySelectorAll(`.varianta`);
        for (var k = 0; k < sourozenci.length; k++) {
          sourozenci[k].classList.remove(`vybrana`);
        }
        btn.classList.add(`vybrana`);
        hlaskaEl.textContent = ``;
        zkontrolujPripravenost();
      });
      box.appendChild(btn);
    });

    kvizEl.appendChild(box);
  });
}

function zkontrolujPripravenost() {
  var hotovo = odpovedi.every(function (o) { return o !== null; });
  tlacitkoEl.disabled = !hotovo;
}

tlacitkoEl.addEventListener(`click`, function () {
  if (tlacitkoEl.disabled) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  if (!odpovedi.every(function (o) { return o !== null; })) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }

  vyhodnoceno = true;
  var skore = 0;
  var boxy = kvizEl.querySelectorAll(`.otazka`);

  otazky.forEach(function (o, i) {
    var tlacitka = boxy[i].querySelectorAll(`.varianta`);
    for (var j = 0; j < tlacitka.length; j++) {
      tlacitka[j].disabled = true;
      tlacitka[j].classList.remove(`vybrana`);
    }
    tlacitka[o.spravna].classList.add(`spravna`);
    if (odpovedi[i] === o.spravna) {
      skore++;
    } else {
      tlacitka[odpovedi[i]].classList.add(`spatna`);
    }
  });

  tlacitkoEl.disabled = true;
  hlaskaEl.textContent = ``;

  skoreEl.textContent = skore + ` z ` + otazky.length;
  for (var h = 0; h < hodnoceni.length; h++) {
    if (skore >= hodnoceni[h].min && skore <= hodnoceni[h].max) {
      hodnoceniEl.textContent = hodnoceni[h].text;
      break;
    }
  }
  vysledekEl.style.display = `block`;
  vysledekEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

znovuEl.addEventListener(`click`, function () {
  odpovedi = new Array(otazky.length).fill(null);
  vyhodnoceno = false;
  vysledekEl.style.display = `none`;
  hlaskaEl.textContent = ``;
  tlacitkoEl.disabled = true;
  vykresli();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

vykresli();
</script>
</body>
</html>
