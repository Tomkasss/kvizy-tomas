<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literární kvíz: kdo dá 6 z 10, má nadprůměrný rozhled</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.8rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
.perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 16px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: #3a3a3a;
  cursor: pointer;
  transition: background .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
#submit {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #a05050; margin-top: 12px; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
#retry {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retry:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
<h1></h1>
<p class="perex"></p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>
<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const TITLE = `Literární kvíz: kdo dá 6 z 10, má nadprůměrný rozhled`;
const PEREX = `Deset otázek napříč literaturou od antiky po dvacáté století, od veršů přes drama až po romány, ze světové i české tvorby. Průměrný čtenář jich uhádne kolem pěti. Kdo zvládne šest a víc, prokazuje nadprůměrný literární rozhled.`;
const QUESTIONS = [
  { q: `Který římský básník je autorem antického eposu Aeneis?`,
    options: [`Ovidius`, `Vergilius`, `Horatius`, `Lucretius`], correct: 1 },
  { q: `Ve které Shakespearově tragédii dožene intrikán Jago hlavního hrdinu k zavraždění manželky Desdemony?`,
    options: [`Hamlet`, `Macbeth`, `Othello`, `Král Lear`], correct: 2 },
  { q: `Které z těchto děl Jana Amose Komenského je alegorií, v níž poutník prochází lidskou společností jako městem plným marnosti a klamu a pokoj nalézá teprve ve vlastním nitru?`,
    options: [`Svět v obrazech`, `Labyrint světa a ráj srdce`, `Brána jazyků otevřená`, `Velká didaktika`], correct: 1 },
  { q: `Který italský spisovatel je autorem svého jediného románu Gepard, fresky o zániku sicilské šlechty za sjednocování Itálie?`,
    options: [`Giuseppe Tomasi di Lampedusa`, `Alberto Moravia`, `Italo Calvino`, `Cesare Pavese`], correct: 0 },
  { q: `Který argentinský spisovatel proslul filozofickými povídkami ze sbírek Fikce a Alef?`,
    options: [`Gabriel García Márquez`, `Julio Cortázar`, `Jorge Luis Borges`, `Mario Vargas Llosa`], correct: 2 },
  { q: `Který český básník 19. století napsal satirickou skladbu Král Lávra o králi s oslíma ušima?`,
    options: [`Svatopluk Čech`, `Jan Neruda`, `Vítězslav Hálek`, `Karel Havlíček Borovský`], correct: 3 },
  { q: `Který francouzský básník proslul obrazovými básněmi, takzvanými kaligramy?`,
    options: [`Paul Éluard`, `Guillaume Apollinaire`, `Louis Aragon`, `Jean Cocteau`], correct: 1 },
  { q: `Který polský autor historického románu Quo vadis z doby císaře Nerona převzal roku 1905 Nobelovu cenu za literaturu?`,
    options: [`Czesław Miłosz`, `Władysław Reymont`, `Henryk Sienkiewicz`, `Wisława Szymborska`], correct: 2 },
  { q: `Pod jakým pseudonymem vydával své knihy anglický matematik a logik Charles Lutwidge Dodgson?`,
    options: [`John le Carré`, `Joseph Conrad`, `George Orwell`, `Lewis Carroll`], correct: 3 },
  { q: `Který anglický básník pozdního středověku je autorem veršované sbírky Canterburské povídky?`,
    options: [`Geoffrey Chaucer`, `William Langland`, `Thomas Malory`, `John Gower`], correct: 0 }
];
const RANGES = [
  { min: 0, max: 3, text: `Literatura vám zůstala kdesi ve školních lavicích a i odtud se vytratila. Jména a díla se vám pletou napříč staletími a orientaci máte jen v tom nejslavnějším jádru. Váš literární rozhled je zatím pod průměrem, je co dohánět.` },
  { min: 4, max: 6, text: `Přesně tady se pohybuje většina čtenářů. S pěti body držíte solidní průměr, něco ze školy i vlastní četby ve vás zůstalo. Šestý zásah ale překlápí misku vah: kdo dá 6 z 10, prokazuje podle laťky tohoto kvízu nadprůměrný literární rozhled a vidí za hranice povinné četby.` },
  { min: 7, max: 9, text: `Výrazně nadprůměrný výsledek. Nečtete jen tituly ze seznamu, ale zvládáte i méně omílané autory, směry a souvislosti napříč obdobími. Patříte mezi lidi, pro které je literatura skutečným koníčkem, ne jen vzpomínkou na maturitu.` },
  { min: 10, max: 10, text: `Naprostá špička, výsledek na úrovni znalce. Vyznáte se v antice, baroku, romantismu i moderně, ve světové i české tvorbě a nezaskočí vás ani pseudonym či méně známé dílo. Plný počet dá málokdo, klobouk dolů.` }
];

const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

document.querySelector(`h1`).textContent = TITLE;
document.querySelector(`.perex`).textContent = PEREX;

const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submit`);
const hintEl = document.getElementById(`hint`);
const resultEl = document.getElementById(`result`);

function render() {
  quizEl.innerHTML = ``;
  QUESTIONS.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `q`;
    const qt = document.createElement(`div`);
    qt.className = `q-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `opt`;
      btn.textContent = opt;
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll(`.opt`)).forEach(b => b.classList.remove(`selected`));
        btn.classList.add(`selected`);
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  if (all) hintEl.textContent = ``;
}

submitBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.q`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.opt`);
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      if (oi === QUESTIONS[qi].correct) btn.classList.add(`correct`);
      if (oi === answers[qi] && answers[qi] !== QUESTIONS[qi].correct) btn.classList.add(`wrong`);
    });
    if (answers[qi] === QUESTIONS[qi].correct) score++;
  });
  document.getElementById(`score`).textContent = score + ` z ` + QUESTIONS.length;
  const r = RANGES.find(x => score >= x.min && score <= x.max);
  document.getElementById(`verdict`).textContent = r ? r.text : ``;
  submitBtn.style.display = `none`;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth` });
});

document.getElementById(`retry`).addEventListener(`click`, () => {
  locked = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  render();
  submitBtn.style.display = `block`;
  submitBtn.disabled = true;
  resultEl.style.display = `none`;
  hintEl.textContent = ``;
  window.scrollTo({ top: 0, behavior: `smooth` });
});

render();
</script>
</body>
</html>
