<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vědomostní kvíz pro chytré hlavy: většina lidí nezvládne správně ani 8 otázek</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0eb;font-family:Georgia,"Times New Roman",serif;color:#2c2c2c}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 16px}
.perex{font-size:1.05rem;line-height:1.6;color:#4a4a4a;margin:0 0 32px}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-bottom:24px}
.qtext{font-weight:bold;font-size:1.15rem;color:#2c2c2c;margin:0 0 16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;background:#f7f4f0;border:1px solid #d9d2c9;border-radius:8px;font-size:1rem;color:#3a3a3a;font-family:inherit;margin-bottom:10px;cursor:pointer}
.opt:hover{background:#ede8e1}
.opt.sel{background:#dcd3c7;border:1px solid #a89e92;font-weight:bold}
.opt.correct{background:#d4edda;border:1px solid #7cb987;color:#1e5631}
.opt.wrong{background:#f8d7da;border:1px solid #d4848a;color:#721c24}
.opt:disabled{cursor:default}
.fb{margin-top:6px;font-size:.95rem;color:#4a4a4a}
.btn{background:#5b7e5f;color:#fff;padding:16px 40px;border-radius:8px;font-size:1.1rem;font-weight:bold;border:none;display:block;margin:40px auto 0;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a6b4e}
.btn:disabled{background:#b5b5b5;cursor:not-allowed}
.hint{text-align:center;color:#8a8a8a;margin-top:12px;font-size:.95rem}
.result{background:#fefcf9;border-top:4px solid #5b7e5f;display:none}
.score{font-size:2.5rem;font-weight:bold;color:#5b7e5f;text-align:center;margin:0 0 12px}
.rtext{font-size:1rem;color:#4a4a4a;text-align:center;line-height:1.6;margin:0}
.retry{background:#8c7b6b}
.retry:hover{background:#756658}
@media (max-width:600px){.wrap{padding:20px 16px 40px}.box{padding:16px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Vědomostní kvíz pro chytré hlavy: většina lidí nezvládne správně ani 8 otázek</h1>
<p class="perex">Korunovační klenoty, latinské úřední obraty, ústava, himálajská hranice, asijské mrakodrapy, wimbledonský trávník, bondovky, poválečné finance, Kolumbovy plavby i rekordní tunel.</p>
<div id="quiz"></div>
<button id="evalBtn" class="btn" disabled>Vyhodnotit</button>
<p id="hint" class="hint">Odpovězte prosím na všechny otázky</p>
<div id="result" class="box result">
<p id="score" class="score"></p>
<p id="rtext" class="rtext"></p>
<button id="retryBtn" class="btn retry">Zkusit znovu</button>
</div>
</div>
<script>
const questions = [
  {q: `Kde jsou dnes trvale uloženy české korunovační klenoty?`, opts: [`na hradě Karlštejn`, `v katedrále svatého Víta`, `ve Starém královském paláci na Pražském hradě`, `v Národním muzeu`], a: 1},
  {q: `Jakého obhájce označuje přívlastek ex offo?`, opts: [`obhájce, kterého si obviněný sám vybral a platí`, `obhájce, kterého obviněnému ustanovil soud`, `obhájce, kterého zdarma poskytuje nezisková poradna`, `obhájce, který zastupuje jen v odvolacím řízení`], a: 1},
  {q: `Kdo je podle Ústavy České republiky vrchním velitelem ozbrojených sil?`, opts: [`prezident republiky`, `předseda vlády`, `ministr obrany`, `náčelník Generálního štábu`], a: 0},
  {q: `Ve kterém městě stojí mrakodrapy Petronas Towers?`, opts: [`v Singapuru`, `v Dubaji`, `v Kuala Lumpuru`, `v Džakartě`], a: 2},
  {q: `Se kterou zemí sdílí Nepál vrchol Mount Everestu?`, opts: [`s Indií`, `s Čínou`, `s Bhútánem`, `s Pákistánem`], a: 1},
  {q: `Který tenista vyhrál mužskou dvouhru ve Wimbledonu nejvíckrát?`, opts: [`Pete Sampras`, `Novak Djokovič`, `Björn Borg`, `Roger Federer`], a: 3},
  {q: `Kde se konala konference, na které byl dohodnut vznik Mezinárodního měnového fondu?`, opts: [`v San Francisku`, `v Casablance`, `v Bretton Woods`, `v Janově`], a: 2},
  {q: `Který herec hrál Jamese Bonda v nejvíce oficiálních bondovkách?`, opts: [`Roger Moore`, `Sean Connery`, `Pierce Brosnan`, `Daniel Craig`], a: 0},
  {q: `Ke kterému dnešnímu státu patří ostrov, na němž Kryštof Kolumbus roku 1492 poprvé přistál v Novém světě?`, opts: [`ke Kubě`, `k Dominikánské republice`, `k Bahamám`, `k Jamajce`], a: 2},
  {q: `Ve které zemi leží nejdelší železniční tunel světa?`, opts: [`v Japonsku`, `v Rakousku`, `v Itálii`, `ve Švýcarsku`], a: 3}
];
const evals = [
  {min: 0, max: 3, label: `0 až 3 body`, text: `K osmičce z titulku vám chybí pět a víc bodů. Kvíz skáče od korunovačních klenotů přes úřední latinu a ústavu až k zámořským objevům a tentokrát vám nesedl ani jeden z oborů. Projděte si správné odpovědi, polovina z nich patří do školní látky, kterou jde snadno oprášit.`},
  {min: 4, max: 6, label: `4 až 6 bodů`, text: `Tady se zastaví velká část řešitelů, a právě s tím titulek počítá. Půlku kvízu máte, na osmičku ale chybějí dva až čtyři zásahy. Ztratili jste je nejspíš u otázek, kde nestačí tušit obor a je potřeba znát konkrétní dohodu, článek zákona nebo rekord.`},
  {min: 7, max: 9, label: `7 až 9 bodů`, text: `Sedm bodů znamená, že jste skončili těsně pod hranicí z titulku, jediná otázka vás dělí od osmičky. Osm nebo devět bodů už je výsledek nad ní: patříte k menšině, na kterou věta z titulku neplatí.`},
  {min: 10, max: 10, label: `10 bodů`, text: `Plný počet. Prošli jste latinou, ústavou, poválečnou ekonomikou i zámořskými objevy bez jediného zaváhání. Laťka osmi bodů pro vás byla nastavená nízko.`}
];
const quiz = document.getElementById(`quiz`);
const evalBtn = document.getElementById(`evalBtn`);
const hint = document.getElementById(`hint`);
const result = document.getElementById(`result`);
let answers = [];
let locked = false;
function render() {
  quiz.innerHTML = ``;
  answers = new Array(questions.length).fill(null);
  locked = false;
  questions.forEach((q, i) => {
    const box = document.createElement(`div`);
    box.className = `box`;
    const p = document.createElement(`p`);
    p.className = `qtext`;
    p.textContent = (i + 1) + `. ` + q.q;
    box.appendChild(p);
    q.opts.forEach((o, j) => {
      const b = document.createElement(`button`);
      b.type = `button`;
      b.className = `opt`;
      b.textContent = `abcd`[j] + `) ` + o;
      b.addEventListener(`click`, () => {
        if (locked) return;
        answers[i] = j;
        box.querySelectorAll(`.opt`).forEach(x => x.classList.remove(`sel`));
        b.classList.add(`sel`);
        update();
      });
      box.appendChild(b);
    });
    const fb = document.createElement(`div`);
    fb.className = `fb`;
    box.appendChild(fb);
    quiz.appendChild(box);
  });
  result.style.display = `none`;
  evalBtn.style.display = `block`;
  update();
}
function update() {
  const all = answers.every(a => a !== null);
  evalBtn.disabled = !all;
  hint.style.display = all ? `none` : `block`;
}
evalBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) return;
  locked = true;
  let score = 0;
  const boxes = quiz.querySelectorAll(`.box`);
  questions.forEach((q, i) => {
    const btns = boxes[i].querySelectorAll(`.opt`);
    btns.forEach(b => { b.disabled = true; b.classList.remove(`sel`); });
    btns[q.a].classList.add(`correct`);
    const fb = boxes[i].querySelector(`.fb`);
    if (answers[i] === q.a) { score++; fb.textContent = `Správně.`; }
    else { btns[answers[i]].classList.add(`wrong`); fb.textContent = `Správná odpověď: ` + `abcd`[q.a] + `) ` + q.opts[q.a]; }
  });
  const e = evals.find(x => score >= x.min && score <= x.max);
  document.getElementById(`score`).textContent = score + ` z ` + questions.length;
  document.getElementById(`rtext`).textContent = e ? e.text : ``;
  evalBtn.style.display = `none`;
  hint.style.display = `none`;
  result.style.display = `block`;
  result.scrollIntoView({behavior: `smooth`});
});
document.getElementById(`retryBtn`).addEventListener(`click`, () => {
  render();
  window.scrollTo({top: 0, behavior: `smooth`});
});
render();
</script>
</body>
</html>
