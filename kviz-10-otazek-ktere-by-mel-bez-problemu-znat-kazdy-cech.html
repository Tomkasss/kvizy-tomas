<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: 10 otázek, které by měl bez problémů znát každý Čech. Popasujete se s nimi?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    margin: 0;
    padding: 40px 20px;
    color: #2c2c2c;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
  .perex { font-size: 1.05rem; color: #4a4a4a; margin: 0 0 32px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .varianta:disabled { cursor: default; }
  #vyhodnotit {
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #vyhodnotit:hover:not(:disabled) { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  #hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.4em; }
  #vysledek {
    background: #fefcf9;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    border-top: 4px solid #5b7e5f;
    padding: 28px;
    margin-top: 40px;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 16px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #znovu {
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #znovu:hover { background: #756658; }
  .skryto { display: none; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 1.5rem; }
    .otazka, #vysledek { padding: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvíz: 10 otázek, které by měl bez problémů znát každý Čech. Popasujete se s nimi?</h1>
  <p class="perex">Deset otázek, u kterých se nikdo nemůže vymlouvat na to, že se v oboru nepohybuje. Namíchali jsme je napříč zeměpisem, sportem, literaturou, kuchyní i přírodou. Zvládnete je bez zaváhání, nebo vás některá zastaví?</p>

  <div id="kviz"></div>

  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <p id="hlaska"></p>

  <div id="vysledek" class="skryto">
    <p id="skore"></p>
    <p id="hodnoceni"></p>
    <button id="znovu">Zkusit znovu</button>
  </div>
</div>

<script>
var otazky = [
  {
    zneni: `1. Ve kterém městě stojí hrad Špilberk?`,
    varianty: [`Olomouc`, `Brno`, `Znojmo`, `Jihlava`],
    spravna: 1
  },
  {
    zneni: `2. Ve kterém městě se odehrává Shakespearova hra Romeo a Julie?`,
    varianty: [`Padova`, `Janov`, `Verona`, `Florencie`],
    spravna: 2
  },
  {
    zneni: `3. Ze které plodiny se v českých cukrovarech vyrábí cukr?`,
    varianty: [`z cukrové třtiny`, `z cukrového čiroku`, `z cukrové řepy`, `z cukrové palmy`],
    spravna: 2
  },
  {
    zneni: `4. Který živočich přenáší malárii?`,
    varianty: [`klíště`, `veš`, `blecha`, `komár`],
    spravna: 3
  },
  {
    zneni: `5. Jaký je tenisový výraz pro stav 40:40 v jedné hře?`,
    varianty: [`shoda`, `mečbol`, `setbol`, `výhoda`],
    spravna: 0
  },
  {
    zneni: `6. Jak se nazývá roztavená hornina, která se nachází pod zemským povrchem?`,
    varianty: [`láva`, `magma`, `čedič`, `žula`],
    spravna: 1
  },
  {
    zneni: `7. Jak se jmenuje nejvyšší hora Slovenska?`,
    varianty: [`Gerlachovský štít`, `Lomnický štít`, `Kriváň`, `Rysy`],
    spravna: 0
  },
  {
    zneni: `8. Kůra kterého stromu je surovinou pro výrobu korkových zátek?`,
    varianty: [`smrku`, `buku`, `javoru`, `dubu`],
    spravna: 3
  },
  {
    zneni: `9. Na kterém světadíle leží Surinam?`,
    varianty: [`Afrika`, `Jižní Amerika`, `Asie`, `Austrálie a Oceánie`],
    spravna: 1
  },
  {
    zneni: `10. Která bylinka tvoří základ klasického zeleného pesta?`,
    varianty: [`bazalka`, `petržel`, `máta`, `tymián`],
    spravna: 0
  }
];

var hodnoceni = [
  { min: 0, max: 3, text: `Tady se něco zadrhlo. Většina otázek stála na věcech, které se člověku čas od času samy připomenou — hrad nad Brnem, komár s malárií, řepa v cukrovaru. Dobrá zpráva je, že přesně takové znalosti se doplňují nejsnáz. Projděte si, které obory vás zastavily, a příště bude výsledek úplně jiný.` },
  { min: 4, max: 6, text: `Půl na půl. Základní přehled máte, ale u pár otázek se vytratil detail — typicky tam, kde nestačí vědět „nějaká hora na Slovensku" nebo „nějaký strom", ale je potřeba trefit konkrétní jméno. Nic dramatického, chybí opravdu jen kousek.` },
  { min: 7, max: 9, text: `Hrady, hory i literaturu jste sebrali bez váhání a zastavily vás nanejvýš tři otázky — nejspíš ta s méně známým jihoamerickým státem, s tenisovým výrazem nebo s bylinkou do pesta. Spolehlivý výsledek, kterému k plnému počtu chyběl kousek.` },
  { min: 10, max: 10, text: `Plný počet, přesně jak titulek sliboval. Sedly vám hrady i hory, sport i suroviny, zeměpis i literatura a ani u nejzrádnější otázky jste nezaváhali. Tenhle kvíz jste zvládli tak, jak se má — bez jediného zaškobrtnutí.` }
];

var odpovedi = [];
var vyhodnoceno = false;
var pismena = [`a) `, `b) `, `c) `, `d) `];

var kvizEl = document.getElementById(`kviz`);
var tlacitkoVyhodnotit = document.getElementById(`vyhodnotit`);
var hlaskaEl = document.getElementById(`hlaska`);
var vysledekEl = document.getElementById(`vysledek`);
var skoreEl = document.getElementById(`skore`);
var hodnoceniEl = document.getElementById(`hodnoceni`);
var tlacitkoZnovu = document.getElementById(`znovu`);

function postavKviz() {
  kvizEl.innerHTML = ``;
  for (var i = 0; i < otazky.length; i++) {
    var box = document.createElement(`div`);
    box.className = `otazka`;

    var zneniEl = document.createElement(`p`);
    zneniEl.className = `zneni`;
    zneniEl.textContent = otazky[i].zneni;
    box.appendChild(zneniEl);

    for (var j = 0; j < otazky[i].varianty.length; j++) {
      var btn = document.createElement(`button`);
      btn.className = `varianta`;
      btn.type = `button`;
      btn.textContent = pismena[j] + otazky[i].varianty[j];
      btn.setAttribute(`data-otazka`, i);
      btn.setAttribute(`data-varianta`, j);
      btn.addEventListener(`click`, klikVarianta);
      box.appendChild(btn);
    }
    kvizEl.appendChild(box);
  }
}

function klikVarianta(e) {
  if (vyhodnoceno) { return; }
  var btn = e.currentTarget;
  var io = parseInt(btn.getAttribute(`data-otazka`), 10);
  var iv = parseInt(btn.getAttribute(`data-varianta`), 10);

  var vsechny = kvizEl.querySelectorAll(`[data-otazka="` + io + `"]`);
  for (var k = 0; k < vsechny.length; k++) {
    vsechny[k].classList.remove(`vybrana`);
  }
  btn.classList.add(`vybrana`);
  odpovedi[io] = iv;
  hlaskaEl.textContent = ``;
  zkontrolujHotovo();
}

function zkontrolujHotovo() {
  var hotovo = true;
  for (var i = 0; i < otazky.length; i++) {
    if (typeof odpovedi[i] !== `number`) { hotovo = false; break; }
  }
  tlacitkoVyhodnotit.disabled = !hotovo;
}

tlacitkoVyhodnotit.addEventListener(`click`, function () {
  if (tlacitkoVyhodnotit.disabled) {
    hlaskaEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  vyhodnoceno = true;
  var body = 0;

  for (var i = 0; i < otazky.length; i++) {
    var vsechny = kvizEl.querySelectorAll(`[data-otazka="` + i + `"]`);
    for (var k = 0; k < vsechny.length; k++) {
      var iv = parseInt(vsechny[k].getAttribute(`data-varianta`), 10);
      vsechny[k].disabled = true;
      vsechny[k].classList.remove(`vybrana`);
      if (iv === otazky[i].spravna) {
        vsechny[k].classList.add(`spravna`);
      } else if (iv === odpovedi[i]) {
        vsechny[k].classList.add(`spatna`);
      }
    }
    if (odpovedi[i] === otazky[i].spravna) { body++; }
  }

  skoreEl.textContent = body + ` z ` + otazky.length;
  for (var h = 0; h < hodnoceni.length; h++) {
    if (body >= hodnoceni[h].min && body <= hodnoceni[h].max) {
      hodnoceniEl.textContent = hodnoceni[h].text;
      break;
    }
  }

  tlacitkoVyhodnotit.disabled = true;
  hlaskaEl.textContent = ``;
  vysledekEl.classList.remove(`skryto`);
  vysledekEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

tlacitkoZnovu.addEventListener(`click`, function () {
  odpovedi = [];
  vyhodnoceno = false;
  vysledekEl.classList.add(`skryto`);
  hlaskaEl.textContent = ``;
  tlacitkoVyhodnotit.disabled = true;
  postavKviz();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

postavKviz();
</script>
</body>
</html>
