<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Život v ČSSR v 10 otázkách: 10 z 10 dají jen praví pamětníci</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; color: #2c2c2c; margin: 0 0 16px; }
  .perex { font-size: 1.1rem; color: #4a4a4a; margin: 0 0 28px; }
  .question {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .option:last-child { margin-bottom: 0; }
  .option:hover { background: #ede8e1; }
  .option.selected {
    background: #dcd3c7;
    border: 1px solid #a89e92;
    font-weight: bold;
  }
  .option.correct {
    background: #d4edda;
    border: 1px solid #7cb987;
    color: #1e5631;
  }
  .option.wrong {
    background: #f8d7da;
    border: 1px solid #d4848a;
    color: #721c24;
  }
  .option:disabled { cursor: default; }
  #submitBtn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease;
  }
  #submitBtn:hover { background: #4a6b4e; }
  #submitBtn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a7f72; margin-top: 12px; font-size: .95rem; min-height: 1.2em; }
  #result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 32px;
  }
  #score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  #verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #retryBtn {
    display: block;
    margin: 28px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease;
  }
  #retryBtn:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Život v ČSSR v 10 otázkách: 10 z 10 dají jen praví pamětníci</h1>
  <p class="perex">Fronta u pokladny, panelákové sídliště a večer celá rodina u obrazovky. Pamatujete si život v socialistickém Československu do detailu? Deset otázek na všední reálie ČSSR napříč obory. Plných deset dají jen praví pamětníci.</p>
  <div id="quiz"></div>
  <button id="submitBtn" disabled>Vyhodnotit</button>
  <div class="hint" id="hint"></div>
  <div id="result" style="display:none;">
    <div id="score"></div>
    <p id="verdict"></p>
    <button id="retryBtn">Zkusit znovu</button>
  </div>
</div>
<script>
const questions = [
  { q: `Jaké typové označení nesl nejrozšířenější kloubový autobus Ikarus, který jezdil v československé MHD?`,
    options: [`Ikarus 260`, `Ikarus 250`, `Ikarus 211`, `Ikarus 280`], correct: 3 },
  { q: `Pod jakou zkratkou fungovaly národní podniky, které v socialistickém Československu provozovaly většinu hospod, restaurací a bufetů?`,
    options: [`RaJ`, `Pramen`, `Masna`, `Zelenina`], correct: 0 },
  { q: `Z jaké plodiny se vyráběl kuchyňský Solamyl, běžný zahušťovací prostředek?`,
    options: [`z kukuřice`, `z brambor`, `z pšenice`, `z rýže`], correct: 1 },
  { q: `Která instituce měla v socialistickém Československu faktický monopol na osobní vkladní knížky obyvatel?`,
    options: [`Živnostenská banka`, `Státní banka československá`, `Státní spořitelna`, `Investiční banka`], correct: 2 },
  { q: `Čím byly pro mladé rodiny charakteristické takzvané novomanželské půjčky?`,
    options: [`za každé narozené dítě se odpustila část dlužné částky`, `byly zcela bezúročné a nemusely se vracet`, `směly se utratit pouze v prodejnách Tuzex`, `mohli je získat jen členové komunistické strany`], correct: 0 },
  { q: `Na silici z které byliny stojí původní receptura tradičních bonbonů Hašlerky?`,
    options: [`na fenyklu`, `na anýzu`, `na heřmánku`, `na kmínu`], correct: 1 },
  { q: `Ve kterém roce začala v Československu platit poštovní směrovací čísla (PSČ)?`,
    options: [`1968`, `1971`, `1973`, `1976`], correct: 2 },
  { q: `Z čeho se vyráběl tuzemský rum, běžná náhrada pravého rumu?`,
    options: [`z destilátu z cukrové třtiny`, `ze zředěného lihu dochuceného rumovou esencí`, `ze zkvašených brambor`, `z bylinného výluhu s cukrem`], correct: 1 },
  { q: `Ve kterém roce se v Československu poprvé losovala sázková hra Sportka?`,
    options: [`1955`, `1956`, `1957`, `1958`], correct: 2 },
  { q: `Co představoval úplně první papírový vystřihovací model otištěný v dětském časopise ABC v roce 1962?`,
    options: [`parník Praha`, `stíhací letoun`, `hrad Karlštejn`, `kosmickou loď Vostok Jurije Gagarina`], correct: 3 }
];

const letters = [`a`, `b`, `c`, `d`];
const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submitBtn`);
const hintEl = document.getElementById(`hint`);
const resultEl = document.getElementById(`result`);
const scoreEl = document.getElementById(`score`);
const verdictEl = document.getElementById(`verdict`);
const retryBtn = document.getElementById(`retryBtn`);

function buildQuiz() {
  quizEl.innerHTML = ``;
  questions.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `question`;
    const qt = document.createElement(`div`);
    qt.className = `q-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `option`;
      btn.textContent = letters[oi] + `) ` + opt;
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll(`.option`)).forEach(b => b.classList.remove(`selected`));
        btn.classList.add(`selected`);
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const allAnswered = answers.every(a => a !== null);
  submitBtn.disabled = !allAnswered;
  if (allAnswered) hintEl.textContent = ``;
}

submitBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.question`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.option`);
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove(`selected`);
      if (oi === questions[qi].correct) {
        btn.classList.add(`correct`);
      } else if (oi === answers[qi]) {
        btn.classList.add(`wrong`);
      }
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  submitBtn.style.display = `none`;
  hintEl.textContent = ``;
  scoreEl.textContent = score + ` z ` + questions.length;
  verdictEl.textContent = getVerdict(score);
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

function getVerdict(score) {
  if (score <= 3) return `Život v ČSSR vám dnes splývá do jedné mlhavé vzpomínky. Éru jste možná zastihli jen okrajem dětství, nebo se vám všední reálie obchodů, značek a služeb z paměti vytratily. Nevadí, stačí zalistovat starými fotkami a leccos se vám samo vybaví.`;
  if (score <= 6) return `Poctivý průměr pamětníka. Nejomílanější kousky socialistického života máte v malíku, u zrádnějších detailů cestování, kuchyně a byrokracie jste ale zaváhali. Přesně tady se pohybuje většina těch, kdo tu dobu na vlastní kůži prožili.`;
  if (score <= 9) return `Výborný výkon. Život v socialistickém Československu znáte napříč obory, od obrazovky přes spíž až po poštu, spořitelnu a sázení. K plnému počtu a titulu pravého pamětníka vám chybělo opravdu jen pár drobností, které si dnes vybaví málokdo.`;
  return `Plný počet a titul pravého pamětníka ČSSR. Všední reálie té doby znáte tak, jako byste je včera prožili, od autobusů z Maďarska přes anýzové pastilky až po první vystřihovánku z áčka. Takový přehled o životě v socialistickém Československu má dnes už málokdo, klobouk dolů.`;
}

retryBtn.addEventListener(`click`, () => {
  locked = false;
  answers.fill(null);
  resultEl.style.display = `none`;
  submitBtn.style.display = `block`;
  submitBtn.disabled = true;
  hintEl.textContent = ``;
  buildQuiz();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

buildQuiz();
</script>
</body>
</html>
