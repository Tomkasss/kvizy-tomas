<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Většina lidí si věří na 9 bodů, ve skutečnosti získá sotva 6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0eb;font-family:Georgia,"Times New Roman",serif;color:#2c2c2c}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:1.9rem;line-height:1.3;margin:0 0 16px}
.perex{font-size:1.1rem;line-height:1.6;color:#4a4a4a;margin:0 0 32px}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-bottom:24px}
.qtext{font-weight:bold;font-size:1.15rem;color:#2c2c2c;margin:0 0 16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;margin:0 0 10px;background:#f7f4f0;border:1px solid #d9d2c9;border-radius:8px;font-size:1rem;color:#3a3a3a;font-family:inherit;cursor:pointer}
.opt:hover{background:#ede8e1}
.opt.sel{background:#dcd3c7;border:1px solid #a89e92;font-weight:bold}
.opt.correct{background:#d4edda;border-color:#7cb987;color:#1e5631}
.opt.wrong{background:#f8d7da;border-color:#d4848a;color:#721c24}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:.98rem}
.fb.ok{color:#1e5631}.fb.bad{color:#721c24}
.btn{background:#5b7e5f;color:#fff;padding:16px 40px;border-radius:8px;font-size:1.1rem;font-weight:bold;border:none;display:block;margin:40px auto 0;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a6b4e}
.btn:disabled{background:#b5b5b5;cursor:not-allowed}
.hint{text-align:center;color:#8a8a8a;margin-top:12px;font-size:.95rem}
#result{display:none;background:#fefcf9;border-top:4px solid #5b7e5f;margin-top:40px}
.score{font-size:2.5rem;font-weight:bold;color:#5b7e5f;text-align:center;margin:0 0 12px}
.rtext{font-size:1rem;color:#4a4a4a;text-align:center;line-height:1.6;margin:0}
#retry{background:#8c7b6b}
#retry:hover{background:#756658}
@media (max-width:600px){.wrap{padding:20px 16px 40px}.box{padding:20px 16px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz: Většina lidí si věří na 9 bodů, ve skutečnosti získá sotva 6</h1>
<p class="perex">Tísňová linka, pohádkový řezbář, oběžná dráha Země, londýnská pevnost i irský hladomor. U všeho má člověk jasno, a přesto se od devíti bodů, na které si věří, snadno sveze k šesti.</p>
<div id="quiz"></div>
<button type="button" class="btn" id="evaluate" disabled>Vyhodnotit</button>
<p class="hint" id="hint">Odpovězte prosím na všechny otázky</p>
<div class="box" id="result">
<p class="score" id="score"></p>
<p class="rtext" id="rtext"></p>
<button type="button" class="btn" id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const QUESTIONS = [
{q:`Kdo se v Česku ozve, když vytočíte tísňovou linku 156?`,o:[`Policie ČR`,`hasiči`,`městská policie`,`zdravotnická záchranná služba`],a:2},
{q:`Kdo vyřezal ze dřeva Pinocchia?`,o:[`Geppetto`,`mistr Třešnička`,`Ohňojed`,`víla s modrými vlasy`],a:0},
{q:`Ve kterém měsíci je Země nejblíže Slunci?`,o:[`v červenci`,`v říjnu`,`v lednu`,`v dubnu`],a:2},
{q:`Které ptáky musí podle pověsti chovat londýnský Tower, aby nepadlo království?`,o:[`labutě`,`krkavce`,`pávy`,`sokoly`],a:1},
{q:`Jak se jmenovala manželka Tomáše G. Masaryka?`,o:[`Alice`,`Charlotta`,`Hana`,`Olga`],a:1},
{q:`Ve kterém městě podle evangelií vyrůstal Ježíš?`,o:[`v Nazaretu`,`v Betlémě`,`v Jeruzalémě`,`v Kafarnaum`],a:0},
{q:`Neúroda které plodiny vyvolala v Irsku v letech 1845–1849 velký hladomor?`,o:[`pšenice`,`tuřínu`,`brambor`,`ovsa`],a:2},
{q:`Ve které zemi vznikla limonáda Fanta?`,o:[`ve Spojených státech`,`ve Velké Británii`,`v Belgii`,`v Německu`],a:3},
{q:`Kde rostla slunečnice divoce ještě předtím, než ji začal pěstovat člověk?`,o:[`na prériích Severní Ameriky`,`v ukrajinských stepích`,`ve Středomoří`,`v peruánských Andách`],a:0},
{q:`Která česká tenistka vyhrála v roce 2021 dvouhru na Roland Garros?`,o:[`Markéta Vondroušová`,`Karolína Muchová`,`Petra Kvitová`,`Barbora Krejčíková`],a:3}
];
const RANGES = [{min:0,max:3,t:`Od devíti bodů, na které si lidé předem věří, jste daleko. Tyhle otázky ale vypadají známěji, než ve skutečnosti jsou, a první nápad u nich často vede jinam. Zkuste to za pár dní znovu, druhé kolo bývá znatelně lepší.`},{min:4,max:6,t:`Přesně tady končí většina lidí, i když na začátku čekali devítku. Rozdíl mezi tím, co si myslíme, že víme, a tím, co opravdu víme, se u vás ukázal v obvyklé míře. Sem patří průměr, o kterém mluví titulek.`},{min:7,max:9,t:`Jste nad průměrem a k devítce, na kterou si lidé věří, máte blízko, nebo jste ji rovnou dali. Na rozdíl od většiny vám sebevědomí i výsledek vyšly skoro stejně.`},{min:10,max:10,t:`Plný počet zvládne jen menšina. U vás se odhad devíti bodů nesplnil, protože jste ho překonali. Ani jedna otázka vás nesvedla k první odpovědi, která se nabízela.`}];
const L = [`a`,`b`,`c`,`d`];
let answers = new Array(QUESTIONS.length).fill(null);
let locked = false;
const quiz = document.getElementById(`quiz`);
const evalBtn = document.getElementById(`evaluate`);
const hint = document.getElementById(`hint`);
const result = document.getElementById(`result`);
function render() {
  quiz.innerHTML = ``;
  QUESTIONS.forEach((q, i) => {
    const box = document.createElement(`div`);
    box.className = `box`;
    const p = document.createElement(`p`);
    p.className = `qtext`;
    p.textContent = (i + 1) + `. ` + q.q;
    box.appendChild(p);
    q.o.forEach((o, j) => {
      const b = document.createElement(`button`);
      b.type = `button`;
      b.className = `opt`;
      b.textContent = L[j] + `) ` + o;
      b.dataset.q = i; b.dataset.o = j;
      b.addEventListener(`click`, () => {
        if (locked) return;
        answers[i] = j;
        box.querySelectorAll(`.opt`).forEach(x => x.classList.remove(`sel`));
        b.classList.add(`sel`);
        update();
      });
      box.appendChild(b);
    });
    const fb = document.createElement(`div`);
    fb.className = `fb`;
    box.appendChild(fb);
    quiz.appendChild(box);
  });
}
function update() {
  const all = answers.every(a => a !== null);
  evalBtn.disabled = !all;
  hint.style.display = all ? `none` : `block`;
}
evalBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) return;
  locked = true;
  let score = 0;
  quiz.querySelectorAll(`.box`).forEach((box, i) => {
    const q = QUESTIONS[i];
    const ok = answers[i] === q.a;
    if (ok) score++;
    box.querySelectorAll(`.opt`).forEach((b, j) => {
      b.disabled = true;
      if (j === q.a) b.classList.add(`correct`);
      else if (j === answers[i]) b.classList.add(`wrong`);
    });
    const fb = box.querySelector(`.fb`);
    fb.className = `fb ` + (ok ? `ok` : `bad`);
    fb.textContent = ok ? `Správně` : `Špatně. Správná odpověď: ` + L[q.a] + `) ` + q.o[q.a];
  });
  document.getElementById(`score`).textContent = score + ` z ` + QUESTIONS.length;
  const r = RANGES.find(x => score >= x.min && score <= x.max);
  document.getElementById(`rtext`).textContent = r ? r.t : ``;
  evalBtn.style.display = `none`;
  hint.style.display = `none`;
  result.style.display = `block`;
  result.scrollIntoView({behavior: `smooth`});
});
document.getElementById(`retry`).addEventListener(`click`, () => {
  answers = new Array(QUESTIONS.length).fill(null);
  locked = false;
  result.style.display = `none`;
  evalBtn.style.display = `block`;
  render(); update();
  window.scrollTo({top: 0, behavior: `smooth`});
});
render(); update();
</script>
</body>
</html>
