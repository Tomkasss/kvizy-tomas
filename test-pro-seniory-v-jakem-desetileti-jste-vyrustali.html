<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test pro seniory: podle 10 odpovědí odhadnu, v jakém desetiletí jste vyrůstali</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
.perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  color: #3a3a3a;
  cursor: pointer;
  transition: background .15s, border .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
#submit {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #a05a4a; margin: 12px 0 0; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#retry {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retry:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
<h1>Test pro seniory: podle 10 odpovědí odhadnu, v jakém desetiletí jste vyrůstali</h1>
<p class="perex">Filmy, písničky, hračky i všední shon dávných let. Odpovězte na deset otázek na reálie dvacátého století a podle toho, kolik starších věcí ještě bezpečně poznáte, odhadnu, ve kterém desetiletí jste vyrůstali.</p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<p class="hint" id="hint"></p>
<div id="result">
  <div id="score"></div>
  <p id="verdict"></p>
  <button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const questions = [
  { q: `1. Které dvě plyšové postavičky provázely děti nedělním televizním pořadem Studio Kamarád?`,
    options: [`Spejbl a Hurvínek`, `Jů a Hele`, `Bob a Bobek`, `Pat a Mat`], correct: 1 },
  { q: `2. Které tvrdé ovocné bonbony v šesti barvách a příchutích uvedly Čokoládovny v roce 1977 jako tuzemskou náhradu za západní cukrovinky?`,
    options: [`Lentilky`, `Hašlerky`, `JOJO`, `Bon Pari`], correct: 3 },
  { q: `3. Který režisér natočil dětskou filmovou klasiku Cesta do pravěku, v níž se čtyři chlapci plaví proti proudu času mezi mamuty a dinosaury?`,
    options: [`Karel Zeman`, `Jiří Trnka`, `Hermína Týrlová`, `Břetislav Pojar`], correct: 0 },
  { q: `4. Který spisovatel napsal pohádku pro úplně první večerní vysílání rozhlasového skřítka Hajaji na počátku 60. let?`,
    options: [`Ondřej Sekora`, `Václav Čtvrtek`, `Josef Lada`, `František Nepil`], correct: 1 },
  { q: `5. Označení rifle, které u nás zlidovělo pro všechny džíny, pochází ze jména oděvní značky. Z které země tato značka pocházela?`,
    options: [`ze Spojených států`, `z Rakouska`, `z Itálie`, `z Francie`], correct: 2 },
  { q: `6. Podle čeho dostala paměťová hra pexeso, uvedená v roce 1965, svůj název?`,
    options: [`podle televizní soutěže Pekelně se soustřeď`, `podle svého vynálezce Petra Sobotky`, `podle nakladatelství, které ji vydalo`, `podle japonské předlohy téže hry`], correct: 0 },
  { q: `7. Která z reforem pražského jara jako jediná přečkala nástup normalizace a zůstala v platnosti až do zániku společného státu?`,
    options: [`obnovení svobody tisku`, `zavedení vícestranického systému`, `federativní uspořádání státu`, `uvolnění soukromého podnikání`], correct: 2 },
  { q: `8. Jak se oficiálně jmenovala povinná škola, kterou v 60. a na počátku 70. let vychodila naprostá většina dětí, než ji vystřídala osmiletá základní škola?`,
    options: [`Národní škola`, `Jedenáctiletá střední škola`, `Střední všeobecně vzdělávací škola`, `Základní devítiletá škola`], correct: 3 },
  { q: `9. Který skladatel psal hudbu a písničky pro Osvobozené divadlo Jiřího Voskovce a Jana Wericha?`,
    options: [`Karel Hašler`, `Jaroslav Ježek`, `Jaromír Vejvoda`, `Rudolf Antonín Dvorský`], correct: 1 },
  { q: `10. Který československý útočník se stal s pěti góly nejlepším střelcem mistrovství světa ve fotbale roku 1934?`,
    options: [`Oldřich Nejedlý`, `Antonín Puč`, `Jiří Sobotka`, `František Svoboda`], correct: 0 }
];

const evaluation = [
  { min: 0, max: 3, text: `Nejstarší reálie vám dnes splývají a poznáváte spíš to, co doznívalo ještě dlouho. Podle skóre jste vyrůstali nejspíš v 70. a 80. letech. Tvrdé retro předchozích desetiletí jste zastihli už jen z vyprávění starších, a to je v pořádku, každá generace má svoje.` },
  { min: 4, max: 6, text: `Poctivý střed pamětníka. Polovinu věcí máte živě v paměti, u těch dávnějších jste zaváhali. Tohle skóre svádí vaše dětství a mládí zhruba na 60. a 70. léta. Všední socialistický shon jste prožili naplno, na úplně nejstarší kousky už ale bylo trochu brzy.` },
  { min: 7, max: 9, text: `Výborný výkon. Poznáváte i méně omílané věci, které mladším nic neříkají, od skladatelů a fotbalistů první republiky až po hračky a školu dávných let. Podle přehledu jste dětství a mládí prožili nejspíš v 50. a 60. letech, kdy tyhle reálie byly všude kolem vás.` },
  { min: 10, max: 10, text: `Plný počet, který dá jen menšina. Trefili jste i to nejstarší, včetně prvorepublikové kopané a hudby z Osvobozeného divadla. Takový přehled prozrazuje, že jste vyrůstali už ve 40. a 50. letech a nejstarší reálie dvacátého století máte pod kůží. Klobouk dolů.` }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const submitBtn = document.getElementById('submit');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retry');

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('p');
    qt.className = 'q-text';
    qt.textContent = item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll('.opt')).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  if (all) hintEl.textContent = '';
}

submitBtn.addEventListener('click', () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.q');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.opt');
    opts.forEach((b, oi) => {
      b.disabled = true;
      b.classList.remove('selected');
      if (oi === questions[qi].correct) b.classList.add('correct');
      else if (oi === answers[qi]) b.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  scoreEl.textContent = score + ' z ' + questions.length;
  const ev = evaluation.find(e => score >= e.min && score <= e.max);
  verdictEl.textContent = ev ? ev.text : '';
  submitBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

retryBtn.addEventListener('click', () => {
  locked = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  render();
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  resultEl.style.display = 'none';
  hintEl.textContent = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
