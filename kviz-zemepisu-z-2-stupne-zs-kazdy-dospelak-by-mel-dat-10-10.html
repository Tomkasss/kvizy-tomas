<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz zeměpisu z 2. stupně ZŠ. Každý dospělák by měl dát 10/10, ale často zaváhají</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  max-width: 720px;
  margin: 0 auto;
  background: #f5f0eb;
  color: #2c2c2c;
  padding: 24px 16px 60px;
  line-height: 1.55;
}
h1 { font-size: 1.7rem; line-height: 1.25; color: #2c2c2c; margin: 8px 0 18px; }
.perex { font-size: 1.1rem; color: #4a4a4a; margin-bottom: 28px; }
.question-box {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 12px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s;
}
.option:last-child { margin-bottom: 0; }
.option:hover { background: #ede8e1; }
.option.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.option.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.option.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.option:disabled { cursor: default; }
#evaluate, #retry {
  display: block;
  margin: 40px auto 0;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  color: #fff;
  cursor: pointer;
}
#evaluate { background: #5b7e5f; }
#evaluate:hover { background: #4a6b4e; }
#evaluate:disabled { background: #b5b5b5; cursor: not-allowed; }
#retry { background: #8c7b6b; }
#retry:hover { background: #756658; }
.hint { text-align: center; color: #8a7f72; margin-top: 12px; font-style: italic; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
</style>
</head>
<body>
<h1>Kvíz zeměpisu z 2. stupně ZŠ. Každý dospělák by měl dát 10/10, ale často zaváhají</h1>
<div class="perex">Ostrovy, moře, řeky, pohoří i vlajky ze základní školy. Otázky vypadají snadně, jenže nejlákavější odpověď bývá past. Deset otázek, u kterých i sečtělí dospělí občas šlápnou vedle. Dáte všech deset?</div>

<div id="quiz"></div>

<button id="evaluate" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>

<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>

<script>
const questions = [
  { q: `Který z těchto států nesousedí s Českou republikou?`,
    options: [`Maďarsko`, `Polsko`, `Rakousko`, `Slovensko`], correct: 0 },
  { q: `Kterému státu patří ostrov Kréta?`,
    options: [`Turecko`, `Řecko`, `Kypr`, `Itálie`], correct: 1 },
  { q: `Ve které zemi pramení řeka Amazonka?`,
    options: [`Kolumbie`, `Brazílie`, `Peru`, `Ekvádor`], correct: 2 },
  { q: `Které pohoří leží na hranici Slovenska a Polska?`,
    options: [`Krkonoše`, `Šumava`, `Nízké Tatry`, `Vysoké Tatry`], correct: 3 },
  { q: `Který průliv protéká Istanbulem a odděluje jeho evropskou část od asijské?`,
    options: [`Bosporský průliv`, `Dardanely`, `Gibraltarský průliv`, `Beringův průliv`], correct: 0 },
  { q: `Které moře leží mezi Řeckem a Tureckem?`,
    options: [`Egejské`, `Jónské`, `Tyrhénské`, `Černé`], correct: 0 },
  { q: `Na vlajce které severské země je modrý kříž na bílém poli?`,
    options: [`Švédsko`, `Finsko`, `Norsko`, `Dánsko`], correct: 1 },
  { q: `Který z oceánů je rozlohou nejmenší?`,
    options: [`Indický`, `Atlantský`, `Severní ledový`, `Jižní`], correct: 2 },
  { q: `Na kterém světadílu leží ostrov Grónsko?`,
    options: [`Evropa`, `Asie`, `Antarktida`, `Severní Amerika`], correct: 3 },
  { q: `Který stát je zcela obklopen územím Jihoafrické republiky?`,
    options: [`Svazijsko`, `Botswana`, `Lesotho`, `Namibie`], correct: 2 }
];

const answers = new Array(questions.length).fill(null);
let locked = false;

const quizEl = document.getElementById('quiz');
const evaluateBtn = document.getElementById('evaluate');
const hintEl = document.getElementById('hint');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const verdictEl = document.getElementById('verdict');
const retryBtn = document.getElementById('retry');
const letters = ['a', 'b', 'c', 'd'];

function render() {
  quizEl.innerHTML = '';
  questions.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'question-box';
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = (qi + 1) + '. ' + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = letters[oi] + ') ' + opt;
      if (answers[qi] === oi) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        if (locked) return;
        answers[qi] = oi;
        render();
        updateEvaluate();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateEvaluate() {
  const allAnswered = answers.every(a => a !== null);
  evaluateBtn.disabled = !allAnswered;
}

evaluateBtn.addEventListener('click', () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = 'Odpovězte prosím na všechny otázky';
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll('.question-box');
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll('.option');
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      btn.classList.remove('selected');
      if (oi === questions[qi].correct) btn.classList.add('correct');
      else if (answers[qi] === oi) btn.classList.add('wrong');
    });
    if (answers[qi] === questions[qi].correct) score++;
  });
  showResult(score);
});

function showResult(score) {
  scoreEl.textContent = score + ' z 10';
  let text = '';
  if (score <= 3) text = 'Mapa světa se vám zatím trochu slévá dohromady. Ostrovy, moře i vlajky se pletou a lákavá odpověď vás pokaždé stáhla špatným směrem. Nevadí, projděte si správná řešení a příště se odrazíte výš.';
  else if (score <= 6) text = 'Slušný základ ze školy ve vás zůstal. Sousední státy i známé ostrovy zvládáte, ale u záludnějších otázek, kde vlajka nebo světadíl svádí k rychlé volbě, jistota kolísá. Do plného počtu chybí jen kousek.';
  else if (score <= 9) text = 'Výborná orientace. Nachytaly vás nanejvýš ty nejzrádnější pasti, kde se ostrov přiřazuje k jinému státu, než člověk čeká, nebo kde podobná vlajka svádí k záměně. Deset z deseti bylo na dosah.';
  else text = 'Naprostá špička. Od sousedních států přes ostrovy, moře a průlivy až po vlajky a světadíly jste nezaváhali ani u jedné pasti. Plných deset z deseti dá málokdo a vy jste to zvládli.';
  verdictEl.textContent = text;
  resultEl.style.display = 'block';
  evaluateBtn.style.display = 'none';
  hintEl.textContent = '';
  resultEl.scrollIntoView({ behavior: 'smooth' });
}

retryBtn.addEventListener('click', () => {
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  locked = false;
  resultEl.style.display = 'none';
  evaluateBtn.style.display = 'block';
  render();
  updateEvaluate();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
updateEvaluate();
</script>
</body>
</html>
