<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz z českých slov: Kdo udělá víc než 4 chyby, nerozumí vlastnímu jazyku</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0eb;font-family:Georgia,"Times New Roman",serif;color:#2c2c2c}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:1.8rem;line-height:1.3;margin:0 0 16px}
.perex{font-size:1.05rem;line-height:1.6;color:#4a4a4a;margin:0 0 28px}
.box{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:28px;margin-bottom:24px}
.qt{font-weight:bold;font-size:1.15rem;color:#2c2c2c;margin:0 0 16px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;background:#f7f4f0;border:1px solid #d9d2c9;border-radius:8px;font-size:1rem;color:#3a3a3a;font-family:inherit;margin-top:10px;cursor:pointer;line-height:1.4}
.opt:hover{background:#ede8e1}
.opt.sel{background:#dcd3c7;border:1px solid #a89e92;font-weight:bold}
.opt.ok{background:#d4edda;border-color:#7cb987;color:#1e5631}
.opt.bad{background:#f8d7da;border-color:#d4848a;color:#721c24}
.locked .opt{cursor:default}
.locked .opt:hover{}
.fb{margin-top:14px;font-size:.98rem;line-height:1.5}
.fb.ok{color:#1e5631} .fb.bad{color:#721c24}
.btn{background:#5b7e5f;color:#fff;padding:16px 40px;border-radius:8px;font-size:1.1rem;font-weight:bold;border:none;display:block;margin:40px auto 0;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a6b4e}
.btn:disabled{background:#b5b5b5;cursor:not-allowed}
.hint{text-align:center;color:#8a8a8a;margin-top:12px;font-size:.95rem}
.result{background:#fefcf9;border-top:4px solid #5b7e5f;margin-top:40px;display:none}
.score{font-size:2.5rem;font-weight:bold;color:#5b7e5f;text-align:center;margin:0 0 12px}
.rtext{font-size:1rem;color:#4a4a4a;text-align:center;line-height:1.6;margin:0}
.again{background:#8c7b6b} .again:hover{background:#756658}
@media (max-width:600px){.wrap{padding:20px 16px 40px}.box{padding:20px 16px}h1{font-size:1.45rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Kvíz z českých slov: Kdo udělá víc než 4 chyby, nerozumí vlastnímu jazyku</h1>
<p class="perex">Mluvíte česky celý život, ale rozumíte všemu, co čtete? Deset domácích slov z knih, novin i staré kuchařky. Čtyři chyby se dají odpustit, pátá už znamená, že vám čeština v něčem utíká.</p>
<div id="quiz"></div>
<button class="btn" id="eval" disabled>Vyhodnotit</button>
<p class="hint" id="hint">Odpovězte prosím na všechny otázky</p>
<div class="box result" id="result">
<p class="score" id="score"></p>
<p class="rtext" id="rtext"></p>
<button class="btn again" id="again">Zkusit znovu</button>
</div>
</div>
<script>
const Q = [
  {q: `Jaké počasí přináší „metelice"?`, o: [`mrznoucí déšť, po kterém zůstane náledí`, `hustou chumelenici zvířenou prudkým větrem`, `štiplavý mráz za jasné noci bez mráčku`, `jinovatku, která ráno ojíní stromy a ploty`], a: 1},
  {q: `Co dělá ten, kdo „peláší"?`, o: [`loudá se jako šnek a cestou se rozhlíží`, `válí se v pelechu a lenoší`, `hádá se a nadává jako na trhu`, `utíká, co mu nohy stačí`], a: 3},
  {q: `Jak se k druhému chová ten, kdo ho „chlácholí"?`, o: [`konejší ho a uklidňuje`, `dobírá si ho a popichuje`, `pobízí ho a popohání`, `napomíná ho a kárá`], a: 0},
  {q: `V jakém rozpoložení je ten, kdo se „durdí"?`, o: [`bojí se a nervózně přešlapuje`, `stýská se mu po domově`, `je dotčený a mírně se zlobí`, `stydí se a červená se`], a: 2},
  {q: `Jaký je člověk, o kterém se řekne, že je „přičinlivý"?`, o: [`svárlivý, snadno vyvolá hádku`, `pilný a snaživý v práci`, `dotěrný, všude se vnucuje`, `zvídavý, pátrá po příčinách věcí`], a: 1},
  {q: `Co bývalo ve starých staveních „přístěnkem"?`, o: [`lavice přidělaná podél stěny světnice`, `skříňka zavěšená vysoko na stěně`, `nízká zídka mezi dvorem a zahradou`, `malá komůrka vedle větší místnosti`], a: 3},
  {q: `Co je to „lomoz"?`, o: [`bolestivé lámání v kloubech`, `neprůchodná spleť trnitého křoví`, `silný hluk a směsice zvuků`, `opuštěný, zarostlý kamenolom`], a: 2},
  {q: `K čemu se v kuchyni používá „zápražka"?`, o: [`k zahuštění polévky nebo omáčky`, `k potření vánočky před pečením`, `ke kypření těsta místo droždí`, `k přípravě levné náhražky kávy`], a: 0},
  {q: `Kde se ocitne ten, kdo vstoupí do „mlází"?`, o: [`v bažině zarostlé rákosím`, `v kupkách sena na posečené louce`, `na mlatě ve stodole mezi snopy`, `v hustém porostu dorůstajících stromků`], a: 3},
  {q: `Co znamená, když někdo utrácí peníze „zbůhdarma"?`, o: [`dává je na dobročinné účely`, `utrácí cizí peníze místo svých`, `vydává je zbytečně a bez užitku`, `utrácí je potají před rodinou`], a: 2}
];
const E = [
  {min: 0, max: 3, t: `Tohle nebyla smůla. Žádné z těch slov není vzácnost z muzea, všechna stojí v obyčejných knihách a novinách a vy jste kolem nich prošli bez povšimnutí. Pomůže jediné: víc číst a u slova, které vás zarazí, se nespokojit s dojmem.`},
  {min: 4, max: 6, t: `Tady záleží na každém bodu. Šest správně jsou přesně čtyři chyby, takže laťku z titulku jste ještě udrželi, i když jen o kousek. Čtyři nebo pět bodů ale znamená pět a více chyb, a to už podle titulku vlastnímu jazyku nerozumíte tak, jak byste měli.`},
  {min: 7, max: 9, t: `Čtete pozorně a slova si nepamatujete jen podle toho, jak znějí. Jedna až tři chyby jsou daň za slova, která z běžné řeči pomalu mizí, s porozuměním vlastnímu jazyku jste na tom ale dobře.`},
  {min: 10, max: 10, t: `Čistý stůl. Rozumíte i slovům, která většina lidí jen odhaduje, a česká kniha vás nezaskočí ani na straně, kde jiní sahají po slovníku.`}
];
const quiz = document.getElementById(`quiz`);
const evalBtn = document.getElementById(`eval`);
const hint = document.getElementById(`hint`);
const result = document.getElementById(`result`);
let ans = [], locked = false;
function render() {
  quiz.innerHTML = ``;
  ans = Q.map(() => null); locked = false;
  quiz.classList.remove(`locked`);
  Q.forEach((q, i) => {
    const box = document.createElement(`div`); box.className = `box`;
    const t = document.createElement(`p`); t.className = `qt`; t.textContent = (i + 1) + `. ` + q.q; box.appendChild(t);
    q.o.forEach((o, j) => {
      const b = document.createElement(`button`); b.type = `button`; b.className = `opt`;
      b.textContent = `abcd`[j] + `) ` + o;
      b.addEventListener(`click`, () => {
        if (locked) return;
        ans[i] = j;
        box.querySelectorAll(`.opt`).forEach(x => x.classList.remove(`sel`));
        b.classList.add(`sel`);
        update();
      });
      box.appendChild(b);
    });
    quiz.appendChild(box);
  });
  result.style.display = `none`;
  evalBtn.style.display = `block`;
  update();
}
function update() {
  const done = ans.every(a => a !== null);
  evalBtn.disabled = !done;
  hint.style.display = done ? `none` : `block`;
}
evalBtn.addEventListener(`click`, () => {
  if (ans.some(a => a === null)) return;
  locked = true; quiz.classList.add(`locked`);
  let sc = 0;
  quiz.querySelectorAll(`.box`).forEach((box, i) => {
    const opts = box.querySelectorAll(`.opt`);
    const ok = ans[i] === Q[i].a;
    if (ok) sc++;
    opts.forEach(x => x.classList.remove(`sel`));
    opts[Q[i].a].classList.add(`ok`);
    if (!ok) opts[ans[i]].classList.add(`bad`);
    const fb = document.createElement(`p`);
    fb.className = `fb ` + (ok ? `ok` : `bad`);
    fb.textContent = ok ? `Správně.` : `Špatně. Správná odpověď: ` + `abcd`[Q[i].a] + `) ` + Q[i].o[Q[i].a];
    box.appendChild(fb);
  });
  document.getElementById(`score`).textContent = sc + ` z ` + Q.length;
  const e = E.find(x => sc >= x.min && sc <= x.max);
  document.getElementById(`rtext`).textContent = e ? e.t : ``;
  evalBtn.style.display = `none`; hint.style.display = `none`;
  result.style.display = `block`;
  result.scrollIntoView({behavior: `smooth`, block: `start`});
});
document.getElementById(`again`).addEventListener(`click`, () => { render(); window.scrollTo({top: 0, behavior: `smooth`}); });
render();
</script>
</body>
</html>
