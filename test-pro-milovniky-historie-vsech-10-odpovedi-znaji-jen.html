<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test pro milovníky historie: všech 10 odpovědí znají jen opravdoví znalci</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  margin: 0;
  padding: 40px 20px;
  color: #2c2c2c;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
.perex { font-size: 1.05rem; color: #4a4a4a; margin: 0 0 32px; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 18px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  cursor: pointer;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.sel { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
#submit {
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
#warn { text-align: center; color: #721c24; margin-top: 14px; font-size: .95rem; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 24px;
  border-top: 4px solid #5b7e5f;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
#again {
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  display: block;
  margin: 40px auto 0;
  font-family: inherit;
  cursor: pointer;
}
#again:hover { background: #756658; }
@media (max-width: 600px) {
  body { padding: 16px; }
  h1 { font-size: 1.5rem; }
  .q { padding: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Test pro milovníky historie: všech 10 odpovědí znají jen opravdoví znalci</h1>
<p class="perex">Deset otázek napříč staletími: starověk, středověk, novověk i obě světové války, dějiny vědy, mořeplavby a letectví. U každé čtyři možnosti a jediná správná. Kdo zvládne všech deset, patří mezi opravdové znalce.</p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<p id="warn"></p>
<div id="result">
  <p id="score"></p>
  <p id="verdict"></p>
  <button id="again">Zkusit znovu</button>
</div>
</div>
<script>
var QUESTIONS = [
  { q: `Který egyptský panovník dal vytesat skalní chrámy v Abú Simbelu?`,
    o: [`Achnaton`, `Tutanchamon`, `Ramesse II.`, `Thutmose III.`], a: 2 },
  { q: `Kdo založil pražský špitál, z něhož vznikl rytířský řád křižovníků s červenou hvězdou?`,
    o: [`Anežka Česká`, `Zdislava z Lemberka`, `Eliška Přemyslovna`, `Kunhuta Uherská`], a: 0 },
  { q: `Který mořeplavec jako první Evropan obeplul jižní cíp Afriky?`,
    o: [`Vasco da Gama`, `Pedro Álvares Cabral`, `Fernão de Magalhães`, `Bartolomeu Dias`], a: 3 },
  { q: `Který astronom je pohřben v pražském Týnském chrámu?`,
    o: [`Mikuláš Koperník`, `Tycho Brahe`, `Johannes Kepler`, `Galileo Galilei`], a: 1 },
  { q: `Kdo vydal toleranční patent?`,
    o: [`Karel VI.`, `Marie Terezie`, `Josef II.`, `Leopold II.`], a: 2 },
  { q: `Kdo je autorem Dějin národu českého v Čechách a v Moravě?`,
    o: [`František Palacký`, `Josef Dobrovský`, `Václav Vladivoj Tomek`, `Josef Jungmann`], a: 0 },
  { q: `Kdo jako první přeletěl letadlem Lamanšský průliv?`,
    o: [`Hubert Latham`, `Alberto Santos-Dumont`, `Charles Lindbergh`, `Louis Blériot`], a: 3 },
  { q: `Ve které bitvě byly poprvé v dějinách nasazeny tanky?`,
    o: [`u Verdunu`, `na Sommě`, `u Cambrai`, `na Marně`], a: 1 },
  { q: `Které město bylo centrem Slovenského národního povstání?`,
    o: [`Žilina`, `Martin`, `Banská Bystrica`, `Zvolen`], a: 2 },
  { q: `Který stát vystoupil v roce 1966 z vojenských struktur NATO, ale členem aliance zůstal?`,
    o: [`Itálie`, `Francie`, `Norsko`, `Nizozemsko`], a: 1 }
];

var VERDICTS = [
  { max: 3, t: `Historie vás nejspíš baví spíš jako vyprávění než jako soubor jmen a souvislostí. Většinu otázek jste znali z doslechu, ale u čtyř možností se doslech neobhájí. Dobrá zpráva je, že právě takové oblasti, jaké jste tu minuli, se dohánějí nejrychleji.` },
  { max: 6, t: `Pevný školní základ máte a v hrubých obrysech se v dějinách neztratíte. Zaváhali jste tam, kde se přestává jen vzpomínat a začíná rozlišovat mezi dvěma podobnými jmény nebo bitvami. Milovník historie z vás rozhodně je, znalec ještě ne.` },
  { max: 9, t: `Tohle už je výkon člověka, který o historii opravdu čte, a ne jen občas. Prošli jste i položkami, na kterých většina lidí sáhne po té těsně vedlejší variantě. K plnému počtu vám chyběl kousek, ale nad běžným čtenářem dějepisné literatury máte znatelný náskok.` },
  { max: 10, t: `Všech deset, a to je přesně ta hranice, kterou slibuje název. Zvládli jste starověký Egypt, český středověk, portugalské objevné plavby, hvězdáře raného novověku, osvícenské patenty, obrozeneckou historiografii, počátky letectví, obě světové války i poválečné uspořádání Evropy. Titul opravdového znalce máte právem.` }
];

var LETTERS = [`a`, `b`, `c`, `d`];
var answers = new Array(QUESTIONS.length).fill(null);
var locked = false;

var quizEl = document.getElementById(`quiz`);
var submitEl = document.getElementById(`submit`);
var warnEl = document.getElementById(`warn`);
var resultEl = document.getElementById(`result`);
var scoreEl = document.getElementById(`score`);
var verdictEl = document.getElementById(`verdict`);
var againEl = document.getElementById(`again`);

function build() {
  quizEl.innerHTML = ``;
  QUESTIONS.forEach(function (item, qi) {
    var box = document.createElement(`div`);
    box.className = `q`;

    var title = document.createElement(`p`);
    title.className = `q-text`;
    title.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(title);

    item.o.forEach(function (opt, oi) {
      var btn = document.createElement(`button`);
      btn.type = `button`;
      btn.className = `opt`;
      btn.textContent = LETTERS[oi] + `) ` + opt;
      btn.addEventListener(`click`, function () {
        if (locked) { return; }
        answers[qi] = oi;
        var siblings = box.querySelectorAll(`.opt`);
        for (var s = 0; s < siblings.length; s++) {
          siblings[s].classList.remove(`sel`);
        }
        btn.classList.add(`sel`);
        warnEl.textContent = ``;
        refresh();
      });
      box.appendChild(btn);
    });

    quizEl.appendChild(box);
  });
}

function refresh() {
  var done = answers.every(function (v) { return v !== null; });
  submitEl.disabled = !done;
}

submitEl.addEventListener(`click`, function () {
  if (submitEl.disabled) {
    warnEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  var score = 0;
  var boxes = quizEl.querySelectorAll(`.q`);
  QUESTIONS.forEach(function (item, qi) {
    var opts = boxes[qi].querySelectorAll(`.opt`);
    for (var oi = 0; oi < opts.length; oi++) {
      opts[oi].disabled = true;
      opts[oi].classList.remove(`sel`);
      if (oi === item.a) {
        opts[oi].classList.add(`correct`);
      } else if (oi === answers[qi]) {
        opts[oi].classList.add(`wrong`);
      }
    }
    if (answers[qi] === item.a) { score++; }
  });

  scoreEl.textContent = score + ` z ` + QUESTIONS.length;
  var text = ``;
  for (var v = 0; v < VERDICTS.length; v++) {
    if (score <= VERDICTS[v].max) { text = VERDICTS[v].t; break; }
  }
  verdictEl.textContent = text;
  submitEl.disabled = true;
  warnEl.textContent = ``;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth`, block: `start` });
});

againEl.addEventListener(`click`, function () {
  locked = false;
  answers = new Array(QUESTIONS.length).fill(null);
  resultEl.style.display = `none`;
  warnEl.textContent = ``;
  build();
  refresh();
  window.scrollTo({ top: 0, behavior: `smooth` });
});

build();
refresh();
</script>
</body>
</html>
