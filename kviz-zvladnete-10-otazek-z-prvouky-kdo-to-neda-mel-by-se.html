<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: zvládnete 10 otázek z prvouky? Kdo to nedá, měl by se hned vrátit na ZŠ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5f0eb;
    font-family: Georgia, "Times New Roman", serif;
    color: #2c2c2c;
    line-height: 1.5;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 1.9rem;
    line-height: 1.25;
    margin: 0 0 16px;
    color: #2c2c2c;
  }
  .perex {
    font-size: 1.05rem;
    color: #4a4a4a;
    margin: 0 0 28px;
  }
  .box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text {
    font-weight: bold;
    font-size: 1.15rem;
    color: #2c2c2c;
    margin: 0 0 16px;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin: 0 0 10px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    color: #3a3a3a;
    cursor: pointer;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected {
    background: #dcd3c7;
    border: 1px solid #a89e92;
    font-weight: bold;
  }
  .opt.correct {
    background: #d4edda;
    border: 1px solid #7cb987;
    color: #1e5631;
  }
  .opt.wrong {
    background: #f8d7da;
    border: 1px solid #d4848a;
    color: #721c24;
  }
  .locked .opt { cursor: default; }
  .locked .opt:hover { background: #f7f4f0; }
  .locked .opt.selected:hover { background: #dcd3c7; }
  .locked .opt.correct:hover { background: #d4edda; }
  .locked .opt.wrong:hover { background: #f8d7da; }
  .feedback {
    margin-top: 14px;
    font-size: 0.98rem;
    display: none;
  }
  .feedback.ok { color: #1e5631; display: block; }
  .feedback.bad { color: #721c24; display: block; }
  .btn {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover { background: #4a6b4e; }
  .btn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint {
    text-align: center;
    color: #721c24;
    margin-top: 12px;
    font-size: 0.95rem;
  }
  .result {
    display: none;
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    margin-top: 40px;
  }
  .score {
    font-size: 2.5rem;
    font-weight: bold;
    color: #5b7e5f;
    text-align: center;
    margin: 0 0 12px;
  }
  .verdict {
    font-size: 1rem;
    color: #4a4a4a;
    text-align: center;
    margin: 0;
  }
  .btn.retry { background: #8c7b6b; margin-top: 28px; }
  .btn.retry:hover { background: #756658; }
  @media (max-width: 600px) {
    .wrap { padding: 20px 16px 40px; }
    .box { padding: 16px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="perex" id="perex"></p>
  <div id="questions"></div>
  <button type="button" class="btn" id="evaluate" disabled>Vyhodnotit</button>
  <p class="hint" id="hint">Odpovězte prosím na všechny otázky</p>
  <div class="box result" id="result">
    <p class="score" id="score"></p>
    <p class="verdict" id="verdict"></p>
    <button type="button" class="btn retry" id="retry">Zkusit znovu</button>
  </div>
</div>
<script>
(function () {
  const TITLE = `Kvíz: zvládnete 10 otázek z prvouky? Kdo to nedá, měl by se hned vrátit na ZŠ`;
  const PEREX = `Mapa, kraje, dopravní výchova, stromy, zvířata, ptáci i státní symboly. Učivo prvního stupně, které jste kdysi sypali z rukávu, dnes po letech zaskočí nejednoho dospělého. Kolik vám ho zůstalo?`;

  const QUESTIONS = [
    { q: `1. Kterou barvou se na zeměpisné mapě vybarvují nížiny?`,
      options: [`a) žlutou`, `b) zelenou`, `c) světle hnědou`, `d) oranžovou`], correct: 1 },
    { q: `2. Na svátek které světice se podle tradice řežou třešňové větvičky, aby do Vánoc rozkvetly?`,
      options: [`a) Kateřiny`, `b) Lucie`, `c) Barbory`, `d) Ludmily`], correct: 2 },
    { q: `3. Mládě kterého z těchto zvířat se rodí osrstěné a hned vidí?`,
      options: [`a) veverky obecné`, `b) lišky obecné`, `c) králíka divokého`, `d) zajíce polního`], correct: 3 },
    { q: `4. Který z těchto keřů patří mezi jehličnany?`,
      options: [`a) vřes`, `b) zimostráz`, `c) jalovec`, `d) brusnice`], correct: 2 },
    { q: `5. Která z těchto dřevin kvete dřív, než jí narostou listy?`,
      options: [`a) lípa`, `b) líska`, `c) jeřáb`, `d) bez černý`], correct: 1 },
    { q: `6. Od kolika let smí cyklista v Česku jezdit bez přilby?`,
      options: [`a) od 12 let`, `b) od 15 let`, `c) od 16 let`, `d) od 18 let`], correct: 3 },
    { q: `7. Co z toho patří mezi státní symboly České republiky?`,
      options: [`a) svatováclavská koruna`, `b) lipová ratolest`, `c) pečeť`, `d) Pražský hrad`], correct: 2 },
    { q: `8. Ve kterém kraji leží Sněžka?`,
      options: [`a) v Královéhradeckém`, `b) v Libereckém`, `c) v Pardubickém`, `d) v Ústeckém`], correct: 0 },
    { q: `9. Který hmyz má jen jeden pár křídel?`,
      options: [`a) moucha domácí`, `b) včela medonosná`, `c) bělásek zelný`, `d) vážka`], correct: 0 },
    { q: `10. Který pták k nám přilétá jen na zimu?`,
      options: [`a) dudek`, `b) brkoslav`, `c) žluva`, `d) strakapoud velký`], correct: 1 }
  ];

  const VERDICTS = [
    { min: 0, max: 3, text: `Tady bude potřeba nová aktovka. Ze školy vám zůstala hlavně vzpomínka na svačiny. Dobrá zpráva je, že prvouka se dá dohnat za jedno odpoledne u dětských učebnic.` },
    { min: 4, max: 6, text: `Na vysvědčení by stála spíš trojka. Základy máte, ale drobnosti, které se ve třetí třídě pečlivě zapisovaly do sešitu, se vám mezitím vytratily. Na pár opakovacích hodin byste si do lavice sednout měli.` },
    { min: 7, max: 9, text: `Zpátky na základku nemusíte, paní učitelka by vás pustila dál s pochvalou. Pár otázek vás zaskočilo, ale základy z prvního stupně držíte pevně.` },
    { min: 10, max: 10, text: `Čistá jednička. Prvouku máte v hlavě, jako byste z ní psali písemku minulý týden. Klidně byste mohli zaskočit za třídní učitelku.` }
  ];

  const answers = new Array(QUESTIONS.length).fill(null);
  let locked = false;

  const qWrap = document.getElementById(`questions`);
  const evalBtn = document.getElementById(`evaluate`);
  const hint = document.getElementById(`hint`);
  const result = document.getElementById(`result`);
  const scoreEl = document.getElementById(`score`);
  const verdictEl = document.getElementById(`verdict`);
  const retryBtn = document.getElementById(`retry`);

  document.getElementById(`title`).textContent = TITLE;
  document.getElementById(`perex`).textContent = PEREX;

  function render() {
    qWrap.innerHTML = ``;
    QUESTIONS.forEach(function (item, qi) {
      const box = document.createElement(`div`);
      box.className = `box`;
      const p = document.createElement(`p`);
      p.className = `q-text`;
      p.textContent = item.q;
      box.appendChild(p);
      item.options.forEach(function (opt, oi) {
        const b = document.createElement(`button`);
        b.type = `button`;
        b.className = `opt`;
        b.textContent = opt;
        b.dataset.q = String(qi);
        b.dataset.o = String(oi);
        b.addEventListener(`click`, onPick);
        box.appendChild(b);
      });
      const fb = document.createElement(`div`);
      fb.className = `feedback`;
      box.appendChild(fb);
      qWrap.appendChild(box);
    });
  }

  function onPick(e) {
    if (locked) return;
    const qi = Number(e.currentTarget.dataset.q);
    const oi = Number(e.currentTarget.dataset.o);
    answers[qi] = oi;
    const box = qWrap.children[qi];
    box.querySelectorAll(`.opt`).forEach(function (b) {
      b.classList.toggle(`selected`, Number(b.dataset.o) === oi);
    });
    updateButton();
  }

  function updateButton() {
    const all = answers.every(function (a) { return a !== null; });
    evalBtn.disabled = !all;
    hint.style.display = all ? `none` : `block`;
  }

  function evaluate() {
    if (locked) return;
    if (!answers.every(function (a) { return a !== null; })) return;
    locked = true;
    let score = 0;
    QUESTIONS.forEach(function (item, qi) {
      const box = qWrap.children[qi];
      box.classList.add(`locked`);
      const fb = box.querySelector(`.feedback`);
      box.querySelectorAll(`.opt`).forEach(function (b) {
        const oi = Number(b.dataset.o);
        b.classList.remove(`selected`);
        if (oi === item.correct) b.classList.add(`correct`);
        else if (oi === answers[qi]) b.classList.add(`wrong`);
      });
      if (answers[qi] === item.correct) {
        score++;
        fb.className = `feedback ok`;
        fb.textContent = `Správně.`;
      } else {
        fb.className = `feedback bad`;
        fb.textContent = `Špatně. Správná odpověď: ` + item.options[item.correct];
      }
    });
    scoreEl.textContent = score + ` z ` + QUESTIONS.length;
    const v = VERDICTS.find(function (r) { return score >= r.min && score <= r.max; });
    verdictEl.textContent = v ? v.text : ``;
    evalBtn.disabled = true;
    evalBtn.style.display = `none`;
    hint.style.display = `none`;
    result.style.display = `block`;
    result.scrollIntoView({ behavior: `smooth`, block: `start` });
  }

  function reset() {
    locked = false;
    answers.fill(null);
    render();
    result.style.display = `none`;
    evalBtn.style.display = `block`;
    updateButton();
    window.scrollTo({ top: 0, behavior: `smooth` });
  }

  evalBtn.addEventListener(`click`, evaluate);
  retryBtn.addEventListener(`click`, reset);

  render();
  updateButton();
})();
</script>
</body>
</html>
