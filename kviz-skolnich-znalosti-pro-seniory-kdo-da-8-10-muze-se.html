<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz školních znalostí pro seniory: kdo dá 8/10, může se směle vrátit do lavice</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: "Georgia", "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 40px 16px;
  line-height: 1.6;
}
.container {
  max-width: 720px;
  margin: 0 auto;
}
h1 {
  font-size: 1.8rem;
  margin: 0 0 20px 0;
  color: #2c2c2c;
  line-height: 1.3;
}
.perex {
  font-size: 1.05rem;
  color: #4a4a4a;
  margin-bottom: 32px;
  font-style: italic;
}
.question {
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 28px;
  margin-bottom: 24px;
}
.question-text {
  font-weight: bold;
  font-size: 1.15rem;
  color: #2c2c2c;
  margin-bottom: 18px;
}
.option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  color: #3a3a3a;
  font-family: inherit;
  margin-bottom: 10px;
  transition: background 0.15s, border-color 0.15s;
}
.option:last-child { margin-bottom: 0; }
.option:hover:not(:disabled) { background: #ede8e1; }
.option.selected {
  background: #dcd3c7;
  border: 1px solid #a89e92;
  font-weight: bold;
}
.option.correct {
  background: #d4edda;
  border: 1px solid #7cb987;
  color: #1e5631;
}
.option.incorrect {
  background: #f8d7da;
  border: 1px solid #d4848a;
  color: #721c24;
}
.option:disabled { cursor: default; }
#evaluate-btn {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #ffffff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
#evaluate-btn:hover:not(:disabled) { background: #4a6b4e; }
#evaluate-btn:disabled {
  background: #b5b5b5;
  cursor: not-allowed;
}
#result {
  display: none;
  background: #fefcf9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-top: 4px solid #5b7e5f;
  padding: 28px;
  margin-top: 32px;
  text-align: center;
}
.score {
  font-size: 2.5rem;
  font-weight: bold;
  color: #5b7e5f;
  margin-bottom: 12px;
}
.eval-text {
  font-size: 1rem;
  color: #4a4a4a;
  margin-bottom: 20px;
}
#retry-btn {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #ffffff;
  padding: 16px 40px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
#retry-btn:hover { background: #756658; }
@media (max-width: 600px) {
  body { padding: 20px 16px; }
  h1 { font-size: 1.5rem; }
  .question { padding: 20px; }
}
</style>
</head>
<body>
<div class="container">
<h1>Kvíz školních znalostí pro seniory: kdo dá 8/10, může se směle vrátit do lavice</h1>
<p class="perex">Školní léta jsou dávno za vámi, ale co všechno vám v hlavě zůstalo? Deset otázek z předmětů, které jste kdysi probírali od češtiny přes dějepis až po přírodní vědy. Zjistěte, jestli byste dnes obstáli v lavici.</p>
<div id="quiz"></div>
<button id="evaluate-btn" disabled>Vyhodnotit</button>
<div id="result">
  <div class="score" id="score-text"></div>
  <div class="eval-text" id="eval-text"></div>
  <button id="retry-btn">Zkusit znovu</button>
</div>
</div>
<script>
const questions = [
  {
    q: `1. Kdo je autorem klasické dětské knihy Broučci?`,
    options: [`Josef Lada`, `Jan Karafiát`, `Ondřej Sekora`, `Václav Čtvrtek`],
    correct: 1
  },
  {
    q: `2. Kdo napsal veršovaný román Evžen Oněgin?`,
    options: [`Alexandr Puškin`, `Michail Lermontov`, `Nikolaj Gogol`, `Ivan Turgeněv`],
    correct: 0
  },
  {
    q: `3. Ve kterém roce vzniklo Rakousko-Uhersko?`,
    options: [`1848`, `1866`, `1867`, `1918`],
    correct: 2
  },
  {
    q: `4. Který panovník se roku 1861 stal prvním králem sjednoceného Italského království?`,
    options: [`Giuseppe Garibaldi`, `Camillo Cavour`, `Umberto I.`, `Viktor Emanuel II.`],
    correct: 3
  },
  {
    q: `5. Které evropské země je Lublaň hlavním městem?`,
    options: [`Slovinska`, `Slovenska`, `Chorvatska`, `Rakouska`],
    correct: 0
  },
  {
    q: `6. Které dva oceány spojuje Panamský průplav?`,
    options: [`Tichý a Indický`, `Atlantský a Tichý`, `Atlantský a Indický`, `Severní ledový a Tichý`],
    correct: 1
  },
  {
    q: `7. Ve které části rostlinné buňky probíhá fotosyntéza?`,
    options: [`v mitochondrii`, `v buněčném jádru`, `v chloroplastu`, `v ribozomu`],
    correct: 2
  },
  {
    q: `8. Který fyzikální zákon popisuje velikost síly, kterou na sebe působí dva elektrické náboje?`,
    options: [`Ohmův zákon`, `Coulombův zákon`, `Ampérův zákon`, `Faradayův zákon`],
    correct: 1
  },
  {
    q: `9. Jak se nazývá chemická reakce kyseliny se zásadou, při které vzniká sůl a voda?`,
    options: [`oxidace`, `hydrolýza`, `redukce`, `neutralizace`],
    correct: 3
  },
  {
    q: `10. Pro který stavební sloh je typický lomený oblouk a žebrová klenba?`,
    options: [`gotiku`, `románský sloh`, `renesanci`, `baroko`],
    correct: 0
  }
];

const evalRanges = [
  { min: 0, max: 3, text: `Školní znalosti se vám během let pořádně vytratily. Návrat do lavice by zatím byl unáhlený, i pár správných odpovědí ale ukazuje, že základ se dá oprášit. Zkuste to znovu.` },
  { min: 4, max: 6, text: `Půl na půl. Něco vám ze školy pevně drží, jinde se vzpomínky rozostřily. Do lavice vás to táhne, na první řadu to ale ještě není. Solidní průměr.` },
  { min: 7, max: 9, text: `Silný výsledek. Sedm bodů znamená, že vám k návratu schází jediný krůček. Kdo dosáhl osmi a víc, může se podle titulku směle vrátit do lavice a klidně poradit i mladším.` },
  { min: 10, max: 10, text: `Plný počet. Učivo napříč předměty ovládáte bez zaváhání. Do lavice se můžete vrátit s přehledem a rovnou si stoupnout před tabuli.` }
];

const answers = new Array(questions.length).fill(null);
let evaluated = false;

const quizEl = document.getElementById(`quiz`);
const evalBtn = document.getElementById(`evaluate-btn`);
const resultEl = document.getElementById(`result`);
const scoreEl = document.getElementById(`score-text`);
const evalTextEl = document.getElementById(`eval-text`);
const retryBtn = document.getElementById(`retry-btn`);

function renderQuiz() {
  quizEl.innerHTML = ``;
  questions.forEach((question, qIdx) => {
    const box = document.createElement(`div`);
    box.className = `question`;
    const qText = document.createElement(`div`);
    qText.className = `question-text`;
    qText.textContent = question.q;
    box.appendChild(qText);
    question.options.forEach((opt, oIdx) => {
      const btn = document.createElement(`button`);
      btn.className = `option`;
      btn.type = `button`;
      const letter = String.fromCharCode(97 + oIdx);
      btn.textContent = `${letter}) ${opt}`;
      btn.dataset.qIdx = qIdx;
      btn.dataset.oIdx = oIdx;
      btn.addEventListener(`click`, handleOptionClick);
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function handleOptionClick(event) {
  if (evaluated) return;
  const btn = event.currentTarget;
  const qIdx = parseInt(btn.dataset.qIdx, 10);
  const oIdx = parseInt(btn.dataset.oIdx, 10);
  answers[qIdx] = oIdx;
  const box = btn.parentElement;
  box.querySelectorAll(`.option`).forEach(b => b.classList.remove(`selected`));
  btn.classList.add(`selected`);
  updateEvalButton();
}

function updateEvalButton() {
  const allAnswered = answers.every(a => a !== null);
  evalBtn.disabled = !allAnswered;
}

function evaluate() {
  if (answers.some(a => a === null)) {
    alert(`Odpovězte prosím na všechny otázky`);
    return;
  }
  evaluated = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.question`);
  boxes.forEach((box, qIdx) => {
    const opts = box.querySelectorAll(`.option`);
    const correctIdx = questions[qIdx].correct;
    const userIdx = answers[qIdx];
    opts.forEach((opt, oIdx) => {
      opt.disabled = true;
      opt.classList.remove(`selected`);
      if (oIdx === correctIdx) {
        opt.classList.add(`correct`);
      } else if (oIdx === userIdx) {
        opt.classList.add(`incorrect`);
      }
    });
    if (userIdx === correctIdx) score++;
  });
  scoreEl.textContent = `${score} z ${questions.length}`;
  const range = evalRanges.find(r => score >= r.min && score <= r.max);
  evalTextEl.textContent = range ? range.text : ``;
  evalBtn.style.display = `none`;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth`, block: `start` });
}

function reset() {
  evaluated = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  renderQuiz();
  evalBtn.disabled = true;
  evalBtn.style.display = `block`;
  resultEl.style.display = `none`;
  window.scrollTo({ top: 0, behavior: `smooth` });
}

evalBtn.addEventListener(`click`, evaluate);
retryBtn.addEventListener(`click`, reset);

renderQuiz();
</script>
</body>
</html>
