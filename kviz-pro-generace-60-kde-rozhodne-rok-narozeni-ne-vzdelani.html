<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz pro generace 60+, kde rozhodne rok narození, ne vzdělání</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Georgia, "Times New Roman", serif;
  background: #f5f0eb;
  color: #2c2c2c;
  margin: 0;
  padding: 24px 16px;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.8rem; line-height: 1.25; margin: 0 0 18px; color: #2c2c2c; }
.perex { font-size: 1.1rem; margin: 0 0 28px; color: #4a4a4a; }
.q {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-bottom: 24px;
}
.q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 16px; }
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  margin-bottom: 10px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: #3a3a3a;
  cursor: pointer;
  transition: background .15s;
}
.opt:last-child { margin-bottom: 0; }
.opt:hover { background: #ede8e1; }
.opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
.opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
.opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
.opt:disabled { cursor: default; }
#submit {
  display: block;
  margin: 40px auto 0;
  background: #5b7e5f;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#submit:hover { background: #4a6b4e; }
#submit:disabled { background: #b5b5b5; cursor: not-allowed; }
.hint { text-align: center; color: #a05050; margin-top: 12px; min-height: 1.2em; }
#result {
  background: #fefcf9;
  border-top: 4px solid #5b7e5f;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  padding: 28px;
  margin-top: 32px;
  display: none;
}
#score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 12px; }
#verdict { font-size: 1rem; color: #4a4a4a; text-align: center; }
#retry {
  display: block;
  margin: 24px auto 0;
  background: #8c7b6b;
  color: #fff;
  padding: 16px 40px;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}
#retry:hover { background: #756658; }
.open-input {
  width: 100%;
  padding: 14px 18px;
  background: #f7f4f0;
  border: 1px solid #d9d2c9;
  border-radius: 8px;
  font-family: inherit;
  font-size: 1rem;
  color: #3a3a3a;
}
</style>
</head>
<body>
<div class="wrap">
<h1></h1>
<p class="perex"></p>
<div id="quiz"></div>
<button id="submit" disabled>Vyhodnotit</button>
<div class="hint" id="hint"></div>
<div id="result">
  <div id="score"></div>
  <div id="verdict"></div>
  <button id="retry">Zkusit znovu</button>
</div>
</div>
<script>
const TITLE = `Kvíz pro generace 60+, kde rozhodne rok narození, ne vzdělání`;
const PEREX = `Deset otázek na svět vašeho mládí: značky, filmy, spotřebiče i písně padesátých až sedmdesátých let. Kdo tehdy žil, boduje. Osm a víc z deseti dá málokdo, protože tu nerozhoduje diplom, ale rok, kdy jste se narodili.`;
const QUESTIONS = [
  { q: `Která píseň se stala hymnou odporu proti srpnové okupaci roku 1968 a její interpretce vynesla dvacetiletý zákaz vystupování?`,
    options: [`Sladké mámení`, `Modlitba pro Martu`, `Řeka lásky`, `Malovaný džbánku`], correct: 1 },
  { q: `Jak se říkalo smetanové zmrzlině podávané mezi dvěma oplatkami, oblíbené už za socialismu?`,
    options: [`Míša`, `Eskymo`, `Ruská zmrzlina`, `Polárka`], correct: 2 },
  { q: `Jaký kus oděvu se skrýval pod dobovým názvem šponovky?`,
    options: [`přiléhavé kalhoty se třmenem pod chodidlem`, `krátký vlněný dámský kabátek`, `pletená čepice s bambulí`, `dlouhá skládaná sukně`], correct: 0 },
  { q: `Který snímek natočila v roce 1966 režisérka Věra Chytilová a stal se jednou z klíčových provokací československé nové vlny, po níž měla léta zákaz práce?`,
    options: [`Lásky jedné plavovlásky`, `Démanty noci`, `Hoří, má panenko`, `Sedmikrásky`], correct: 3 },
  { q: `Které pražské televizní středisko začalo pro Československou televizi fungovat od roku 1970 a postupně se stalo jejím hlavním sídlem?`,
    options: [`Barrandov`, `Kavčí hory`, `Hostivař`, `Strahov`], correct: 1 },
  { q: `Který týdeník byl v éře socialismu nejčtenějším časopisem pro mládež, proslulým rozhovory s hvězdami, plakáty a reportážemi?`,
    options: [`Vlasta`, `Květy`, `Signál`, `Mladý svět`], correct: 3 },
  { q: `Který jediný sériově vyráběný skútr značky ČZ ze Strakonic se od konce 50. let stal legendou československých silnic?`,
    options: [`Čezeta`, `Manet`, `Tatran`, `Stadion`], correct: 0 },
  { q: `Českoslovenští fotbalisté vybojovali na mistrovství světa 1962 stříbrné medaile. Ve které zemi se tento šampionát hrál?`,
    options: [`Švédsko`, `Chile`, `Anglie`, `Mexiko`], correct: 1 },
  { q: `Který zpěvák, jedna z výrazných postav české rockové scény, se v roce 1973 proslavil hitem Holubí dům?`,
    options: [`Karel Gott`, `Václav Neckář`, `Jiří Schelinger`, `Waldemar Matuška`], correct: 2 },
  { q: `Která tuzemská kosmetická značka proslula krycím make-upem, jenž vznikl ve filmových ateliérech na Barrandově?`,
    options: [`Astrid`, `Regina`, `Dermacol`, `Alpa`], correct: 2 }
];
const RANGES = [
  { min: 0, max: 3, text: `Tohle je svět, který jste nezažili nebo vám dávno vybledl. Kdybychom soudili jen podle vašich odpovědí, tipli bychom si mladší ročník, ne pamětníka.` },
  { min: 4, max: 6, text: `Půl na půl. Pár věcí ve vás zůstalo, ale k opravdovému pamětníkovi ještě kousek chybí. Svou generaci byste zatím pevně nepodržel.` },
  { min: 7, max: 9, text: `Výborně. Tohle je skóre člověka, který tu dobu naplno prožil. Osmibodová laťka padla a patříte mezi pravé pamětníky.` },
  { min: 10, max: 10, text: `Naprostá špička. Vybavujete si i to, co většina vrstevníků dávno pustila z hlavy. Rok narození prostě nezapřete.` }
];

const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

document.querySelector(`h1`).textContent = TITLE;
document.querySelector(`.perex`).textContent = PEREX;

const quizEl = document.getElementById(`quiz`);
const submitBtn = document.getElementById(`submit`);
const hintEl = document.getElementById(`hint`);
const resultEl = document.getElementById(`result`);

function render() {
  quizEl.innerHTML = ``;
  QUESTIONS.forEach((item, qi) => {
    const box = document.createElement(`div`);
    box.className = `q`;
    const qt = document.createElement(`div`);
    qt.className = `q-text`;
    qt.textContent = (qi + 1) + `. ` + item.q;
    box.appendChild(qt);
    item.options.forEach((opt, oi) => {
      const btn = document.createElement(`button`);
      btn.className = `opt`;
      btn.textContent = opt;
      btn.addEventListener(`click`, () => {
        if (locked) return;
        answers[qi] = oi;
        Array.from(box.querySelectorAll(`.opt`)).forEach(b => b.classList.remove(`selected`));
        btn.classList.add(`selected`);
        updateSubmit();
      });
      box.appendChild(btn);
    });
    quizEl.appendChild(box);
  });
}

function updateSubmit() {
  const all = answers.every(a => a !== null);
  submitBtn.disabled = !all;
  if (all) hintEl.textContent = ``;
}

submitBtn.addEventListener(`click`, () => {
  if (answers.some(a => a === null)) {
    hintEl.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  locked = true;
  let score = 0;
  const boxes = quizEl.querySelectorAll(`.q`);
  boxes.forEach((box, qi) => {
    const opts = box.querySelectorAll(`.opt`);
    opts.forEach((btn, oi) => {
      btn.disabled = true;
      if (oi === QUESTIONS[qi].correct) btn.classList.add(`correct`);
      if (oi === answers[qi] && answers[qi] !== QUESTIONS[qi].correct) btn.classList.add(`wrong`);
    });
    if (answers[qi] === QUESTIONS[qi].correct) score++;
  });
  document.getElementById(`score`).textContent = score + ` z ` + QUESTIONS.length;
  const r = RANGES.find(x => score >= x.min && score <= x.max);
  document.getElementById(`verdict`).textContent = r ? r.text : ``;
  submitBtn.style.display = `none`;
  resultEl.style.display = `block`;
  resultEl.scrollIntoView({ behavior: `smooth` });
});

document.getElementById(`retry`).addEventListener(`click`, () => {
  locked = false;
  for (let i = 0; i < answers.length; i++) answers[i] = null;
  render();
  submitBtn.style.display = `block`;
  submitBtn.disabled = true;
  resultEl.style.display = `none`;
  hintEl.textContent = ``;
  window.scrollTo({ top: 0, behavior: `smooth` });
});

render();
</script>
</body>
</html>
