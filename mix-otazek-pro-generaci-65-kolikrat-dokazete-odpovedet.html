<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix otázek pro generaci 65+: Kolikrát dokážete odpovědět bez jediného zaváhání?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    margin: 0;
    padding: 32px 16px;
    color: #2c2c2c;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 20px; }
  .perex { font-size: 1.05rem; line-height: 1.6; color: #4a4a4a; margin: 0 0 32px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .zneni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; line-height: 1.45; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .hotovo .varianta { cursor: default; }
  #vyhodnotit {
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #vyhodnotit:hover { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  #hlaska { text-align: center; color: #721c24; margin-top: 14px; font-size: .95rem; }
  #vysledek {
    background: #fefcf9;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 40px;
    border-top: 4px solid #5b7e5f;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin-bottom: 16px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; line-height: 1.65; }
  #znovu {
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    font-family: inherit;
    cursor: pointer;
  }
  #znovu:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 1.5rem; }
    .otazka, #vysledek { padding: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="nadpis"></h1>
  <p class="perex" id="perex"></p>
  <div id="kviz"></div>
  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <p id="hlaska"></p>
  <div id="vysledek" hidden>
    <div id="skore"></div>
    <div id="hodnoceni"></div>
    <button id="znovu">Zkusit znovu</button>
  </div>
</div>
<script>
var NADPIS = `Mix otázek pro generaci 65+: Kolikrát dokážete odpovědět bez jediného zaváhání?`;
var PEREX = `Deset otázek a pokaždé jiný obor. Chvíli jste u řeky, chvíli v kuchyni, pak v lidském těle, v cizí krajině i mezi knížkami z dětství. Nic z toho se nedá nabiflovat, takové věci člověk pochytí za život. Kolikrát vám odpověď naskočí sama?`;

var OTAZKY = [
  { z: `Jak se jmenuje vodní stavba, s jejíž pomocí se překonává rozdíl mezi horní a dolní hladinou řeky?`,
    v: [`pevný jez`, `plavební komora`, `mlýnský náhon`, `sypaná hráz`], s: 1 },
  { z: `Z jaké suroviny se vyrábí tofu?`,
    v: [`ze sóji`, `z pšenice`, `z kukuřice`, `z rýže`], s: 0 },
  { z: `Kdo napsal a nakreslil knížku Ferda Mravenec?`,
    v: [`Josef Lada`, `Václav Čtvrtek`, `Jiří Trnka`, `Ondřej Sekora`], s: 3 },
  { z: `Který sval je v lidském těle hmotnostně největší?`,
    v: [`velký sval prsní`, `široký sval zádový`, `velký sval hýžďový`, `trojhlavý sval lýtkový`], s: 2 },
  { z: `Jak se jmenovala loď, na které roku 1620 dopluli angličtí osadníci k břehům Severní Ameriky?`,
    v: [`Golden Hind`, `Mayflower`, `Beagle`, `Endeavour`], s: 1 },
  { z: `Na území kterých dvou států leží Patagonie?`,
    v: [`Brazílie a Bolívie`, `Peru a Ekvádoru`, `Chile a Bolívie`, `Argentiny a Chile`], s: 3 },
  { z: `Který mořský savec má jediný dlouhý spirálovitě stočený kel?`,
    v: [`narval`, `mrož`, `vorvaň`, `běluha`], s: 0 },
  { z: `Co znamená slovo šlendrián?`,
    v: [`hlasitou hádku`, `staré nepotřebné harampádí`, `nedbalost a nepořádek`, `lakomého člověka`], s: 2 },
  { z: `Která z těchto proslulých ruských muzejních sbírek sídlí v Moskvě?`,
    v: [`Ermitáž`, `Ruské muzeum`, `Kunstkamera`, `Treťjakovská galerie`], s: 3 },
  { z: `Kdo složil operetu Čardášová princezna?`,
    v: [`Emmerich Kálmán`, `Franz Lehár`, `Johann Strauss mladší`, `Jacques Offenbach`], s: 0 }
];

var HODNOCENI = [
  { min: 0, max: 3, t: `Bez zaváhání jste odpověděli nanejvýš třikrát a zbytek desítky vás nutil vybírat mezi možnostmi, které vypadaly stejně dobře. Nejjistěji se přitom stojí u tofua, Ferdy Mravence, Patagonie a významu šlendriánu, tedy tam, kde se dá stavět na tom, co člověk potkává běžně. Deset různých oborů za sebou je nemilosrdné, protože stačí, aby vás dva tři z nich minuly, a skóre spadne. Zkuste kvíz s odstupem znovu, čtyři body jsou blíž, než to teď vypadá.` },
  { min: 4, max: 6, t: `Jistotu jste měli u poloviny otázek a druhá polovina vás donutila přemýšlet. Přesně tady se láme střední pásmo, ve kterém rozhodovala vodní stavba překonávající rozdíl hladin, hmotnostně největší sval, loď z roku 1620, kel arktického savce a rozlišení moskevské galerie od petrohradských sbírek. Na obvyklou sedmičku vám chybí jedna až tři odpovědi, takže zůstáváte kousek pod tím, co tenhle mix od řešitele čeká.` },
  { min: 7, max: 9, t: `Bez zaváhání jste odpověděli sedmkrát až devětkrát a přesně na tuhle metu byl kvíz postavený. Rozjezd jste projeli bez zaškobrtnutí a uspěli jste i tam, kde se rozhodovalo mezi dvěma velmi podobnými variantami. Zbylá jedna až tři ztráty padají skoro jistě na účet operety nebo některé z otázek středního pásma. Je to výsledek, který drží běžný český řešitel, a vy jste se do něj trefili.` },
  { min: 10, max: 10, t: `Deset otázek, deset odpovědí bez jediného zaváhání. Nezastavila vás ani vodní stavba překonávající rozdíl hladin, ani spirálovitý kel, ani skladatel, kterého většina řešitelů zamění za slavnějšího kolegu. Plný počet zvládne opravdu jen menšina a vy jste prošli celou desítkou, aniž byste jedinkrát váhali mezi dvěma možnostmi. Klobouk dolů.` }
];

var PISMENA = [`a)`, `b)`, `c)`, `d)`];
var odpovedi = [];
var hotovo = false;

var elNadpis = document.getElementById(`nadpis`);
var elPerex = document.getElementById(`perex`);
var elKviz = document.getElementById(`kviz`);
var elTlacitko = document.getElementById(`vyhodnotit`);
var elHlaska = document.getElementById(`hlaska`);
var elVysledek = document.getElementById(`vysledek`);
var elSkore = document.getElementById(`skore`);
var elHodnoceni = document.getElementById(`hodnoceni`);
var elZnovu = document.getElementById(`znovu`);

elNadpis.textContent = NADPIS;
elPerex.textContent = PEREX;

function postav() {
  elKviz.textContent = ``;
  OTAZKY.forEach(function (otazka, i) {
    var box = document.createElement(`div`);
    box.className = `otazka`;
    box.id = `otazka-` + i;

    var zneni = document.createElement(`div`);
    zneni.className = `zneni`;
    zneni.textContent = (i + 1) + `. ` + otazka.z;
    box.appendChild(zneni);

    otazka.v.forEach(function (text, j) {
      var btn = document.createElement(`button`);
      btn.type = `button`;
      btn.className = `varianta`;
      btn.textContent = PISMENA[j] + ` ` + text;
      btn.addEventListener(`click`, function () { vyber(i, j); });
      box.appendChild(btn);
    });

    elKviz.appendChild(box);
  });
}

function vyber(i, j) {
  if (hotovo) { return; }
  odpovedi[i] = j;
  var tlacitka = document.getElementById(`otazka-` + i).querySelectorAll(`.varianta`);
  for (var k = 0; k < tlacitka.length; k++) {
    if (k === j) { tlacitka[k].classList.add(`vybrana`); }
    else { tlacitka[k].classList.remove(`vybrana`); }
  }
  elHlaska.textContent = ``;
  elTlacitko.disabled = !vseZodpovezeno();
}

function vseZodpovezeno() {
  for (var i = 0; i < OTAZKY.length; i++) {
    if (typeof odpovedi[i] !== `number`) { return false; }
  }
  return true;
}

function vyhodnot() {
  if (!vseZodpovezeno()) {
    elHlaska.textContent = `Odpovězte prosím na všechny otázky`;
    return;
  }
  hotovo = true;
  var skore = 0;

  OTAZKY.forEach(function (otazka, i) {
    var box = document.getElementById(`otazka-` + i);
    box.classList.add(`hotovo`);
    var tlacitka = box.querySelectorAll(`.varianta`);
    for (var k = 0; k < tlacitka.length; k++) {
      tlacitka[k].classList.remove(`vybrana`);
      if (k === otazka.s) { tlacitka[k].classList.add(`spravna`); }
      else if (k === odpovedi[i]) { tlacitka[k].classList.add(`spatna`); }
    }
    if (odpovedi[i] === otazka.s) { skore++; }
  });

  elTlacitko.disabled = true;
  elHlaska.textContent = ``;
  elSkore.textContent = skore + ` z ` + OTAZKY.length;

  for (var h = 0; h < HODNOCENI.length; h++) {
    if (skore >= HODNOCENI[h].min && skore <= HODNOCENI[h].max) {
      elHodnoceni.textContent = HODNOCENI[h].t;
      break;
    }
  }

  elVysledek.hidden = false;
  elVysledek.scrollIntoView({ behavior: `smooth`, block: `start` });
}

function znovu() {
  odpovedi = [];
  hotovo = false;
  elVysledek.hidden = true;
  elHlaska.textContent = ``;
  elTlacitko.disabled = true;
  postav();
  window.scrollTo({ top: 0, behavior: `smooth` });
}

elTlacitko.addEventListener(`click`, vyhodnot);
elZnovu.addEventListener(`click`, znovu);
postav();
</script>
</body>
</html>
