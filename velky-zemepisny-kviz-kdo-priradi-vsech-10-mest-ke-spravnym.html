<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velký zeměpisný kvíz: kdo přiřadí všech 10 měst ke správným státům, má perfektní přehled</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f5f0eb;
    color: #2c2c2c;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.7rem; line-height: 1.3; color: #2c2c2c; margin: 0 0 18px; }
  .perex { font-size: 1.1rem; color: #444; margin: 0 0 28px; }
  .otazka {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .znuni { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin-bottom: 18px; }
  .varianta {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin-bottom: 12px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-size: 1rem;
    color: #3a3a3a;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  .varianta:last-child { margin-bottom: 0; }
  .varianta:hover { background: #ede8e1; }
  .varianta.vybrana { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .varianta.spravna { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .varianta.spatna { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .varianta.zamek { cursor: default; }
  #vyhodnotit {
    display: block;
    margin: 40px auto 0;
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  #vyhodnotit:hover { background: #4a6b4e; }
  #vyhodnotit:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hlaska { text-align: center; color: #721c24; margin-top: 14px; min-height: 1.2em; }
  #vysledek {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-top: 28px;
    display: none;
  }
  #skore { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  #hodnoceni { font-size: 1rem; color: #4a4a4a; text-align: center; margin: 0; }
  #znovu {
    display: block;
    margin: 24px auto 0;
    background: #8c7b6b;
    color: #fff;
    padding: 16px 40px;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  #znovu:hover { background: #756658; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Velký zeměpisný kvíz: kdo přiřadí všech 10 měst ke správným státům, má perfektní přehled</h1>
  <p class="perex">Deset měst z celého světa a u každého jediná otázka: ve kterém státě vlastně leží? Některá znějí, jako by patřila úplně jinam, a právě tam řešitelé nejčastěji sáhnou vedle. Trefíte správně všech deset?</p>
  <div id="kviz"></div>
  <button id="vyhodnotit" disabled>Vyhodnotit</button>
  <div class="hlaska" id="hlaska"></div>
  <div id="vysledek">
    <div id="skore"></div>
    <p id="hodnoceni"></p>
    <button id="znovu">Zkusit znovu</button>
  </div>
</div>
<script>
  const otazky = [
    { znuni: `1. Ve kterém státě leží město Casablanca?`,
      varianty: [`a) Maroko`, `b) Alžírsko`, `c) Tunisko`, `d) Egypt`], spravna: 0 },
    { znuni: `2. Ve kterém státě leží město Medellín?`,
      varianty: [`a) Venezuela`, `b) Kolumbie`, `c) Ekvádor`, `d) Panama`], spravna: 1 },
    { znuni: `3. Ve kterém státě leží město Adelaide?`,
      varianty: [`a) Nový Zéland`, `b) Jihoafrická republika`, `c) Austrálie`, `d) Kanada`], spravna: 2 },
    { znuni: `4. Ve kterém státě leží město Antverpy?`,
      varianty: [`a) Nizozemsko`, `b) Německo`, `c) Francie`, `d) Belgie`], spravna: 3 },
    { znuni: `5. Ve kterém státě leží město Chiang Mai?`,
      varianty: [`a) Thajsko`, `b) Laos`, `c) Vietnam`, `d) Barma`], spravna: 0 },
    { znuni: `6. Ve kterém státě leží město Calgary?`,
      varianty: [`a) USA`, `b) Austrálie`, `c) Kanada`, `d) Nový Zéland`], spravna: 2 },
    { znuni: `7. Ve kterém státě leží město Lahore?`,
      varianty: [`a) Indie`, `b) Pákistán`, `c) Bangladéš`, `d) Afghánistán`], spravna: 1 },
    { znuni: `8. Ve kterém státě leží město Samarkand?`,
      varianty: [`a) Kazachstán`, `b) Írán`, `c) Turkmenistán`, `d) Uzbekistán`], spravna: 3 },
    { znuni: `9. Ve kterém státě leží město Rosario?`,
      varianty: [`a) Uruguay`, `b) Argentina`, `c) Paraguay`, `d) Chile`], spravna: 1 },
    { znuni: `10. Ve kterém státě leží město Mombasa?`,
      varianty: [`a) Tanzanie`, `b) Uganda`, `c) Keňa`, `d) Etiopie`], spravna: 2 }
  ];

  const odpovedi = new Array(otazky.length).fill(null);
  let vyhodnoceno = false;
  const kvizEl = document.getElementById(`kviz`);
  const btn = document.getElementById(`vyhodnotit`);
  const hlaska = document.getElementById(`hlaska`);

  otazky.forEach((o, i) => {
    const box = document.createElement(`div`);
    box.className = `otazka`;
    const z = document.createElement(`div`);
    z.className = `znuni`;
    z.textContent = o.znuni;
    box.appendChild(z);
    o.varianty.forEach((v, j) => {
      const b = document.createElement(`button`);
      b.className = `varianta`;
      b.textContent = v;
      b.addEventListener(`click`, () => {
        if (vyhodnoceno) return;
        odpovedi[i] = j;
        Array.from(box.querySelectorAll(`.varianta`)).forEach(el => el.classList.remove(`vybrana`));
        b.classList.add(`vybrana`);
        if (odpovedi.every(x => x !== null)) { btn.disabled = false; hlaska.textContent = ``; }
      });
      box.appendChild(b);
    });
    kvizEl.appendChild(box);
  });

  btn.addEventListener(`click`, () => {
    if (odpovedi.some(x => x === null)) { hlaska.textContent = `Odpovězte prosím na všechny otázky`; return; }
    vyhodnoceno = true;
    let skore = 0;
    const boxy = kvizEl.querySelectorAll(`.otazka`);
    boxy.forEach((box, i) => {
      const tlacitka = box.querySelectorAll(`.varianta`);
      tlacitka.forEach((b, j) => {
        b.classList.add(`zamek`);
        b.classList.remove(`vybrana`);
        if (j === otazky[i].spravna) b.classList.add(`spravna`);
        else if (j === odpovedi[i]) b.classList.add(`spatna`);
      });
      if (odpovedi[i] === otazky[i].spravna) skore++;
    });
    btn.disabled = true;
    hlaska.textContent = ``;
    document.getElementById(`skore`).textContent = skore + ` z 10`;
    document.getElementById(`hodnoceni`).textContent = hodnoceniText(skore);
    document.getElementById(`vysledek`).style.display = `block`;
    document.getElementById(`vysledek`).scrollIntoView({ behavior: `smooth` });
  });

  function hodnoceniText(s) {
    if (s <= 3) return `Mapa světa se vám zatím proplétá mezi prsty. Města znějící cizokrajně končila v nesprávných státech a tam, kde láká záměna se sousedem, jste sáhli vedle. Nevadí, projděte si správné odpovědi a příště zamíříte výš.`;
    if (s <= 6) return `Přesně tady se drží většina řešitelů. Slavnější metropole přiřadíte správně, ale jakmile přijde na město, které si lidé pletou s vedlejší zemí, jistota kolísá. Do přehledu skutečného znalce vám chybí jen pár správných trefení.`;
    if (s <= 9) return `Skvělý výkon. Napříč světadíly umíte přiřadit město ke správnému státu i tam, kde většina naletí na těsný sousední distraktor. K perfektnímu přehledu vám scházel jediný krok, nejspíš u jednoho zvlášť záludného města.`;
    return `Naprostá špička. Od severní Afriky přes Jižní Ameriku a střední Asii až po východní Afriku jste každé město poslali do správného státu a žádná léčka vás nerozhodila. Takhle kompletní zeměpisný přehled má opravdu jen zlomek lidí.`;
  }

  document.getElementById(`znovu`).addEventListener(`click`, () => {
    vyhodnoceno = false;
    for (let i = 0; i < odpovedi.length; i++) odpovedi[i] = null;
    kvizEl.querySelectorAll(`.varianta`).forEach(b => { b.className = `varianta`; });
    document.getElementById(`vysledek`).style.display = `none`;
    btn.disabled = true;
    hlaska.textContent = ``;
    window.scrollTo({ top: 0, behavior: `smooth` });
  });
</script>
</body>
</html>
