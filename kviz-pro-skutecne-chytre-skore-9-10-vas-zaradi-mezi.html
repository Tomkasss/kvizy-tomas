<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz pro skutečně chytré: Skóre 9/10 vás zařadí mezi nejlepších 10 % lidí</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #f5f0eb;
    font-family: Georgia, "Times New Roman", serif;
    color: #2c2c2c;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; margin: 0 0 16px; color: #2c2c2c; }
  .perex { font-size: 1.05rem; line-height: 1.6; color: #4a4a4a; margin: 0 0 28px; }
  .box {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 24px;
  }
  .q-text { font-weight: bold; font-size: 1.15rem; color: #2c2c2c; margin: 0 0 16px; line-height: 1.4; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin: 0 0 10px;
    background: #f7f4f0;
    border: 1px solid #d9d2c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    color: #3a3a3a;
    cursor: pointer;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt:hover { background: #ede8e1; }
  .opt.selected { background: #dcd3c7; border: 1px solid #a89e92; font-weight: bold; }
  .opt.correct { background: #d4edda; border: 1px solid #7cb987; color: #1e5631; }
  .opt.wrong { background: #f8d7da; border: 1px solid #d4848a; color: #721c24; }
  .locked .opt { cursor: default; }
  .locked .opt:hover { background: inherit; }
  .locked .opt.correct:hover { background: #d4edda; }
  .locked .opt.wrong:hover { background: #f8d7da; }
  .feedback { margin-top: 14px; font-size: 1rem; }
  .feedback.ok { color: #1e5631; }
  .feedback.bad { color: #721c24; }
  .btn {
    background: #5b7e5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    display: block;
    margin: 40px auto 0;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #4a6b4e; }
  .btn:disabled { background: #b5b5b5; cursor: not-allowed; }
  .hint { text-align: center; color: #8a8a8a; margin-top: 12px; font-size: .95rem; }
  .result {
    background: #fefcf9;
    border-top: 4px solid #5b7e5f;
    margin-top: 40px;
    display: none;
  }
  .score { font-size: 2.5rem; font-weight: bold; color: #5b7e5f; text-align: center; margin: 0 0 12px; }
  .verdict { font-size: 1rem; color: #4a4a4a; text-align: center; line-height: 1.6; margin: 0; }
  .btn-retry { background: #8c7b6b; }
  .btn-retry:hover { background: #756658; }
  @media (max-width: 600px) {
    body { padding: 16px; }
    .box { padding: 20px 16px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvíz pro skutečně chytré: Skóre 9/10 vás zařadí mezi nejlepších 10 % lidí</h1>
  <p class="perex">Devět bodů z deseti tu dá zhruba každý desátý řešitel. Kdo se k nim dobere, orientuje se v přírodě, kuchyni, románech, dějinách, fyzice i hudbě zároveň. Kde se zastavíte vy?</p>
  <div id="quiz"></div>
  <button id="evaluate" class="btn" type="button" disabled>Vyhodnotit</button>
  <p id="hint" class="hint">Odpovězte prosím na všechny otázky</p>
  <div id="result" class="box result">
    <p id="score" class="score"></p>
    <p id="verdict" class="verdict"></p>
    <button id="retry" class="btn btn-retry" type="button">Zkusit znovu</button>
  </div>
</div>
<script>
(function () {
  const questions = [
    { q: `1. Kteří jedinci komára pisklavého sají krev?`, o: [`jen samci`, `samci i samice`, `žádní, živí se jen nektarem`, `jen samice`], c: 3 },
    { q: `2. Který z těchto sýrů zraje s modrou plísní uvnitř hmoty?`, o: [`gorgonzola`, `parmazán`, `camembert`, `ementál`], c: 0 },
    { q: `3. Jak se jmenuje úhlavní nepřítel Sherlocka Holmese?`, o: [`inspektor Lestrade`, `Mycroft Holmes`, `profesor Moriarty`, `doktor Mortimer`], c: 2 },
    { q: `4. Co musel Tom Sawyer v románu Marka Twaina za trest natírat místo sobotního volna?`, o: [`kůlnu`, `stodolu`, `dům`, `plot`], c: 3 },
    { q: `5. Podél které rovnoběžky byla po druhé světové válce rozdělena Korea?`, o: [`podél 17. rovnoběžky`, `podél 38. rovnoběžky`, `podél 45. rovnoběžky`, `podél 49. rovnoběžky`], c: 1 },
    { q: `6. Na konci kterého geologického období vymřeli dinosauři?`, o: [`triasu`, `jury`, `křídy`, `permu`], c: 2 },
    { q: `7. Který panovník nařídil stavbu pařížského Vítězného oblouku?`, o: [`Napoleon I.`, `Ludvík XIV.`, `Napoleon III.`, `Ludvík XVI.`], c: 0 },
    { q: `8. Při kolika stupních Fahrenheita mrzne čistá voda za normálního tlaku?`, o: [`24`, `32`, `40`, `48`], c: 1 },
    { q: `9. Které město drželi Němci za druhé světové války 872 dní v obklíčení?`, o: [`Stalingrad`, `Leningrad`, `Sevastopol`, `Moskvu`], c: 1 },
    { q: `10. Čím se u saxofonu rozechvívá vzduch a vzniká tón?`, o: [`jediným plátkem na hubičce`, `dvojitým plátkem`, `chvěním rtů v nátrubku`, `proudem vzduchu rozráženým o ostrou hranu`], c: 0 }
  ];
  const letters = [`a`, `b`, `c`, `d`];
  const verdicts = [
    { min: 0, max: 3, text: `S takovým skóre patříte k nejslabším zhruba 10 % řešitelů. Kvíz začíná věcmi, které člověk potká už na základní škole, a ty vám tentokrát utekly. Zkuste to znovu za pár dní, napodruhé to obvykle vyjde líp.` },
    { min: 4, max: 6, text: `Jste v dolní polovině, zhruba mezi 10 a 40 % řešitelů od spodu. Lehčí otázky jste zvládli, ale ve střední části, kde už nestačí školní základ a je potřeba širší přehled, jste ztratili víc bodů, než jste si mohli dovolit.` },
    { min: 7, max: 9, text: `Sedm nebo osm bodů je pevný střed. Tam končí zhruba polovina všech, kdo kvíz dokončí, takže jste přesně tam, kde se čekalo. Devět bodů je jiná liga: s nimi patříte mezi nejlepších 10 % a slib z nadpisu se vás týká doslova.` },
    { min: 10, max: 10, text: `Bez jediné chyby to zvládnou přibližně tři řešitelé ze sta. Prošli jste přírodou, kuchyní, romány, dějinami, fyzikou i hudbou a nezaváhali jste ani u toho, čím saxofon vlastně tvoří tón. Lepší výsledek tu udělat nejde.` }
  ];

  const quizEl = document.getElementById(`quiz`);
  const evalBtn = document.getElementById(`evaluate`);
  const hint = document.getElementById(`hint`);
  const resultEl = document.getElementById(`result`);
  const scoreEl = document.getElementById(`score`);
  const verdictEl = document.getElementById(`verdict`);
  const retryBtn = document.getElementById(`retry`);

  let answers = [];
  let locked = false;

  function render() {
    quizEl.innerHTML = ``;
    answers = new Array(questions.length).fill(null);
    locked = false;
    questions.forEach(function (item, qi) {
      const box = document.createElement(`div`);
      box.className = `box`;
      const p = document.createElement(`p`);
      p.className = `q-text`;
      p.textContent = item.q;
      box.appendChild(p);
      item.o.forEach(function (opt, oi) {
        const b = document.createElement(`button`);
        b.type = `button`;
        b.className = `opt`;
        b.textContent = letters[oi] + `) ` + opt;
        b.addEventListener(`click`, function () {
          if (locked) return;
          answers[qi] = oi;
          Array.prototype.forEach.call(box.querySelectorAll(`.opt`), function (el) { el.classList.remove(`selected`); });
          b.classList.add(`selected`);
          updateButton();
        });
        box.appendChild(b);
      });
      const fb = document.createElement(`div`);
      fb.className = `feedback`;
      box.appendChild(fb);
      quizEl.appendChild(box);
    });
    resultEl.style.display = `none`;
    evalBtn.style.display = `block`;
    updateButton();
  }

  function updateButton() {
    const all = answers.every(function (a) { return a !== null; });
    evalBtn.disabled = !all;
    hint.style.display = all ? `none` : `block`;
  }

  evalBtn.addEventListener(`click`, function () {
    if (evalBtn.disabled || locked) return;
    locked = true;
    let score = 0;
    const boxes = quizEl.querySelectorAll(`.box`);
    questions.forEach(function (item, qi) {
      const box = boxes[qi];
      box.classList.add(`locked`);
      const opts = box.querySelectorAll(`.opt`);
      const fb = box.querySelector(`.feedback`);
      opts[item.c].classList.add(`correct`);
      if (answers[qi] === item.c) {
        score++;
        fb.className = `feedback ok`;
        fb.textContent = `Správně.`;
      } else {
        opts[answers[qi]].classList.add(`wrong`);
        fb.className = `feedback bad`;
        fb.textContent = `Špatně. Správná odpověď: ` + letters[item.c] + `) ` + item.o[item.c];
      }
    });
    scoreEl.textContent = score + ` z ` + questions.length;
    const v = verdicts.find(function (x) { return score >= x.min && score <= x.max; });
    verdictEl.textContent = v ? v.text : ``;
    evalBtn.style.display = `none`;
    hint.style.display = `none`;
    resultEl.style.display = `block`;
    resultEl.scrollIntoView({ behavior: `smooth`, block: `start` });
  });

  retryBtn.addEventListener(`click`, function () {
    render();
    window.scrollTo({ top: 0, behavior: `smooth` });
  });

  render();
})();
</script>
</body>
</html>
